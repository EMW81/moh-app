a defensive position when the enemy fanatically attacked threatening to overrun the position. Cpl. Miyamura, a machine gun squad leader, aware of the imminent danger to his men unhesitatingly jumped from his shelter wielding his bayonet in close hand-to-hand combat killing approximately 10 of the enemy. Returning to his position, he administered first aid to the wounded and directed their evacuation. As another savage assault hit the line, he manned his machine gun and delivered withering fire until his ammunition was expended. He ordered the squad to withdraw while he stayed behind to render the gun inoperative. He then bayoneted his way through infiltrated enemy soldiers to a second gun emplacement and assisted in its operation. When the intensity of the attack necessitated the withdrawal of the company Cpl. Miyamura ordered his men to fall back while he remained to cover their movement. He killed more than 50 of the enemy before his ammunition was depleted and he was severely wounded. He maintained his magnificent stand despite his painful wounds, continuing to repel the attack until his position was overrun. When last seen he was fighting ferociously against an overwhelming number of enemy soldiers. Cpl. Miyamura's indomitable heroism and consummate devotion to duty reflect the utmost glory on himself and uphold the illustrious traditions on the military service.","category_hints":"Last Stand; Unbroken in Captivity; New American","categories":["The Last Stand","Unbroken in Captivity","The New American / Immigrant's Debt"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3160/miyamura-hiroshi-h.php"},{"id":"william-e-barber","name":"Barber, William E.","rank":"Captain","branch":"U.S. Marine Corps","unit":"Company F, 2d Battalion, 7th Marines, 1st Marine Division","conflict":"Korean War","battle":"Chosin Reservoir (Fox Hill)","year":null,"action_date":null,"action_place":"South Korea","coords":{"lat":35,"lng":127},"survived":true,"accredited_to":"West Liberty, Ky.","born":" Dehart, Ky.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty as commanding officer of Company F in action against enemy aggressor forces. Assigned to defend a 3-mile mountain pass along the division's main supply line and commanding the only route of approach in the march from Yudam-ni to Hagaru-ri, Capt. Barber took position with his battle-weary troops and, before nightfall, had dug in and set up a defense along the frozen, snow-covered hillside. When a force of estimated regimental strength savagely attacked during the night, inflicting heavy casualties and finally surrounding his position following a bitterly fought 7-hour conflict, Capt. Barber, after repulsing the enemy gave assurance that he could hold if supplied by airdrops and requested permission to stand fast when orders were received by radio to fight his way back to a relieving force after 2 reinforcing units had been driven back under fierce resistance in their attempts to reach the isolated troops. Aware that leaving the position would sever contact with the 8,000 marines trapped at Yudam-ni and jeopardize their chances of joining the 3,000 more awaiting their arrival in Hagaru-ri for the continued drive to the sea, he chose to risk loss of his command rather than sacrifice more men if the enemy seized control and forced a renewed battle to regain the position, or abandon his many wounded who were unable to walk. Although severely wounded in the leg in the early morning of the 29th, Capt. Barber continued to maintain personal control, often moving up and down the lines on a stretcher to direct the defense and consistently encouraging and inspiring his men to supreme efforts despite the staggering opposition. Waging desperate battle throughout 5 days and 6 nights of repeated onslaughts launched by the fanatical aggressors, he and his heroic command accounted for approximately 1,000 enemy dead in this epic stand in bitter subzero weather, and when the company was relieved only 82 of his original 220 men were able to walk away from the position so valiantly defended against insuperable odds. His profound faith and courage, great personal valor, and unwavering fortitude were decisive factors in the successful withdrawal of the division from the deathtrap in the Chosin Reservoir sector and reflect the highest credit upon Capt. Barber, his intrepid officers and men, and the U.S. Naval Service.","category_hints":"Last Stand; Rallying Point","categories":["The Last Stand","The Rallying Point","The Wounded Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3081/barber-william-e.php"},{"id":"roy-p-benavidez","name":"Benavidez, Roy P.","rank":"Master Sergeant","branch":"U.S. Army","unit":"Detachment B-56, 5th Special Forces Group","conflict":"Vietnam War","battle":null,"year":null,"action_date":null,"action_place":"Vietnam","coords":{"lat":14,"lng":108},"survived":true,"accredited_to":"Houston, Texas June 1955","born":" DeWitt County, Cuero, Texas","citation":"Master Sergeant (then Staff Sergeant) Roy P. Benavidez United States Army, who distinguished himself by a series of daring and extremely valorous actions on 2 May 1968 while assigned to Detachment B56, 5th Special Forces Group (Airborne), 1st Special Forces, Republic of Vietnam. On the morning of 2 May 1968, a 12-man Special Forces Reconnaissance Team was inserted by helicopters in a dense jungle area west of Loc Ninh, Vietnam to gather intelligence information about confirmed large-scale enemy activity. This area was controlled and routinely patrolled by the North Vietnamese Army. After a short period of time on the ground, the team met heavy enemy resistance, and requested emergency extraction. Three helicopters attempted extraction, but were unable to land due to intense enemy small arms and anti-aircraft fire. Sergeant Benavidez was at the Forward Operating Base in Loc Ninh monitoring the operation by radio when these helicopters returned to off-load wounded crewmembers and to assess aircraft damage. Sergeant Benavidez voluntarily boarded a returning aircraft to assist in another extraction attempt. Realizing that all the team members were either dead or wounded and unable to move to the pickup zone, he directed the aircraft to a nearby clearing where he jumped from the hovering helicopter, and ran approximately 75 meters under withering small arms fire to the crippled team. Prior to reaching the team's position he was wounded in his right leg, face, and head. Despite these painful injuries, he took charge, repositioning the team members and directing their fire to facilitate the landing of an extraction aircraft, and the loading of wounded and dead team members. He then threw smoke canisters to direct the aircraft to the team's position. Despite his severe wounds and under intense enemy fire, he carried and dragged half of the wounded team members to the awaiting aircraft. He then provided protective fire by running alongside the aircraft as it moved to pick up the remaining team members. As the enemy's fire intensified, he hurried to recover the body and classified documents on the dead team leader. When he reached the leader's body, Sergeant Benavidez was severely wounded by small arms fire in the abdomen and grenade fragments in his back. At nearly the same moment, the aircraft pilot was mortally wounded, and his helicopter crashed. Although in extremely critical condition due to his multiple wounds, Sergeant Benavidez secured the classified documents and made his way back to the wreckage, where he aided the wounded out of the overturned aircraft, and gathered the stunned survivors into a defensive perimeter. Under increasing enemy automatic weapons and grenade fire, he moved around the perimeter distributing water and ammunition to his weary men, reinstilling in them a will to live and fight. Facing a buildup of enemy opposition with a beleaguered team, Sergeant Benavidez mustered his strength, began calling in tactical air strikes and directed the fire from supporting gunships to suppress the enemy's fire and so permit another extraction attempt. He was wounded again in his thigh by small arms fire while administering first aid to a wounded team member just before another extraction helicopter was able to land. His indomitable spirit kept him going as he began to ferry his comrades to the craft. On his second trip with the wounded, he was clubbed from additional wounds to his head and arms before killing his adversary. He then continued under devastating fire to carry the wounded to the helicopter. Upon reaching the aircraft, he spotted and killed two enemy soldiers who were rushing the craft from an angle that prevented the aircraft door gunner from firing upon them. With little strength remaining, he made one last trip to the perimeter to ensure that all classified material had been collected or destroyed, and to bring in the remaining wounded. Only then, in extremely serious condition from numerous wounds and loss of blood, did he allow himself to be pulled into the extraction aircraft. Sergeant Benavidez' gallant choice to join voluntarily his comrades who were in critical straits, to expose himself constantly to withering enemy fire, and his refusal to be stopped despite numerous severe wounds, saved the lives of at least eight men. His fearless personal leadership, tenacious devotion to duty, and extremely valorous actions in the face of overwhelming odds were in keeping with the highest traditions of the military service, and reflect the utmost credit on him and the United States Army.","category_hints":"Miraculous/Left for Dead; Rescue; Brotherhood","categories":["The Rescue & Lifesaver","Miraculous / Left for Dead","Brotherhood / No One Left Behind","The Wounded Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3229/benavidez-roy-p.php"},{"id":"ed-w-freeman","name":"Freeman, Ed W.","rank":"Captain","branch":"U.S. Army","unit":"Company A, 229th Assault Helicopter Battalion, 1st Cavalry Division","conflict":"Vietnam War","battle":"Ia Drang","year":null,"action_date":null,"action_place":"Vietnam","coords":{"lat":14,"lng":108},"survived":true,"accredited_to":"Hattiesburg, MS","born":" Hattiesburg, MS","citation":"Captain Ed W. Freeman, United States Army, distinguished himself by numerous acts of conspicuous gallantry and extraordinary intrepidity on 14 November 1965 while serving with Company A, 229th Assault Helicopter Battalion, 1st Cavalry Division (Airmobile). As a flight leader and second in command of a 16-helicopter lift unit, he supported a heavily engaged American infantry battalion at Landing Zone X-Ray in the Ia Drang Valley, Republic of Vietnam. The unit was almost out of ammunition after taking some of the heaviest casualties of the war, fighting off a relentless attack from a highly motivated, heavily armed enemy force. When the infantry commander closed the helicopter landing zone due to intense direct enemy fire, Captain Freeman risked his own life by flying his unarmed helicopter through a gauntlet of enemy fire time after time, delivering critically needed ammunition, water and medical supplies to the besieged battalion. His flights had a direct impact on the battle's outcome by providing the engaged units with timely supplies of ammunition critical to their survival, without which they would almost surely have gone down, with much greater loss of life. After medical evacuation helicopters refused to fly into the area due to intense enemy fire, Captain Freeman flew 14 separate rescue missions, providing life-saving evacuation of an estimated 30 seriously wounded soldiers -- some of whom would not have survived had he not acted. All flights were made into a small emergency landing zone within 100 to 200 meters of the defensive perimeter where heavily committed units were perilously holding off the attacking elements. Captain Freeman's selfless acts of great valor, extraordinary perseverance and intrepidity were far above and beyond the call of duty or mission and set a superb example of leadership and courage for all of his peers. Captain Freeman's extraordinary heroism and devotion to duty are in keeping with the highest traditions of military service and reflect great credit upon himself, his unit and the United States Army.","category_hints":"Wings; Rescue; Belated Justice 2001","categories":["Wings","The Rescue & Lifesaver","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3286/freeman-ed-w.php"},{"id":"william-h-pitsenbarger","name":"Pitsenbarger, William H.","rank":"Airman First Class","branch":"U.S. Air Force","unit":"","conflict":"Vietnam War","battle":null,"year":null,"action_date":null,"action_place":"C?m M?, C?m Xuy?n, H? T?nh, Vietnam","coords":{"lat":18,"lng":105},"survived":false,"accredited_to":null,"born":null,"citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty. Airman First Class Pitsenbarger distinguished himself by extreme valor on 11 April 1966 near Cam My, Republic of Vietnam, while assigned as a Pararescue Crew Member, Detachment 6, 38th Aerospace Rescue and Recovery Squadron. On that date, Airman Pitsenbarger was aboard a rescue helicopter responding to a call for evacuation of casualties incurred in an ongoing firefight between elements of the United States Army's 1st Infantry Division and a sizeable enemy force approximately 35 miles east of Saigon. With complete disregard for personal safety, Airman Pitsenbarger volunteered to ride a hoist more than one hundred feet through the jungle, to the ground. On the ground, he organized and coordinated rescue efforts, cared for the wounded, prepared casualties for evacuation, and insured that the recovery operation continued in a smooth and orderly fashion. Through his personal efforts, the evacuation of the wounded was greatly expedited. As each of the nine casualties evacuated that day was recovered, Airman Pitsenbarger refused evacuation in order to get more wounded soldiers to safety. After several pick-ups, one of the two rescue helicopters involved in the evacuation was struck by heavy enemy ground fire and was forced to leave the scene for an emergency landing. Airman Pitsenbarger stayed behind on the ground to perform medical duties. Shortly thereafter, the area came under sniper and mortar fire. During a subsequent attempt to evacuate the site, American forces came under heavy assault by a large Viet Cong force. When the enemy launched the assault, the evacuation was called off and Airman Pitsenbarger took up arms with the besieged infantrymen. He courageously resisted the enemy, braving intense gunfire to gather and distribute vital ammunition to American defenders. As the battle raged on, he repeatedly exposed himself to enemy fire to care for the wounded, pull them out of the line of fire, and return fire whenever he could, during which time he was wounded three times. Despite his wounds, he valiantly fought on, simultaneously treating as many wounded as possible. In the vicious fighting that followed, the American forces suffered 80 percent casualties as their perimeter was breached, and Airman Pitsenbarger was fatally wounded. Airman Pitsenbarger exposed himself to almost certain death by staying on the ground, and perished while saving the lives of wounded infantrymen. His bravery and determination exemplify the highest professional standards and traditions of military service and reflect great credit upon himself, his unit, and the United States Air Force.","category_hints":"Healer Under Fire; Greater Love; Belated Justice 2000","categories":["The Healer Under Fire","Greater Love","The Fallen / Ultimate Sacrifice","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3388/pitsenbarger-william-h.php"},{"id":"thomas-r-norris","name":"Norris, Thomas R.","rank":"Lieutenant","branch":"U.S. Navy","unit":"Strategic Technical Directorate Assitance Team, U.S. Army Support Command","conflict":"Vietnam War","battle":null,"year":null,"action_date":null,"action_place":"Honorary Consulate General of the Republic of the Philippines, ph??ng 19, B?nh Th?nh, H? Ch? Minh, Vietnam","coords":{"lat":10,"lng":106},"survived":true,"accredited_to":"Silver Springs, MD","born":" Jacksonville, Fla.","citation":"Lt. Norris completed an unprecedented ground rescue of 2 downed pilots deep within heavily controlled enemy territory in Quang Tri Province. Lt. Norris, on the night of 10 April, led a 5-man patrol through 2,000 meters of heavily controlled enemy territory, located 1 of the downed pilots at daybreak, and returned to the Forward Operating Base (FOB). On 11 April, after a devastating mortar and rocket attack on the small FOB, Lt. Norris led a 3-man team on 2 unsuccessful rescue attempts for the second pilot. On the afternoon of the 12th, a forward air controller located the pilot and notified Lt. Norris. Dressed in fishermen disguises and using a sampan, Lt. Norris and 1 Vietnamese traveled throughout that night and found the injured pilot at dawn. Covering the pilot with bamboo and vegetation, they began the return journey, successfully evading a North Vietnamese patrol. Approaching the FOB, they came under heavy machinegun fire. Lt. Norris called in an air strike which provided suppression fire and a smoke screen, allowing the rescue party to reach the FOB. By his outstanding display of decisive leadership, undaunted courage, and selfless dedication in the face of extreme danger, Lt. Norris enhanced the finest traditions of the U.S. Naval Service.","category_hints":"Rescue - Bat 21 recovery","categories":["The Rescue & Lifesaver","One Against Many"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3374/norris-thomas-r.php"},{"id":"michael-edwin-thornton","name":"Thornton, Michael Edwin","rank":"Petty Officer","branch":"U.S. Navy","unit":"","conflict":"Vietnam War","battle":null,"year":1972,"action_date":"1972-10-31","action_place":"Honorary Consulate General of the Republic of the Philippines, ph??ng 19, B?nh Th?nh, H? Ch? Minh, Vietnam","coords":{"lat":10,"lng":106},"survived":true,"accredited_to":"Spartanburg, S.C.","born":" Greenville, S.C.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty while participating in a daring operation against enemy forces. PO Thornton, as Assistant U.S. Navy Advisor, along with a U.S. Navy lieutenant serving as Senior Advisor, accompanied a 3-man Vietnamese Navy SEAL patrol on an intelligence gathering and prisoner capture operation against an enemy-occupied naval river base. Launched from a Vietnamese Navy junk in a rubber boat, the patrol reached land and was continuing on foot toward its objective when it suddenly came under heavy fire from a numerically superior force. The patrol called in naval gunfire support and then engaged the enemy in a fierce firefight, accounting for many enemy casualties before moving back to the waterline to prevent encirclement. Upon learning that the Senior Advisor had been hit by enemy fire and was was believed to be dead, PO Thornton returned through a hail of fire to the lieutenant's last position; quickly disposed of 2 enemy soldiers about to overrun the position, and succeeded in removing the seriously wounded and unconscious Senior Naval Advisor to the water's edge. He then inflated the lieutenant's lifejacket and towed him seaward for approximately 2 hours until picked up by support craft. By his extraordinary courage and perseverance, PO Thornton was directly responsible for saving the life of his superior officer and enabling the safe extraction of all patrol members, thereby upholding the highest traditions of the U.S. Naval Service.","category_hints":"Brotherhood - carried the wounded Norris to sea; only recipient to save a fellow recipient","categories":["The Rescue & Lifesaver","Brotherhood / No One Left Behind","Greater Love"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3432/thornton-michael-edwin.php"},{"id":"james-b-stockdale","name":"Stockdale, James B.","rank":"Rear Admiral","branch":"U.S. Navy","unit":"","conflict":"Vietnam War","battle":null,"year":1969,"action_date":"1969-9-4","action_place":"Hoa Lo Prison, Ho? L?, Tr?n H?ng ??o, Ho?n Ki?m, H? N?i, Vietnam","coords":{"lat":21,"lng":105},"survived":true,"accredited_to":"Abingdon, Ill.","born":" Abingdon, Ill.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty while senior naval officer in the Prisoner of War camps of North Vietnam. Recognized by his captors as the leader in the Prisoners' of War resistance to interrogation and in their refusal to participate in propaganda exploitation, Rear Adm. Stockdale was singled out for interrogation and attendant torture after he was detected in a covert communications attempt. Sensing the start of another purge, and aware that his earlier efforts at self-disfiguration to dissuade his captors from exploiting him for propaganda purposes had resulted in cruel and agonizing punishment, Rear Adm. Stockdale resolved to make himself a symbol of resistance regardless of personal sacrifice. He deliberately inflicted a near-mortal wound to his person in order to convince his captors of his willingness to give up his life rather than capitulate. He was subsequently discovered and revived by the North Vietnamese who, convinced of his indomitable spirit, abated in their employment of excessive harassment and torture toward all of the Prisoners of War. By his heroic action, at great peril to himself, he earned the everlasting gratitude of his fellow prisoners and of his country. Rear Adm. Stockdale's valiant leadership and extraordinary courage in a hostile environment sustain and enhance the finest traditions of the U.S. Naval Service.","category_hints":"Unbroken in Captivity; Epic Second Act","categories":["Unbroken in Captivity","The Epic Second Act"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3423/stockdale-james-b.php"},{"id":"bennie-g-adkins","name":"Adkins, Bennie G.","rank":"Sergeant First Class","branch":"U.S. Army","unit":"Detachment A-102, 5th Special Forces Group (Airborne), 1st Special Forces","conflict":"Vietnam War","battle":"Camp A Shau","year":null,"action_date":null,"action_place":"9 12, 8640 Rapperswil-Jona, Switzerland","coords":{"lat":47,"lng":8},"survived":true,"accredited_to":"Waurika, Oklahoma","born":" Waurika, Okla.","citation":"Sergeant First Class Adkins distinguished himself during the period 9 March 1966 to 12 March 1966 during combat operations at Camp A Shau, Republic of Vietnam. When the camp was attacked by a large Viet Cong force, Sergeant First Class Adkins rushed through intense hostile fire and manned a mortar position. Although he was wounded, he ran through exploding mortar rounds and dragged several of his comrades to safety. When the hostile fire subsided, Sergeant First Class Adkins exposed himself to sporadic sniper fire and carried his wounded comrades to the camp dispensary. During the evacuation of a seriously wounded American, Sergeant First Class Adkins maneuvered outside the camp walls to draw fire and successfully covered the rescue. During the early morning hours of 10 March 1966, a Viet Cong regiment launched their main attack. Within two hours, Sergeant First Class Adkins was the only man firing a mortar weapon. Although he was painfully wounded and most of his crew was killed or wounded, he fought off the fanatical waves of attacking Viet Cong. After withdrawing to a communications bunker where several Americans were attempting to fight off a company of Viet Cong, Sergeant First Class Adkins killed numerous insurgents with his suppressive fire. Running extremely low on ammunition, he returned to the mortar pit, gathered the vital ammunition, and ran through intense fire back to the communications bunker. After being ordered to evacuate the camp, all signal equipment and classified documents were destroyed. Sergeant First Class Adkins and a small group of men fought their way out of the camp and evaded the Viet Cong for two days until they were rescued by a helicopter. Sergeant First Class Adkins' extraordinary heroism in close combat against a numerically superior hostile force was in keeping with the highest traditions of the military service and reflect great credit upon himself, his unit, and the United States Army.","category_hints":"One Against Many; 38 hours of continuous combat","categories":["One Against Many","The Last Stand","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3513/adkins-bennie-g.php"},{"id":"randall-d-shughart","name":"Shughart, Randall D.","rank":"Sergeant First Class","branch":"U.S. Army","unit":"","conflict":"Somalia (Operation Restore Hope)","battle":"Battle of Mogadishu","year":null,"action_date":null,"action_place":"Mogadishu, Somalia","coords":{"lat":2,"lng":45},"survived":false,"accredited_to":"Newville, Pennsylvania","born":"Lincoln, Nebraska","citation":"Sergeant First Class Shughart, United States Army, distinguished himself by actions above and beyond the call of duty on 3 October 1993, while serving as a Sniper Team Member, United States Army Special Operations Command with Task Force Ranger in Mogadishu, Somalia. Sergeant First Class Shughart provided precision sniper fires from the lead helicopter during an assault on a building and at two helicopter crash sites, while subjected to intense automatic weapons and rocket propelled grenade fires. While providing critical suppressive fires at the second crash site, Sergeant First Class Shughart and his team leader learned that ground forces were not immediately available to secure the site. Sergeant First Class Shughart and his team leader unhesitatingly volunteered to be inserted to protect the four critically wounded personnel, despite being well aware of the growing number of enemy personnel closing in on the site. After their third request to be inserted, Sergeant First Class Shughart and his team leader received permission to perform this volunteer mission. When debris and enemy ground fires at the site caused them to abort the first attempt, Sergeant First Class Shughart and his team leader were inserted one hundred meters south of the crash site. Equipped with only his sniper rifle and a pistol, Sergeant First Class Shughart and his team leader, while under intense small arms fire from the enemy, fought their way through a dense maze of shanties and shacks to reach the critically injured crew members. Sergeant First Class Shughart pulled the pilot and the other crew members from the aircraft, establishing a perimeter which placed him and his fellow sniper in the most vulnerable position. Sergeant First Class Shughart used his long range rifle and side arm to kill an undetermined number of attackers while traveling the perimeter, protecting the downed crew. Sergeant First Class Shughart continued his protective fire until he depleted his ammunition and was fatally wounded. His actions saved the pilot's life. Sergeant First Class Shughart's extraordinary heroism and devotion to duty were in keeping with the highest standards of military service and reflect great credit upon him, his unit and the United States Army.","category_hints":"Greater Love; Brotherhood - volunteered to defend downed crew","categories":["Greater Love","Brotherhood / No One Left Behind","The Last Stand","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2198/shughart-randall-d.php"},{"id":"gary-i-gordon","name":"Gordon, Gary I.","rank":"Master Sergeant","branch":"U.S. Army","unit":"","conflict":"Somalia (Operation Restore Hope)","battle":"Battle of Mogadishu","year":null,"action_date":null,"action_place":"Mogadishu, Somalia","coords":{"lat":2,"lng":45},"survived":false,"accredited_to":null,"born":"Lincoln, Maine","citation":"Master Sergeant Gordon, United States Army, distinguished himself by actions above and beyond the call of duty on 3 October 1993, while serving as Sniper Team Leader, United States Army Special Operations Command with Task Force Ranger in Mogadishu, Somalia. Master Sergeant Gordon's sniper team provided precision fires from the lead helicopter during an assault and at two helicopter crash sites, while subjected to intense automatic weapons and rocket propelled grenade fires. When Master Sergeant Gordon learned that ground forces were not immediately available to secure the second crash site, he and another sniper unhesitatingly volunteered to be inserted to protect the four critically wounded personnel, despite being well aware of the growing number of enemy personnel closing in on the site. After his third request to be inserted, Master Sergeant Gordon received permission to perform his volunteer mission. When debris and enemy ground fires at the site caused them to abort the first attempt, Master Sergeant Gordon was inserted one hundred meters south of the crash site. Equipped with only his sniper rifle and a pistol, Master Sergeant Gordon and his fellow sniper, while under intense small arms fire from the enemy, fought their way through a dense maze of shanties and shacks to reach the critically injured crew members. Master Sergeant Gordon immediately pulled the pilot and the other crew members from the aircraft, establishing a perimeter which placed him and his fellow sniper in the most vulnerable position. Master Sergeant Gordon used his long range rifle and side arm to kill an undetermined number of attackers until he depleted his ammunition. Master Sergeant Gordon then went back to the wreckage, recovering some of the crew's weapons and ammunition. Despite the fact that he was critically low on ammunition, he provided some of it to the dazed pilot and then radioed for help. Master Sergeant Gordon continued to travel the perimeter, protecting the downed crew. After his team member was fatally wounded and his own rifle ammunition exhausted, Master Sergeant Gordon returned to the wreckage, recovering a rifle with the last five rounds of ammunition and gave it to the pilot with the words, \"good luck.\" Then, armed only with his pistol, Master Sergeant Gordon continued to fight until he was fatally wounded. His actions saved the pilot's life. Master Sergeant Gordon's extraordinary heroism and devotion to duty were in keeping with the highest standards of military service and reflect great credit upon him, his unit and the United States Army.","category_hints":"Greater Love; Brotherhood","categories":["Greater Love","Brotherhood / No One Left Behind","The Last Stand","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2197/gordon-gary-i.php"},{"id":"paul-r-smith","name":"Smith, Paul R.","rank":"Sergeant First Class","branch":"U.S. Army","unit":"","conflict":"War on Terrorism (Iraq)","battle":"Baghdad Airport","year":null,"action_date":null,"action_place":"Baghdad, Iraq","coords":{"lat":33,"lng":44},"survived":false,"accredited_to":"October 1989","born":null,"citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty:Sergeant First Class Paul R. Smith distinguished himself by acts of gallantry and intrepidity above and beyond the call of duty in action with an armed enemy near Baghdad International Airport, Baghdad, Iraq on 4 April 2003. On that day, Sergeant First Class Smith was engaged in the construction of a prisoner of war holding area when his Task Force was violently attacked by a company-sized enemy force. Realizing the vulnerability of over 100 fellow soldiers, Sergeant First Class Smith quickly organized a hasty defense consisting of two platoons of soldiers, one Bradley Fighting Vehicle and three armored personnel carriers. As the fight developed, Sergeant First Class Smith braved hostile enemy fire to personally engage the enemy with hand grenades and anti-tank weapons, and organized the evacuation of three wounded soldiers from an armored personnel carrier struck by a rocket propelled grenade and a 60mm mortar round. Fearing the enemy would overrun their defenses, Sergeant First Class Smith moved under withering enemy fire to man a .50 caliber machine gun mounted on a damaged armored personnel carrier. In total disregard for his own life, he maintained his exposed position in order to engage the attacking enemy force. During this action, he was mortally wounded. His courageous actions helped defeat the enemy attack, and resulted in as many as 50 enemy soldiers killed, while allowing the safe withdrawal of numerous wounded soldiers. Sergeant First Class Smith?s extraordinary heroism and uncommon valor are in keeping with the highest traditions of the military service and reflect great credit upon himself, the Third Infantry Division ?Rock of the Marne,? and the United States Army.","category_hints":"Last Stand; The Fallen","categories":["The Last Stand","The Rallying Point","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3461/smith-paul-r.php"},{"id":"ross-a-mcginnis","name":"Mcginnis, Ross A.","rank":"Private First Class","branch":"U.S. Army","unit":"Company C, 1st Battalion, 1st Infantry Division","conflict":"War on Terrorism (Iraq)","battle":null,"year":null,"action_date":null,"action_place":"Baghdad, Iraq","coords":{"lat":33,"lng":44},"survived":false,"accredited_to":"June 14, 2004 in Pittsburgh, Pa.","born":"June 14, 1987 in Meadville, Pa.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty:\nPrivate First Class Ross A. McGinnis distinguished himself by acts of gallantry and intrepidity above and beyond the call of duty while serving as an M2 .50-caliber Machine Gunner, 1st Platoon, C Company, 1st Battalion, 26th Infantry Regiment, in connection with combat operations against an armed enemy in Adhamiyah, Northeast Baghdad, Iraq, on 4 December 2006.\n\nThat afternoon his platoon was conducting combat control operations in an effort to reduce and control sectarian violence in the area. While Private McGinnis was manning the M2 .50-caliber Machine Gun, a fragmentation grenade thrown by an insurgent fell through the gunner's hatch into the vehicle. Reacting quickly, he yelled \"grenade,\" allowing all four members of his crew to prepare for the grenade's blast. Then, rather than leaping from the gunner's hatch to safety, Private McGinnis made the courageous decision to protect his crew. In a selfless act of bravery, in which he was mortally wounded, Private McGinnis covered the live grenade, pinning it between his body and the vehicle and absorbing most of the explosion.\n\nPrivate McGinnis' gallant action directly saved four men from certain serious injury or death. Private First Class McGinnis' extraordinary heroism and selflessness at the cost of his own life, above and beyond the call of duty, are in keeping with the highest traditions of the military service and reflect great credit upon himself, his unit, and the United States Army.","category_hints":"Body on the Grenade; The Boy - age 19","categories":["The Body on the Grenade","The Boy (Too Young for This)","Greater Love","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3459/mcginnis-ross-a.php"},{"id":"michael-p-murphy","name":"Murphy, Michael P.","rank":"Lieutenant","branch":"U.S. Navy","unit":"ALFA Platoon, SEAL Delivery Vehicle Team 1","conflict":"War on Terrorism (Afghanistan)","battle":"Operation Red Wings","year":2005,"action_date":"2005-6-28","action_place":"Asadabad, Afghanistan","coords":{"lat":34,"lng":71},"survived":false,"accredited_to":"Pensacola, Fla.","born":"May 7, 1976 in Smithtown, N.Y.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty as the leader of a special reconnaissance element with Naval Special Warfare Task Unit Afghanistan on 27 and 28 June 2005. While leading a mission to locate a high-level anti-coalition militia leader, Lieutenant Murphy demonstrated extraordinary heroism in the face of grave danger in the vicinity of Asadabad, Konar Province, Afghanistan. On 28 June 2005, operating in an extremely rugged enemy-controlled area, Lieutenant Murphy?s team was discovered by anti-coalition militia sympathizers, who revealed their position to Taliban fighters. As a result, between 30 and 40 enemy fighters besieged his four-member team. Demonstrating exceptional resolve, Lieutenant Murphy valiantly led his men in engaging the large enemy force. The ensuing fierce firefight resulted in numerous enemy casualties, as well as the wounding of all four members of the team. Ignoring his own wounds and demonstrating exceptional composure, Lieutenant Murphy continued to lead and encourage his men. When the primary communicator fell mortally wounded, Lieutenant Murphy repeatedly attempted to call for assistance for his beleaguered teammates. Realizing the impossibility of communicating in the extreme terrain, and in the face of almost certain death, he fought his way into open terrain to gain a better position to transmit a call. This deliberate, heroic act deprived him of cover, exposing him to direct enemy fire. Finally achieving contact with his Headquarters, Lieutenant Murphy maintained his exposed position while he provided his location and requested immediate support for his team. In his final act of bravery, he continued to engage the enemy until he was mortally wounded, gallantly giving his life for his country and for the cause of freedom. By his selfless leadership, courageous actions, and extraordinary devotion to duty, Lieutenant Murphy reflected great credit upon himself and upheld the highest traditions of the United States Naval Service.","category_hints":"Greater Love - exposed himself to transmit for his team","categories":["The Last Stand","Greater Love","Brotherhood / No One Left Behind","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2199/murphy-michael-p.php"},{"id":"jared-c-monti","name":"Monti, Jared C.","rank":"Sergeant First Class","branch":"U.S. Army","unit":"Headquarters Company, 10th Mountain","conflict":"War on Terrorism (Afghanistan)","battle":null,"year":null,"action_date":null,"action_place":"Nurestan, Afghanistan","coords":{"lat":35,"lng":70},"survived":false,"accredited_to":"Rayntham, Mass.","born":" Abington, Mass.","citation":"Staff Sergeant Jared C. Monti distinguished himself by acts of gallantry and intrepidity above and beyond the call of duty while serving as a team leader with Headquarters and Headquarters Troop, 3d Squadron, 71st Cavalry Regiment, 3d Brigade Combat Team, 10th Mountain Division, in connection with combat operations against an armed enemy in Nuristan Province, Afghanistan, on June 21, 2006. While Staff Sergeant Monti was leading a mission aimed at gathering intelligence and directing fire against the enemy, his 16-man patrol was attacked by as many as 50 enemy fighters. On the verge of being overrun, Staff Sergeant Monti quickly directed his men to set up a defensive position behind a rock formation. He then called for indirect fire support, accurately targeting the rounds upon the enemy who had closed to within 50 meters of his position. While still directing fire, Staff Sergeant Monti personally engaged the enemy with his rifle and a grenade, successfully disrupting an attempt to flank his patrol. Staff Sergeant Monti then realized that one of his Soldiers was lying wounded in the open ground between the advancing enemy and the patrol?s position. With complete disregard for his own safety, Staff Sergeant Monti twice attempted to move from behind the cover of the rocks into the face of relentless enemy fire to rescue his fallen comrade. Determined not to leave his Soldier, Staff Sergeant Monti made a third attempt to cross open terrain through intense enemy fire. On this final attempt, he was mortally wounded, sacrificing his own life in an effort to save his fellow Soldier. Staff Sergeant Monti?s selfless acts of heroism inspired his patrol to fight off the larger enemy force. Staff Sergeant Monti?s immeasurable courage and uncommon valor are in keeping with the highest traditions of military service and reflect great credit upon himself, Headquarters and Headquarters Troop, 3rd Squadron, 71st Cavalry Regiment, 3rd Brigade Combat Team, 10th Mountain Division, and the United States Army.","category_hints":"Brotherhood - died attempting to retrieve a fallen soldier","categories":["Greater Love","Brotherhood / No One Left Behind","The Rescue & Lifesaver","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3467/monti-jared-c.php"},{"id":"robert-j-miller","name":"Miller, Robert J.","rank":"Staff Sergeant","branch":"U.S. Army","unit":"Special Forces Operational Detachment Alpha 3312, Special Operations Task Force 33","conflict":"War on Terrorism (Afghanistan)","battle":null,"year":null,"action_date":null,"action_place":"Kunar, Afghanistan","coords":{"lat":34,"lng":71},"survived":false,"accredited_to":"Florida","born":"14 October 1983","citation":"Robert J. Miller distinguished himself by extraordinary acts of heroism while serving as the Weapons Sergeant in Special Forces Operational Detachment Alpha 3312, Special Operations Task Force-33, Combined Joint Special Operations Task Force-Afghanistan during combat operations against an armed enemy in Konar Province, Afghanistan on January 25, 2008. While conducting a combat reconnaissance patrol through the Gowardesh Valley, Staff Sergeant Miller and his small element of U.S. and Afghan National Army soldiers engaged a force of 15 to 20 insurgents occupying prepared fighting positions. Staff Sergeant Miller initiated the assault by engaging the enemy positions with his vehicle's turret-mounted Mark-19 40 millimeter automatic grenade launcher while simultaneously providing detailed descriptions of the enemy positions to his command, enabling effective, accurate close air support. Following the engagement, Staff Sergeant Miller led a small squad forward to conduct a battle damage assessment. As the group neared the small, steep, narrow valley that the enemy had inhabited, a large, well-coordinated insurgent force initiated a near ambush, assaulting from elevated positions with ample cover.  Exposed and with little available cover, the patrol was totally vulnerable to enemy rocket propelled grenades and automatic weapon fire. As point man, Staff Sergeant Miller was at the front of the patrol, cut off from supporting elements, and less than 20 meters from enemy forces. Nonetheless, with total disregard for his own safety, he called for his men to quickly move back to covered positions as he charged the enemy over exposed ground and under overwhelming enemy fire in order to provide protective fire for his team. While maneuvering to engage the enemy, Staff Sergeant Miller was shot in his upper torso. Ignoring the wound, he continued to push the fight, moving to draw fire from over one hundred enemy fighters upon himself. He then again charged forward through an open area in order to allow his teammates to safely reach cover. After killing at least 10 insurgents, wounding dozens more, and repeatedly exposing himself to withering enemy fire while moving from position to position, Staff Sergeant Miller was mortally wounded by enemy fire. His extraordinary valor ultimately saved the lives of seven members of his own team and 15 Afghanistan National Army soldiers. Staff Sergeant Miller's heroism and selflessness above and beyond the call of duty, and at the cost of his own life, are in keeping with the highest traditions of military service and reflect great credit upon himself and the United States Army.","category_hints":"One Against Many; The Fallen","categories":["One Against Many","Greater Love","Brotherhood / No One Left Behind","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3470/miller-robert-j.php"},{"id":"leroy-a-petry","name":"Petry, Leroy A.","rank":"Staff Sergeant","branch":"U.S. Army","unit":"Company D, 2d Battalion, 75th Ranger Regiment","conflict":"War on Terrorism (Afghanistan)","battle":null,"year":null,"action_date":null,"action_place":"Paktika, Afghanistan","coords":{"lat":32,"lng":68},"survived":true,"accredited_to":"New Mexico","born":" Santa Fe, NM","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty: Staff Sergeant Leroy A. Petry distinguished himself by acts of gallantry and intrepidity at the risk of his life above and beyond the call of duty in action with an armed enemy in the vicinity of Paktya Province, Afghanistan, on May 26, 2008. As a Weapons Squad Leader with D Company, 2nd Battalion, 75th Ranger Regiment, Staff Sergeant Petry moved to clear the courtyard of a house that potentially contained high-value combatants. While crossing the courtyard, Staff Sergeant Petry and another Ranger were engaged and wounded by automatic weapons fire from enemy fighters. Still under enemy fire, and wounded in both legs, Staff Sergeant Petry led the other Ranger to cover. He then reported the situation and engaged the enemy with a hand grenade, providing suppression as another Ranger moved to his position. The enemy quickly responded by maneuvering closer and throwing grenades. The first grenade explosion knocked his two fellow Rangers to the ground and wounded both with shrapnel. A second grenade then landed only a few feet away from them. Instantly realizing the danger, Staff Sergeant Petry, unhesitatingly and with complete disregard for his safety, deliberately and selflessly moved forward, picked up the grenade, and in an effort to clear the immediate threat, threw the grenade away from his fellow Rangers. As he was releasing the grenade it detonated, amputating his right hand at the wrist and further injuring him with multiple shrapnel wounds. Although picking up and throwing the live grenade grievously wounded Staff Sergeant Petry, his gallant act undeniably saved his fellow Rangers from being severely wounded or killed. Despite the severity of his wounds, Staff Sergeant Petry continued to maintain the presence of mind to place a tourniquet on his right wrist before communicating the situation by radio in order to coordinate support for himself and his fellow wounded Rangers. Staff Sergeant Petry's extraordinary heroism and devotion to duty are in keeping with the highest traditions of military service, and reflect great credit upon himself, 75th Ranger Regiment, and the United States Army.","category_hints":"Wounded Warrior - lost hand returning a live grenade","categories":["The Body on the Grenade","Greater Love","The Wounded Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3479/petry-leroy-a.php"},{"id":"dakota-meyer","name":"Meyer, Dakota","rank":"Sergeant","branch":"U.S. Marine Corps","unit":"Embedded Training Team 2-8, Regional Corps Advisory Command 3-7","conflict":"War on Terrorism (Afghanistan)","battle":"Battle of Ganjgal","year":null,"action_date":null,"action_place":"Kunar, Afghanistan","coords":{"lat":34,"lng":71},"survived":true,"accredited_to":"Kentucky","born":" Columbia, KY","citation":"Corporal Meyer maintained security at a patrol rally point while other members of his team moved on foot with two platoons of Afghan National Army and Border Police into the village of Ganjgal for a pre-dawn meeting with village elders. Moving into the village, the patrol was ambushed by more than 50 enemy fighters firing rocket propelled grenades, mortars, and machine guns from houses and fortified positions on the slopes above. Hearing over the radio that four U.S. team members were cut off, Corporal Meyer seized the initiative. With a fellow Marine driving, Corporal Meyer took the exposed gunner's position in a gun-truck as they drove down the steeply terraced terrain in a daring attempt to disrupt the enemy attack and locate the trapped U.S. team. Disregarding intense enemy fire now concentrated on their lone vehicle, Corporal Meyer killed a number of enemy fighters with the mounted machine guns and his rifle, some at near point blank range, as he and his driver made three solo trips into the ambush area. During the first two trips, he and his driver evacuated two dozen Afghan soldiers, many of whom were wounded. When one machine gun became inoperable, he directed a return to the rally point to switch to another gun-truck for a third trip into the ambush area where his accurate fire directly supported the remaining U.S. personnel and Afghan soldiers fighting their way out of the ambush. Despite a shrapnel wound to his arm, Corporal Meyer made two more trips into the ambush area in a third gun-truck accompanied by four other Afghan vehicles to recover more wounded Afghan soldiers and search for the missing U.S. team members. Still under heavy enemy fire, he dismounted the vehicle on the fifth trip and moved on foot to locate and recover the bodies of his team members. Corporal Meyer's daring initiative and bold fighting spirit throughout the 6-hour battle significantly disrupted the enemy's attack and inspired the members of the combined force to fight on. His unwavering courage and steadfast devotion to his U.S. and Afghan comrades in the face of almost certain death reflected great credit upon himself and upheld the highest traditions of the Marine Corps and the United States Naval Service.","category_hints":"Brotherhood; defied orders to recover his team","categories":["One Against Many","Brotherhood / No One Left Behind","The Rescue & Lifesaver"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3480/meyer-dakota.php"},{"id":"william-kyle-carpenter","name":"Carpenter, William Kyle","rank":"Lance Corporal","branch":"U.S. Marine Corps","unit":"Company F, 2d Battalion, 9th Marines","conflict":"War on Terrorism (Afghanistan)","battle":null,"year":null,"action_date":null,"action_place":"Helmand, Afghanistan","coords":{"lat":31,"lng":63},"survived":true,"accredited_to":"South Carolina","born":"17 October, 1989, Flowood, MS","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty while serving as an Automatic Rifleman with Company F, 2d Battalion, 9th Marines, Regimental Combat Team 1, 1st Marine Division (Forward), 1 Marine Expeditionary Force (Forward), in Helmand Province, Afghanistan in support of Operation Enduring Freedom on 21 November 2010.  Lance Corporal Carpenter was a member of a platoon-sized coalition force, comprised of two reinforced Marine squads partnered with an Afghan National Army squad.  The platoon had established Patrol Base Dakota two days earlier in a small village in the Marjah District in order to disrupt enemy activity and provide security for the local Afghan population.  Lance Corporal Carpenter and a fellow Marine were manning a rooftop security position on the perimeter of Patrol Base Dakota when the enemy initiated a daylight attack with hand grenades, one of which landed inside their sandbagged position.  Without hesitation, and with complete disregard for his own safety, Lance Corporal Carpenter moved toward the grenade in an attempt to shield his fellow Marine from the deadly blast.  When the grenade detonated, his body absorbed the brunt of the blast, severely wounding him, but saving the life of his fellow Marine.  By his undaunted courage, bold fighting spirit, and unwavering devotion to duty in the face of almost certain death, Lance Corporal Carpenter reflected great credit upon himself and upheld the highest traditions of the Marine Corps and the United States Naval Service.","category_hints":"Body on the Grenade - survived; Wounded Warrior; Epic Second Act","categories":["The Body on the Grenade","Miraculous / Left for Dead","The Wounded Warrior","The Epic Second Act"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3511/carpenter-william-kyle.php"},{"id":"clinton-l-romesha","name":"Romesha, Clinton L.","rank":"Staff Sergeant","branch":"U.S. Army","unit":"3rd Squadron, 61st Calvary Regiment, 4th Brigade Combat Team, 4th Infantry","conflict":"War on Terrorism (Afghanistan)","battle":"COP Keating (Kamdesh)","year":null,"action_date":null,"action_place":"Nurestan, Afghanistan","coords":{"lat":35,"lng":70},"survived":true,"accredited_to":"California","born":"August 17, 1981 / Lake City, CA","citation":"For conspicuous gallantry and intrepidity in action at the risk of his life above and beyond the call of duty while serving as a Section Leader with Bravo Troop, 3d Squadron, 61st Cavalry Regiment, 4th Brigade Combat Team, 4th Infantry Division, during combat operations against an armed enemy at Combat Outpost Keating, Kamdesh District, Nuristan Province, Afghanistan on 3 October 2009.  On that morning, Staff Sergeant Romesha and his comrades awakened to an attack by an estimated 300 enemy fighters occupying the high ground on all four sides of the complex, employing concentrated fire from recoilless rifles, rocket propelled grenades, anti-aircraft machine guns, mortars and small arms fire.  Staff Sergeant Romesha moved uncovered under intense enemy fire to conduct a reconnaissance of the battlefield and seek reinforcements from the barracks before returning to action with the support of an assistant gunner.  Staff Sergeant Romesha took out an enemy machine gun team and, while engaging a second, the generator he was using for cover was struck by a rocket-propelled grenade, inflicting him with shrapnel wounds.  Undeterred by his injuries, Staff Sergeant Romesha continued to fight and upon the arrival of another soldier to aid him and the assistant gunner, he again rushed through the exposed avenue to assemble additional soldiers.  Staff Sergeant Romesha then mobilized a five-man team and returned to the fight equipped with a sniper rifle.  With complete disregard for his own safety, Staff Sergeant Romesha continually exposed himself to heavy enemy fire, as he moved confidently about the battlefield engaging and destroying multiple enemy targets, including three Taliban fighters who had breached the combat outpost?s perimeter.  While orchestrating a successful plan to secure and reinforce key points of the battlefield, Staff Sergeant Romesha maintained radio communication with the tactical operations center.  As the enemy forces attacked with even greater ferocity, unleashing a barrage of rocket-propelled grenades and recoilless rifle rounds, Staff Sergeant Romesha identified the point of attack and directed air support to destroy over 30 enemy fighters.  After receiving reports that seriously injured soldiers were at a distant battle position, Staff Sergeant Romesha and his team provided covering fire to allow the injured soldiers to safely reach the aid station.  Upon receipt of orders to proceed to the next objective, his team pushed forward 100 meters under overwhelming enemy fire to recover and prevent the enemy fighters from taking the bodies of the fallen comrades.  Staff Sergeant Romesha?s heroic actions throughout the day-long battle were critical in suppressing an enemy that had far greater numbers.  His extraordinary efforts gave Bravo Troop the opportunity to regroup, reorganize and prepare for the counterattack that allowed the Troop to account for its personnel and secure Combat Post Keating.  Staff Sergeant Romesha?s discipline and extraordinary heroism above and beyond the call of duty reflect great credit upon himself, Bravo Troop, 3d Squadron, 61st Cavalry Regiment, 4th Brigade Combat Team, 4th Infantry Division and the United States Army.","category_hints":"Rallying Point; retook the outpost","categories":["The Rallying Point","One Against Many","Brotherhood / No One Left Behind","The Wounded Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3482/romesha-clinton-l.php"}];
</script>
<script>
"use strict";
/* ===================== taxonomy ===================== */
const GROUPS = [
  {key:"deed",  label:"The Deed",      desc:"what earned it",        varc:"--tg-deed",
   themes:["The Assault","The Last Stand","The Body on the Grenade","The Rescue & Lifesaver","The Healer Under Fire","The Colors","One Against Many","The Raid","Wings","The Sea","Unbroken in Captivity","The Rallying Point"]},
  {key:"person",label:"The Person",    desc:"who they were",         varc:"--tg-person",
   themes:["The Reluctant Warrior","The New American / Immigrant's Debt","The Trailblazer / The First","The Boy (Too Young for This)","The Career Warrior","The Citizen-Soldier","The Twice-Honored"]},
  {key:"spirit",label:"The Spirit",    desc:"why it moves us",       varc:"--tg-spirit",
   themes:["Religious / Faith-Driven","Miraculous / Left for Dead","Greater Love","Redemption / The Second Birth","Brotherhood / No One Left Behind","Duty & Country","The Cost of War / Lament"]},
  {key:"after", label:"The Aftermath", desc:"life beyond the medal", varc:"--tg-after",
   themes:["The Fallen / Ultimate Sacrifice","The Quiet Return","Belated Justice / The Long Vindication","The Forgotten Hero / Fall From Grace","The Wounded Warrior","The Epic Second Act"]},
];
const THEMES = GROUPS.flatMap(g=>g.themes);                 // flat 32, stable order (URL index)
const THEME_GROUP = {}; GROUPS.forEach(g=>g.themes.forEach(t=>THEME_GROUP[t]=g));
const groupColor = g => `var(${g.varc})`;

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg>';
function yearOf(s){
  if(s.year) return s.year;
  const m = String((s.action_date||"")+" "+(s.citation||"")).match(/\b(1[89]\d\d|20[0-2]\d)\b/);
  return m ? +m[1] : null;
}
function initials(name){
  // roster order "Last, First ..." -> First-name + Last-name initials
  const parts = name.split(",");
  const last = (parts[0]||"").trim();
  const rest = (parts[1]||"").trim();
  const a = (rest[0]||last[0]||"?");
  const b = (last[0]||"");
  return (a+b).toUpperCase();
}
// derive search blob + year once
STORIES.forEach(s=>{
  s._year = yearOf(s);
  s._blob = [s.name,s.rank,s.branch,s.unit,s.conflict,s.battle,s.action_place,s.accredited_to,s.citation,(s.categories||[]).join(" ")].join(" ").toLowerCase();
});
const CONFLICTS = [...new Set(STORIES.map(s=>s.conflict))].sort();
const BRANCHES  = [...new Set(STORIES.map(s=>s.branch))].sort();

/* ===================== state ===================== */
const state = {
  themes:new Set(), conflicts:new Set(), branches:new Set(),
  fate:"all", query:"",
};
let SAVED = loadSaved();
let openStoryId = null;

/* ===================== filtering / facets ===================== */
function passExcept(s, dim){
  if(dim!=="fate"){ if(state.fate==="survived"&&!s.survived) return false; if(state.fate==="fell"&&s.survived) return false; }
  if(dim!=="query"&&state.query){ if(!s._blob.includes(state.query.toLowerCase())) return false; }
  if(dim!=="themes"&&state.themes.size){ if(![...state.themes].every(t=>s.categories.includes(t))) return false; }
  if(dim!=="conflicts"&&state.conflicts.size){ if(!state.conflicts.has(s.conflict)) return false; }
  if(dim!=="branches"&&state.branches.size){ if(!state.branches.has(s.branch)) return false; }
  return true;
}
const filtered = () => STORIES.filter(s=>passExcept(s,null));
// faceted count: stories passing all OTHER dims, that also hold `value` in `dim`
function facet(dim, test){ return STORIES.filter(s=>passExcept(s,dim)&&test(s)).length; }

/* ===================== URL state ===================== */
function writeURL(push){
  const p = new URLSearchParams();
  if(state.query) p.set("q", state.query);
  if(state.themes.size) p.set("t", [...state.themes].map(t=>THEMES.indexOf(t)).sort((a,b)=>a-b).join(","));
  if(state.conflicts.size) p.set("c", [...state.conflicts].map(c=>CONFLICTS.indexOf(c)).sort((a,b)=>a-b).join(","));
  if(state.branches.size) p.set("b", [...state.branches].map(c=>BRANCHES.indexOf(c)).sort((a,b)=>a-b).join(","));
  if(state.fate!=="all") p.set("f", state.fate);
  if(openStoryId) p.set("s", openStoryId);
  const url = location.pathname + (p.toString()?"?"+p.toString():"");
  if(push) history.pushState({}, "", url); else history.replaceState({}, "", url);
}
function readURL(){
  const p = new URLSearchParams(location.search);
  state.query = p.get("q")||"";
  state.themes = new Set((p.get("t")||"").split(",").filter(x=>x!=="").map(i=>THEMES[+i]).filter(Boolean));
  state.conflicts = new Set((p.get("c")||"").split(",").filter(x=>x!=="").map(i=>CONFLICTS[+i]).filter(Boolean));
  state.branches = new Set((p.get("b")||"").split(",").filter(x=>x!=="").map(i=>BRANCHES[+i]).filter(Boolean));
  state.fate = p.get("f")||"all";
  openStoryId = p.get("s")||null;
}

/* ===================== render: rail groups ===================== */
function renderRail(){
  $("#railGroups").innerHTML = GROUPS.map(g=>{
    const n = facet("themes", s=>g.themes.some(t=>s.categories.includes(t)));
    return `<button class="theme-row" data-group="${g.key}" title="Filter by ${esc(g.label)} themes">
      <span class="bar" style="background:${groupColor(g)}"></span>
      <span class="name">${esc(g.label)}</span>
      <span class="count">${n}</span>
    </button>`;
  }).join("");
  $("#railStoriesBadge").textContent = filtered().length;
  $("#railSavedBadge").textContent = SAVED.length;
}

/* ===================== render: active bar ===================== */
function chip(label, color, onx){
  const bg = `color-mix(in srgb, ${color} 14%, transparent)`;
  return `<span class="chip" style="background:${bg};color:${color}">${esc(label)}<button class="x" data-x="${onx}" aria-label="Remove ${esc(label)}">×</button></span>`;
}
function renderActive(){
  const bar = $("#activebar");
  const chips = [];
  state.themes.forEach(t=>chips.push(chip(t, groupColor(THEME_GROUP[t]), "theme:"+encodeURIComponent(t))));
  state.conflicts.forEach(c=>chips.push(chip(c, "var(--neutral)", "conflict:"+encodeURIComponent(c))));
  state.branches.forEach(b=>chips.push(chip(b, "var(--neutral)", "branch:"+encodeURIComponent(b))));
  if(state.fate!=="all") chips.push(chip(state.fate==="fell"?"★ Fell":"Survived","var(--neutral)","fate"));
  if(state.query) chips.push(`<span class="chip search">⌕ <em>"${esc(state.query)}"</em><button class="x" data-x="query" aria-label="Clear search">×</button></span>`);

  const savedPills = SAVED.map((v,i)=>`<span class="pill-outline" data-view="${i}">${esc(v.name)}<button class="x" data-delview="${i}" aria-label="Delete view">×</button></span>`).join("");
  const anyFilter = chips.length>0;

  bar.classList.toggle("hidden", !anyFilter && SAVED.length===0);
  bar.innerHTML =
    (anyFilter ? `<span class="ab-label">Active</span>${chips.join("")}<button class="link-btn" id="clearAll">Clear all</button>` : "")
    + `<span class="ab-saved"><span class="ab-label">Saved views</span>${savedPills}<button class="pill-outline pill-dashed" id="saveCurrent" ${anyFilter?"":"disabled style=\"opacity:.45\""}>+ Save current</button></span>`;
}

/* ===================== render: count bar ===================== */
function renderCounts(list){
  const fell = list.filter(s=>!s.survived).length;
  const surv = list.length - fell;
  const ys = list.map(s=>s._year).filter(Boolean);
  const range = ys.length ? `${Math.min(...ys)} — ${Math.max(...ys)}` : "—";
  $("#countbar").innerHTML =
    `<span><span class="n">${list.length} of ${STORIES.length}</span> stories · ${surv} survived · <span class="fell"><span class="star">★</span> ${fell} fell</span></span>`+
    `<span class="range">${range}</span>`;
}

/* ===================== render: cards ===================== */
function highlightSnippet(cit, q){
  const low = cit.toLowerCase(), i = low.indexOf(q.toLowerCase());
  if(i<0) return null;
  const start = Math.max(0, i-40), end = Math.min(cit.length, i+q.length+80);
  let snip = (start>0?"…":"") + cit.slice(start,end) + (end<cit.length?"…":"");
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
  return esc(snip).replace(re, m=>`<mark>${m}</mark>`);
}
function cardHTML(s){
  const groupsPresent = new Set(s.categories.map(t=>THEME_GROUP[t]&&THEME_GROUP[t].key));
  const seg = GROUPS.map(g=>`<span class="blk" style="${groupsPresent.has(g.key)?`background:${groupColor(g)}`:""}"></span>`).join("");
  const lead = s.categories[0];
  const leadG = lead?THEME_GROUP[lead]:null;
  const leadChip = lead ? `<span class="theme-chip" style="background:color-mix(in srgb, ${groupColor(leadG)} 13%, transparent);color:${groupColor(leadG)}">${esc(lead)}</span>` : "";
  const plus = s.categories.length>1 ? `<span class="plusn">+${s.categories.length-1}</span>` : "";
  const meta = [s.conflict, s.battle].filter(Boolean).join(" · ").toUpperCase();
  let body;
  if(state.query){ const snip = highlightSnippet(s.citation, state.query); body = snip ? `<div class="card-excerpt snippet">${snip}</div>` : `<div class="card-excerpt">${esc(s.citation.slice(0,170))}</div>`; }
  else body = `<div class="card-excerpt">${esc(s.citation.slice(0,190))}</div>`;
  const fate = s.survived ? `<span class="fate-chip surv">Survived</span>` : `<span class="fate-chip fell">★ Fell</span>`;
  return `<button class="card" data-story="${esc(s.id)}">
    <div class="card-top">
      <span class="avatar">${esc(initials(s.name))}</span>
      <span class="card-id"><span class="card-name">${esc(s.name)}</span><span class="card-sub">${esc(s.rank)} · ${esc(s.branch)}</span></span>
      <span class="dept-seg" title="Theme groups">${seg}</span>
    </div>
    <div class="card-meta">${esc(meta)}</div>
    ${body}
    <div class="card-foot">${leadChip}${plus}${fate}</div>
  </button>`;
}
function renderGrid(list){
  const grid = $("#grid");
  if(!list.length){ grid.innerHTML = emptyHTML(); return; }
  grid.innerHTML = list.map(cardHTML).join("");
}
function emptyHTML(){
  return `<div class="empty">
    <div class="rule"></div>
    <div class="kick">No Matches</div>
    <h2>No stories match this combination of filters.</h2>
    <p>The pilot holds 50 of 3,536 citations. Try loosening a filter — full coverage arrives as the archive scales.</p>
    <div class="actions">
      <button class="btn" id="removeLast">Remove last filter</button>
      <button class="btn-ghost" id="clearAll2">Clear all filters</button>
    </div>
  </div>`;
}

/* ===================== filter button counts ===================== */
function syncBtnPills(){
  const set=(id,n)=>{const e=$(id);e.hidden=!n;e.textContent=n;};
  set("#nThemes", state.themes.size); set("#nConflict", state.conflicts.size); set("#nBranch", state.branches.size);
}

/* ===================== master render ===================== */
function render(push){
  const list = filtered();
  renderRail(); renderActive(); renderCounts(list); renderGrid(list); syncBtnPills();
  writeURL(push);
}

/* ===================== popovers ===================== */
let activePop = null;
function positionPop(pop, btn, wide){
  const r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + window.scrollY + 6) + "px";
  if(wide){
    const w = Math.min(760, window.innerWidth*0.92);
    let left = r.left + window.scrollX; if(left + w > window.innerWidth-12) left = window.innerWidth-12-w;
    pop.style.left = Math.max(12,left)+"px";
  } else {
    pop.style.left = (r.left + window.scrollX) + "px";
  }
}
function closePop(){ if(activePop){ activePop.pop.classList.remove("open"); activePop.btn.setAttribute("aria-expanded","false"); activePop=null; } $("#scrim").classList.remove("open"); }
function openPop(pop, btn, wide){
  if(activePop && activePop.pop===pop){ closePop(); return; }
  closePop();
  positionPop(pop, btn, wide);
  pop.classList.add("open"); btn.setAttribute("aria-expanded","true");
  $("#scrim").classList.add("open");
  activePop = {pop, btn};
}
function buildListMenu(pop, values, set, dim, facetFn){
  pop.innerHTML = `<div class="menu-list">`+ values.map(v=>{
    const n = facetFn(v);
    return `<div class="opt ${n?"":"zero"}" role="checkbox" aria-checked="${set.has(v)}" data-val="${esc(v)}">
      <span class="cbx">${CHECK}</span><span class="lbl">${esc(v)}</span><span class="c">${n}</span></div>`;
  }).join("") + `</div>`;
  pop.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>{
    const v=o.dataset.val; set.has(v)?set.delete(v):set.add(v);
    render(false);
    buildListMenu(pop, values, set, dim, facetFn); // refresh counts + checks
  }));
}
function openThemes(){
  const pop = $("#popThemes");
  pop.className = "popover theme-menu";
  pop.innerHTML = `<div class="cols">`+ GROUPS.map(g=>`
    <div class="theme-col">
      <div class="top-rule" style="background:${groupColor(g)}"></div>
      <div class="grp" style="color:${groupColor(g)}">${esc(g.label)}</div>
      <div class="desc">${esc(g.desc)}</div>
      ${g.themes.map(t=>{
        const n = facet("themes", s=>s.categories.includes(t));
        return `<div class="opt ${n?"":"zero"}" role="checkbox" aria-checked="${state.themes.has(t)}" data-val="${esc(t)}">
          <span class="cbx">${CHECK}</span><span class="lbl">${esc(t)}</span><span class="c">${n}</span></div>`;
      }).join("")}
    </div>`).join("") + `</div>
    <div class="menu-foot">
      <span class="hint">Counts update live as you stack filters.</span>
      <button class="btn-ghost" data-clear-themes>Clear</button>
      <button class="btn-primary" data-close-themes>Show ${filtered().length} stories</button>
    </div>`;
  pop.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>{
    const t=o.dataset.val; state.themes.has(t)?state.themes.delete(t):state.themes.add(t);
    render(false); openThemes();
  }));
  pop.querySelector("[data-clear-themes]").addEventListener("click",()=>{ state.themes.clear(); render(false); openThemes(); });
  pop.querySelector("[data-close-themes]").addEventListener("click", closePop);
  openPop(pop, $("#btnThemes"), true);
}

/* ===================== detail modal ===================== */
function openDetail(id, push){
  const s = STORIES.find(x=>x.id===id); if(!s) return;
  openStoryId = id;
  const fell = !s.survived;
  const dateStr = (s.action_date||"").trim();
  const fbTop = fell ? `★ Fell${dateStr?" — "+esc(dateStr.toUpperCase()):""}` : `Survived${dateStr?" — "+esc(dateStr.toUpperCase()):""}`;
  const rows = [
    ["Rank", s.rank],["Branch", s.branch],["Unit", s.unit],["Conflict", s.conflict],
    ["Battle", s.battle],["Place", s.action_place],["Accredited", s.accredited_to],["Born", s.born&&s.born.trim()],
  ].filter(r=>r[1]);
  const themes = s.categories.map(t=>{const g=THEME_GROUP[t];return `<div class="meta-theme"><span class="bar" style="background:${groupColor(g)}"></span>${esc(t)}</div>`;}).join("");
  let cite = esc(s.citation);
  if(state.query){ const re=new RegExp(state.query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"); cite = cite.replace(re,m=>`<mark>${m}</mark>`); }
  const sub = [s.rank, s.branch, s.conflict].filter(Boolean).join(" · ");
  $("#detail").innerHTML = `
    <div class="detail-meta">
      <div class="fate-banner ${fell?"":"surv"}">
        <div class="fb-top">${fbTop}</div>
        <div class="fb-sub">${esc([s.action_place].filter(Boolean).join(""))}</div>
      </div>
      <div class="meta-label">Service</div>
      <div class="meta-rows">${rows.map(r=>`<div class="meta-r"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join("")}</div>
      <div class="meta-label">Themes</div>
      <div class="meta-themes">${themes}</div>
      <div class="meta-links">
        ${s.cmohs_link?`<a href="${esc(s.cmohs_link)}" target="_blank" rel="noopener">Official record — cmohs.org ↗</a>`:""}
        <button data-print>Print this story</button>
      </div>
    </div>
    <div class="detail-read">
      <div class="read-kicker">Medal of Honor · Official Citation — Rendered Verbatim</div>
      <div class="read-name">${esc(s.name)}</div>
      <div class="read-sub">${esc(sub)}</div>
      <div class="read-cite">${cite}</div>
      <div class="read-foot">Citation is a public-domain work of the U.S. Government, rendered in full and unedited. Source: ${s.cmohs_link?`<a href="${esc(s.cmohs_link)}" target="_blank" rel="noopener">cmohs.org</a>`:"cmohs.org"}.</div>
    </div>`;
  $("#detail").querySelector("[data-print]")?.addEventListener("click",()=>window.print());
  $("#detailScrim").classList.add("open");
  document.body.style.overflow="hidden";
  if(push) writeURL(true);
}
function closeDetail(fromPop){
  $("#detailScrim").classList.remove("open");
  document.body.style.overflow="";
  openStoryId=null;
  if(!fromPop) history.back();  // undo the pushState so URL reflects list
}

/* ===================== saved views ===================== */
function loadSaved(){ try{return JSON.parse(localStorage.getItem("moh_saved_views")||"[]");}catch(e){return [];} }
function persistSaved(){ localStorage.setItem("moh_saved_views", JSON.stringify(SAVED)); }
function snapshot(){ return {q:state.query, t:[...state.themes], c:[...state.conflicts], b:[...state.branches], f:state.fate}; }
function applySnapshot(v){
  state.query=v.q||""; $("#search").value=state.query;
  state.themes=new Set(v.t||[]); state.conflicts=new Set(v.c||[]); state.branches=new Set(v.b||[]); state.fate=v.f||"all";
  syncFateUI(); render(true);
}
function saveCurrent(){
  const name = prompt("Name this view:");
  if(!name) return;
  SAVED.push({name:name.trim(), state:snapshot()}); persistSaved();
  render(false); toast("View saved");
}

/* ===================== toast ===================== */
function toast(msg){
  const el = document.createElement("div"); el.className="toast";
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${esc(msg)}`;
  $("#toastWrap").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .2s";setTimeout(()=>el.remove(),200);},2200);
}

/* ===================== theme ===================== */
function syncThemeUI(mode){
  const icons = {light:"☀", dark:"☾", auto:"◐"};
  $("#themeIcon").textContent = icons[mode]+" ";
  $("#themeLabel").textContent = mode[0].toUpperCase()+mode.slice(1);
}
function applyTheme(mode){
  localStorage.setItem("moh_theme", mode);
  const eff = mode==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : mode;
  document.documentElement.setAttribute("data-theme", eff);
  syncThemeUI(mode);
}
function cycleTheme(){
  const cur = localStorage.getItem("moh_theme")||"auto";
  const next = {auto:"light",light:"dark",dark:"auto"}[cur];
  applyTheme(next);
}

/* ===================== fate UI ===================== */
function syncFateUI(){ document.querySelectorAll(".seg-btn").forEach(b=>b.classList.toggle("active", b.dataset.fate===state.fate)); }

/* ===================== events ===================== */
let searchTimer=null;
$("#search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ state.query = e.target.value.trim(); render(false); }, 180);
});
document.querySelectorAll(".seg-btn").forEach(b=>b.addEventListener("click",()=>{ state.fate=b.dataset.fate; syncFateUI(); render(false); }));
$("#btnThemes").addEventListener("click", ()=>{ if(activePop&&activePop.pop===$("#popThemes")) closePop(); else openThemes(); });
$("#btnConflict").addEventListener("click", ()=>{ const p=$("#popConflict"); if(activePop&&activePop.pop===p){closePop();return;} buildListMenu(p,CONFLICTS,state.conflicts,"conflicts",v=>facet("conflicts",s=>s.conflict===v)); openPop(p,$("#btnConflict")); });
$("#btnBranch").addEventListener("click", ()=>{ const p=$("#popBranch"); if(activePop&&activePop.pop===p){closePop();return;} buildListMenu(p,BRANCHES,state.branches,"branches",v=>facet("branches",s=>s.branch===v)); openPop(p,$("#btnBranch")); });
$("#scrim").addEventListener("click", closePop);

// rail group -> open theme menu
$("#railGroups").addEventListener("click", e=>{ if(e.target.closest(".theme-row")) openThemes(); });
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-nav]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  if(b.dataset.nav==="saved"){ document.querySelector(".ab-saved")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  if(window.innerWidth<=820) $("#rail").classList.remove("open");
}));

// grid + activebar delegation
$("#grid").addEventListener("click", e=>{
  const card=e.target.closest(".card"); if(card){ openDetail(card.dataset.story,true); return; }
  if(e.target.id==="removeLast"){ removeLastFilter(); }
  if(e.target.id==="clearAll2"){ clearAll(); }
});
$("#activebar").addEventListener("click", e=>{
  const x=e.target.closest("[data-x]");
  if(x){ const [k,val]=x.dataset.x.split(/:(.+)/);
    if(k==="theme") state.themes.delete(decodeURIComponent(val));
    else if(k==="conflict") state.conflicts.delete(decodeURIComponent(val));
    else if(k==="branch") state.branches.delete(decodeURIComponent(val));
    else if(k==="fate") state.fate="all";
    else if(k==="query"){ state.query=""; $("#search").value=""; }
    syncFateUI(); render(false); return; }
  if(e.target.id==="clearAll"){ clearAll(); return; }
  if(e.target.id==="saveCurrent"){ saveCurrent(); return; }
  const dv=e.target.closest("[data-delview]"); if(dv){ SAVED.splice(+dv.dataset.delview,1); persistSaved(); render(false); toast("View deleted"); return; }
  const v=e.target.closest("[data-view]"); if(v){ applySnapshot(SAVED[+v.dataset.view].state); }
});

function removeLastFilter(){
  if(state.query){ state.query=""; $("#search").value=""; }
  else if(state.themes.size){ state.themes.delete([...state.themes].pop()); }
  else if(state.conflicts.size){ state.conflicts.delete([...state.conflicts].pop()); }
  else if(state.branches.size){ state.branches.delete([...state.branches].pop()); }
  else if(state.fate!=="all"){ state.fate="all"; }
  syncFateUI(); render(false);
}
function clearAll(){
  state.themes.clear(); state.conflicts.clear(); state.branches.clear(); state.fate="all"; state.query=""; $("#search").value="";
  syncFateUI(); render(false); toast("Filters cleared");
}

$("#detailClose").addEventListener("click", ()=>closeDetail(false));
$("#detailScrim").addEventListener("click", e=>{ if(e.target===$("#detailScrim")) closeDetail(false); });
$("#themeToggle").addEventListener("click", cycleTheme);
$("#menuToggle").addEventListener("click", ()=>$("#rail").classList.toggle("open"));

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#detailScrim").classList.contains("open")) closeDetail(false); else closePop(); }
  if(e.key==="/" && document.activeElement!==$("#search")){ e.preventDefault(); $("#search").focus(); }
});
window.addEventListener("resize", ()=>{ if(activePop) positionPop(activePop.pop, activePop.btn, activePop.pop.classList.contains("theme-menu")); });

// popstate: sync from URL (handles detail back-button + shared links)
window.addEventListener("popstate", ()=>{
  readURL(); $("#search").value=state.query; syncFateUI();
  const list=filtered(); renderRail(); renderActive(); renderCounts(list); renderGrid(list); syncBtnPills();
  if(openStoryId){ openDetail(openStoryId,false); } else if($("#detailScrim").classList.contains("open")){ closeDetail(true); }
});

/* ===================== init ===================== */
applyTheme(localStorage.getItem("moh_theme")||"auto");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if((localStorage.getItem("moh_theme")||"auto")==="auto") applyTheme("auto"); });
readURL();
$("#search").value = state.query; syncFateUI();
render(false);
if(openStoryId) openDetail(openStoryId,false);
</script>
</body>
</html>
