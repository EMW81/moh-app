<style id="tokens">
/* Stories of Valor — Meridian tokens (from QUITTERS_Art_Dept_HQ_9.html, + theme-group mapping) */
:root{
  --font-ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* neutrals */
  --bg:#fafafa; --surface:#ffffff; --surface-raised:#f4f4f5;
  --border:#e4e4e7; --border-strong:#d4d4d8; --border-soft:#f1f1f3;
  --text:#18181b; --text-muted:#52525b; --text-subtle:#a1a1aa;
  /* rail — theme-responsive: light rail in light mode */
  --rail:var(--bg); --rail-raised:var(--surface-raised); --rail-border:var(--border);
  --rail-text:var(--text); --rail-muted:var(--text-muted); --rail-subtle:var(--text-subtle);
  --rail-hover:color-mix(in srgb,var(--text) 6%,transparent);
  --rail-inverse:#131316; --rail-inverse-text:#ededf0;
  --rail-badge-ink:var(--rail-inverse); /* dark ink on amber badge, BOTH modes */
  /* accent (one) */
  --accent:#5b5bd6; --accent-solid:#5b5bd6; --accent-hover:#4f4fc8;
  --accent-pressed:#4646b8; --accent-bg:#eeeef8; --accent-fg:#ffffff;
  /* semantics */
  --warning:#b45309; --warning-bg:#f9efe2;
  --critical:#d92d20; --critical-bg:#fdecea;
  --gold:#a16207; --gold-bg:#f7f0da;       /* fallen ★ */
  --neutral:#71717a; --neutral-bg:#f0f0f1; /* survived */
  /* theme groups (Meridian dept ramp) */
  --tg-deed:#c2410c; --tg-person:#7c3aed; --tg-spirit:#15803d; --tg-after:#0369a1;
  --seg-off:#e4e4e7;
  /* geometry */
  --radius-sm:4px; --radius:6px; --radius-lg:8px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
  --shadow-lg:0 4px 12px rgba(0,0,0,.10),0 12px 32px rgba(0,0,0,.12);
  --ring:0 0 0 3px rgba(91,91,214,.28);
}
[data-theme="dark"]{
  --bg:#0f0f11; --surface:#161618; --surface-raised:#1f1f23;
  --border:#26262b; --border-strong:#313138; --border-soft:#1f1f23;
  --text:#ededf0; --text-muted:#9d9da6; --text-subtle:#66666e;
  --rail:#131316; --rail-raised:#232329; --rail-border:#202024;
  --rail-text:#ededf0; --rail-muted:#9d9da6; --rail-subtle:#66666e;
  --rail-hover:rgba(255,255,255,.04);
  --accent:#7b83eb; --accent-solid:#5e5edd; --accent-hover:#6e76e8;
  --accent-pressed:#5252d0; --accent-bg:rgba(123,131,235,.14); --accent-fg:#ffffff;
  --warning:#e5a13c; --warning-bg:rgba(229,161,60,.13);
  --critical:#f0655a; --critical-bg:rgba(240,101,90,.13);
  --gold:#d9b13b; --gold-bg:rgba(217,177,59,.13);
  --neutral:#8f8f98; --neutral-bg:rgba(143,143,152,.13);
  --tg-deed:#fb923c; --tg-person:#a78bfa; --tg-spirit:#4ade80; --tg-after:#4db8f0;
  --seg-off:#313138;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 3px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(123,131,235,.35);
}
@media print{
  :root,[data-theme="dark"]{
    --bg:#ffffff; --surface:#ffffff; --surface-raised:#f4f4f5;
    --border:#d4d4d8; --border-strong:#a1a1aa;
    --text:#111113; --text-muted:#3f3f46; --text-subtle:#71717a;
    --gold:#7a5c17;
    --shadow-sm:none; --shadow-md:none; --shadow-lg:none;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

</style>
<style>
/* ---------- reset / base ---------- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion:no-preference){
  a,button,.chip,.card,.seg-btn,.rail-nav-item,.theme-row{transition:background .12s ease,color .12s ease,border-color .12s ease,box-shadow .12s ease;}
}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--radius);}
mark{background:var(--accent-bg);color:var(--accent);padding:0 .5px;border-radius:2px;font-style:normal;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.rail{
  width:230px;flex:0 0 230px;position:fixed;top:0;left:0;bottom:0;
  background:var(--rail);border-right:1px solid var(--rail-border);
  display:flex;flex-direction:column;overflow-y:auto;z-index:20;
}
main{margin-left:230px;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}

/* ---------- rail ---------- */
.rail-logo{padding:14px;border-bottom:1px solid var(--rail-border);}
.rail-logo .wordmark{font-family:var(--font-mono);font-size:19px;font-weight:700;letter-spacing:.06em;color:var(--rail-text);}
.rail-logo .wordmark .star{color:var(--warning);}
.rail-logo .subtitle{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--rail-subtle);margin-top:5px;}
.rail-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.rail-nav-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;
  font-size:13.5px;font-weight:500;color:var(--rail-muted);background:none;border:none;text-align:left;width:100%;
}
.rail-nav-item:hover{background:var(--rail-hover);color:var(--rail-text);}
.rail-nav-item.active{background:var(--rail-raised);color:var(--rail-text);font-weight:600;box-shadow:inset 2px 0 var(--accent);}
.rail-nav-item .label{flex:1 1 auto;}
.rail-badge{font-family:var(--font-mono);font-size:10.5px;font-weight:800;border-radius:var(--radius-pill);padding:1px 7px;line-height:1.4;}
.rail-badge.warn{background:var(--warning);color:var(--rail-badge-ink);}
.rail-badge.neutral{background:var(--rail-raised);color:var(--rail-muted);}
.rail-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--rail-subtle);padding:14px 12px 6px;}
.rail-groups{padding:0 10px;display:flex;flex-direction:column;}
.theme-row{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:6px;font-size:13px;color:var(--rail-text);background:none;border:none;width:100%;text-align:left;}
.theme-row:hover{background:var(--rail-hover);}
.theme-row .bar{width:3px;height:15px;border-radius:2px;flex:0 0 3px;}
.theme-row .name{flex:1 1 auto;}
.theme-row .count{font-family:var(--font-mono);font-size:11.5px;color:var(--rail-subtle);}
.rail-foot{margin:10px;padding:9px 12px;border-radius:8px;font-size:11px;line-height:1.5;
  background:color-mix(in srgb,var(--warning) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);color:var(--warning);}
.rail-spacer{flex:1 1 auto;}

/* ---------- header ---------- */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:flex-start;gap:16px;position:sticky;top:0;z-index:15;}
.hdr h1{font-size:18px;font-weight:700;margin:0;line-height:1.2;}
.hdr .sub{font-size:12.5px;color:var(--text-subtle);margin-top:3px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:500;box-shadow:var(--shadow-sm);}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}
.menu-toggle{display:none;}

/* ---------- filter row ---------- */
.filters{padding:14px 26px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.search{position:relative;flex:1 1 260px;max-width:320px;}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-subtle);pointer-events:none;}
.search input{width:100%;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:8px 10px 8px 32px;font-size:13px;color:var(--text);box-shadow:var(--shadow-sm);}
.search input::placeholder{color:var(--text-subtle);}
.search input:focus{border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;box-shadow:var(--shadow-sm);white-space:nowrap;}
.btn:hover{border-color:var(--border-strong);}
.btn[aria-expanded="true"]{border-color:var(--accent);}
.btn .chev{width:12px;height:12px;color:var(--text-subtle);}
.btn .pill-n{font-family:var(--font-mono);font-size:10.5px;font-weight:800;background:var(--accent);color:var(--accent-fg);border-radius:var(--radius-pill);padding:0 6px;line-height:16px;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.seg-btn{height:34px;padding:0 13px;border:none;background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:500;white-space:nowrap;border-left:1px solid var(--border);}
.seg-btn:first-child{border-left:none;}
.seg-btn:hover{color:var(--text);}
.seg-btn.active{background:var(--accent-solid);color:var(--accent-fg);font-weight:600;}
.seg-btn.fell .star{color:var(--gold);}
.seg-btn.active.fell{background:var(--accent-solid);}
.seg-btn.active.fell .star{color:var(--accent-fg);}

/* ---------- active filter bar ---------- */
.activebar{padding:12px 26px 0;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;}
.activebar.hidden{display:none;}
.ab-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--text-subtle);text-transform:uppercase;}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:600;border:1px solid transparent;}
.chip .x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:none;background:transparent;color:inherit;opacity:.7;font-size:13px;line-height:1;}
.chip .x:hover{opacity:1;background:color-mix(in srgb,currentColor 18%,transparent);}
.chip.search{background:var(--neutral-bg);color:var(--text-muted);border-color:var(--border);font-family:var(--font-mono);}
.chip.search em{font-style:normal;color:var(--text);}
.link-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;padding:0;}
.link-btn:hover{text-decoration:underline;}
.ab-saved{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pill-outline{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);background:var(--surface);font-size:11.5px;font-weight:600;color:var(--text-muted);}
.pill-outline:hover{border-color:var(--accent);color:var(--text);}
.pill-outline .x{margin-left:2px;opacity:.6;}
.pill-outline .x:hover{opacity:1;}
.pill-dashed{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent;}

/* ---------- count bar ---------- */
.countbar{padding:12px 26px 0;display:flex;gap:12px;align-items:baseline;font-size:12px;color:var(--text-subtle);}
.countbar .n{font-family:var(--font-mono);font-weight:700;color:var(--text);}
.countbar .fell{color:var(--gold);font-weight:600;}
.countbar .fell .star{color:var(--gold);}
.countbar .range{margin-left:auto;font-family:var(--font-mono);color:var(--text-subtle);}

/* ---------- card grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:16px 26px 40px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);
  padding:15px 17px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;text-align:left;color:inherit;}
.card:hover{border-color:var(--border-strong);}
.card:hover .card-name{color:var(--accent);}
.card-top{display:flex;align-items:flex-start;gap:11px;}
.avatar{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:800;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.card-id{flex:1 1 auto;min-width:0;}
.card-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.dept-seg{display:flex;gap:2px;padding:3px;background:var(--surface-raised);border-radius:4px;flex:0 0 auto;}
.dept-seg .blk{width:10px;height:6px;border-radius:1px;background:var(--seg-off);}
.card-meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;color:var(--text-subtle);text-transform:uppercase;}
.card-excerpt{font-size:13px;line-height:1.55;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-excerpt.snippet{font-style:italic;}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;}
.theme-chip{display:inline-flex;align-items:center;max-width:185px;padding:2px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plusn{font-size:11px;font-weight:600;color:var(--text-subtle);}
.fate-chip{margin-left:auto;padding:2px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;white-space:nowrap;}
.fate-chip.fell{background:var(--gold-bg);color:var(--gold);font-weight:700;}
.fate-chip.surv{background:var(--neutral-bg);color:var(--text-muted);}

/* ---------- empty state ---------- */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.empty .rule{width:44px;height:3px;background:var(--border-strong);border-radius:2px;}
.empty .kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--text-subtle);}
.empty h2{font-size:16px;font-weight:600;margin:0;max-width:440px;}
.empty p{font-size:13px;color:var(--text-muted);max-width:420px;margin:0;}
.empty .actions{display:flex;gap:10px;margin-top:4px;}

/* ---------- popover menus ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .12s ease;}
.scrim.open{opacity:1;pointer-events:auto;}
.popover{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);
  padding:0;display:none;}
.popover.open{display:block;}
.menu-list{max-height:340px;overflow-y:auto;padding:8px;min-width:230px;}
.menu-list .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:12.5px;color:var(--text-muted);cursor:pointer;}
.menu-list .opt:hover{background:var(--surface-raised);}
.menu-list .opt .cbx{width:14px;height:14px;border:1.5px solid var(--border-strong);border-radius:3px;flex:0 0 14px;display:flex;align-items:center;justify-content:center;}
.menu-list .opt .cbx svg{width:10px;height:10px;color:var(--accent-fg);display:none;}
.menu-list .opt[aria-checked="true"] .cbx{background:var(--accent-solid);border-color:var(--accent-solid);}
.menu-list .opt[aria-checked="true"] .cbx svg{display:block;}
.menu-list .opt .lbl{flex:1 1 auto;}
.menu-list .opt .c{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);}
.menu-list .opt.zero{opacity:.5;}

/* theme menu (4 columns) */
.theme-menu{width:min(760px,92vw);}
.theme-menu .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:14px;}
.theme-col{padding:0 12px;border-left:1px solid var(--border-soft);}
.theme-col:first-child{border-left:none;}
.theme-col .top-rule{height:3px;border-radius:2px;margin-bottom:8px;}
.theme-col .grp{font-size:11px;font-weight:800;text-transform:none;}
.theme-col .desc{font-size:11px;font-style:italic;color:var(--text-subtle);margin:2px 0 8px;}
.theme-col .opt{padding:5px 4px;}
.menu-foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);}
.menu-foot .hint{font-size:11.5px;font-style:italic;color:var(--text-subtle);flex:1 1 auto;}
.btn-ghost{background:none;border:none;color:var(--text-muted);font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:6px;}
.btn-ghost:hover{background:var(--surface-raised);color:var(--text);}
.btn-primary{background:var(--accent-solid);color:var(--accent-fg);border:none;border-radius:var(--radius);padding:8px 14px;font-size:12.5px;font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:active{transform:translateY(1px);}

/* ---------- detail modal ---------- */
.detail-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;overflow-y:auto;}
.detail-scrim.open{display:block;}
.detail{max-width:1040px;margin:24px auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);
  display:grid;grid-template-columns:340px 1fr;overflow:hidden;min-height:200px;}
.detail-meta{border-right:1px solid var(--border);padding:22px;background:var(--surface);}
.detail-close{position:absolute;top:36px;right:calc(50% - 520px + 18px);z-index:2;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
.detail-close:hover{border-color:var(--border-strong);color:var(--text);}
.fate-banner{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 8%,transparent);padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:18px;}
.fate-banner.surv{border-left-color:var(--neutral);background:var(--neutral-bg);}
.fate-banner .fb-top{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.03em;}
.fate-banner.surv .fb-top{color:var(--text-muted);}
.fate-banner .fb-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.meta-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);margin:18px 0 8px;}
.meta-rows{display:flex;flex-direction:column;}
.meta-r{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.meta-r .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);width:96px;flex:0 0 96px;padding-top:2px;}
.meta-r .v{color:var(--text);flex:1 1 auto;}
.meta-themes{display:flex;flex-direction:column;gap:6px;}
.meta-theme{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);}
.meta-theme .bar{width:3px;height:15px;border-radius:2px;flex:0 0 3px;}
.meta-links{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.meta-links a,.meta-links button{color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none;background:none;border:none;padding:0;text-align:left;display:inline-flex;align-items:center;gap:6px;}
.meta-links a:hover,.meta-links button:hover{text-decoration:underline;}
.detail-read{padding:34px 40px 44px;min-width:0;}
.read-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;}
.read-name{font-size:30px;font-weight:700;line-height:1.12;margin:12px 0 6px;}
.read-sub{font-size:13.5px;color:var(--text-muted);}
.read-cite{font-size:16.5px;line-height:1.7;color:var(--text);max-width:66ch;margin-top:22px;white-space:pre-wrap;}
.read-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;font-style:italic;color:var(--text-subtle);}
.read-foot a{color:var(--accent);}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{display:flex;align-items:center;gap:10px;background:var(--rail-inverse);color:var(--rail-inverse-text);border-radius:8px;padding:11px 14px;font-size:12.5px;box-shadow:var(--shadow-lg);
  animation:toastin .16s ease;}
.toast svg{width:15px;height:15px;color:var(--accent);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- responsive ---------- */
@media (max-width:1080px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:820px){
  .rail{transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow-lg);}
  .rail.open{transform:none;}
  main{margin-left:0;}
  .menu-toggle{display:inline-flex;}
  .hdr{padding:12px 16px;}
  .filters,.activebar,.countbar,.grid{padding-left:16px;padding-right:16px;}
  .grid{grid-template-columns:1fr;}
  .search{max-width:none;flex-basis:100%;}
  .theme-menu .cols{grid-template-columns:1fr;gap:0;}
  .theme-col{border-left:none;border-top:1px solid var(--border-soft);padding-top:10px;margin-top:6px;}
  .theme-col:first-child{border-top:none;margin-top:0;}
  .detail{grid-template-columns:1fr;margin:0;border-radius:0;min-height:100vh;}
  .detail-meta{border-right:none;border-bottom:1px solid var(--border);}
  .detail-close{right:14px;top:14px;}
  .detail-read{padding:22px 18px 40px;}
  .ab-saved{margin-left:0;flex-basis:100%;}
}

/* ---------- print ---------- */
@media print{
  .rail,.hdr-right,.filters,.activebar,.countbar,.menu-toggle,.toast-wrap,.scrim,.popover{display:none !important;}
  main{margin-left:0;}
  body{background:var(--bg);}
  .grid{display:block;padding:0;}
  .card{page-break-inside:avoid;box-shadow:none;border:none;border-bottom:1px solid var(--border-strong);border-radius:0;margin-bottom:12px;}
  .detail-scrim{position:static;background:none;display:block;overflow:visible;}
  .detail{box-shadow:none;border:none;grid-template-columns:1fr;margin:0;}
  .detail-close,.meta-links{display:none !important;}
  .read-cite{max-width:none;}
}
</style>
</head>

<script>
const STORIES = [{"id":"jacob-parrott","name":"Parrott, Jacob","rank":"Private","branch":"U.S. Army","unit":"Company K, 33d Ohio Infantry","conflict":"U.S. Civil War","battle":"Andrews' Raid","year":null,"action_date":null,"action_place":"Georgia, USA","coords":{"lat":32,"lng":-82},"survived":true,"accredited_to":"Hardin County, Ohio","born":" Fairfield County, Ohio","citation":"Rank and organization: Private, Company K, 33d Ohio Infantry. Place and date: Georgia, April 1862. Entered service at: Hardin County, Ohio. Birth: 17 July 1843, Fairfield County, Ohio. Date of issue: 25 March 1863. Citation: One of the 19 of 22 men (including 2 civilians) who, by direction of Gen. Mitchell (or Buell) penetrated nearly 200 miles south into enemy territory and captured a railroad train at Big Shanty, Ga., in an attempt to destroy the bridges and tracks between Chattanooga and Atlanta.","category_hints":"The Raid; first Medal of Honor ever awarded","categories":["The Raid","The Trailblazer / The First"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2854/parrott-jacob.php"},{"id":"william-h-carney","name":"Carney, William H.","rank":"Sergeant","branch":"U.S. Army","unit":"Company C, 54th Massachusetts Colored Infantry","conflict":"U.S. Civil War","battle":"Fort Wagner","year":1863,"action_date":"1863-7-18","action_place":"Fort Wagner, Charleston, SC 29412, USA","coords":{"lat":32,"lng":-79},"survived":true,"accredited_to":"New Bedford, Mass.","born":"Norfolk, Va.","citation":"When the color sergeant was shot down, this soldier grasped the flag, led the way to the parapet, and planted the colors thereon. When the troops fell back he brought off the flag, under a fierce fire in which he was twice severely wounded.","category_hints":"The Colors; Trailblazer - first Black recipient by deed","categories":["The Colors","The Trailblazer / The First","The Wounded Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/224/carney-william-h.php"},{"id":"mary-e-walker","name":"Walker, Dr., Mary E.","rank":"Contract Acting Assistant Surgeon (civilian)","branch":"U.S. Army","unit":"","conflict":"U.S. Civil War","battle":null,"year":null,"action_date":null,"action_place":"Bull Run, VA 20109, USA","coords":{"lat":38,"lng":-77},"survived":true,"accredited_to":"Louisville, Ky.","born":" Oswego County, N.Y.","citation":"Battle of Bull Run, July 21, 1861; Patent Office Hospital, Washington, D.C., October 1861; Chattanooga, Tenn., following Battle of Chickomauga, September 1863; Prisoner of War, April 10, 1864-August 12, 1864, Richmond, Va.; Battle of Atlanta, September 1864\n\nWhereas it appears from official reports that Dr. Mary E. Walker, a graduate of medicine, \"has rendered valuable service to the Government, and her efforts have been earnest and untiring in a variety of ways,\" and that she was assigned to duty and served as an assistant surgeon in charge of female prisoners at Louisville, Ky., upon the recommendation of Major-Generals Sherman and Thomas, and faithfully served as contract surgeon in the service of the United States, and has devoted herself with much patriotic zeal to the sick and wounded soldiers, both in the field and hospitals, to the detriment of her own health, and has also endured hardships as a prisoner of war four months in a Southern prison while acting as contract surgeon; and Whereas by reason of her not being a commissioned officer in the military service, a brevet or honorary rank cannot, under existing laws, be conferred upon her; and\nWhereas in the opinion of the President an honorable recognition of her services and sufferings should be made:\nIt is ordered, That a testimonial thereof shall be hereby made and given to the said Dr. Mary E. Walker, and that the usual medal of honor for meritorious services be given her.\n\nGiven under my hand in the city of Washington, D.C., this 11th day of November, A.D. 1865.\n\nAndrew Johnson,\nPresident\n\n(Medal rescinded 1917 along with 910 others, restored by President Carter 10 June 1977.)","category_hints":"Trailblazer; only female recipient; Healer","categories":["The Trailblazer / The First","The Healer Under Fire","Unbroken in Captivity","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/1428/walker-dr-mary-e.php"},{"id":"alonzo-h-cushing","name":"Cushing, Alonzo H.","rank":"1st Lieutenant","branch":"U.S. Army","unit":"Battery A, 4th US Artillery, II Corps, Army of the Potomac","conflict":"U.S. Civil War","battle":"Gettysburg","year":null,"action_date":null,"action_place":"Gettysburg, PA 17325, USA","coords":{"lat":39,"lng":-77},"survived":false,"accredited_to":"Fredonia, New York","born":" at Delafield, Wisconsin","citation":"First Lieutenant Alonzo H. Cushing distinguished himself by acts of bravery above and beyond the call of duty while serving as an artillery commander in Battery A, 4th U.S. Artillery, Army of the Potomac at Gettysburg, Pennsylvania on July 3rd, 1863 during the American Civil War.  That morning, Confederate forces led by General Robert E. Lee began cannonading First Lieutenant Cushing's position on Cemetery Ridge.  Using field glasses, First Lieutenant Cushing directed fire for his own artillery battery.  He refused to leave the battlefield after being struck in the shoulder by a shell fragment.  As he continued to direct fire, he was struck again - this time suffering grievous damage to his abdomen.  Still refusing to abandon his command, he boldly stood tall in the face of Major General George E. Pickett's charge and continued to direct devastating fire into oncoming forces.  As the Confederate forces closed in, First Lieutenant Cushing was struck in the mouth by an enemy bullet and fell dead beside his gun. His gallant stand and fearless leadership inflicted severe casualties upon Confederate forces and opened wide gaps in their lines, directly impacting the Union force's ability to repel Pickett's charge.  First Lieutenant Cushing's extraordinary heroism and selflessness above and beyond the call of duty at the cost of his own life are in keeping with the highest traditions of military service and reflect great credit upon himself, Battery A, 4th U.S. Artillery, Army of the Potomac, and the United States Army.","category_hints":"Last Stand; Belated Justice - awarded 2014, 151 years later","categories":["The Last Stand","Belated Justice / The Long Vindication","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3515/cushing-alonzo-h.php"},{"id":"andrew-jackson-smith","name":"Smith, Andrew Jackson","rank":"Corporal","branch":"U.S. Army","unit":"55th Massachusetts Voluntary Infantry","conflict":"U.S. Civil War","battle":"Honey Hill","year":null,"action_date":null,"action_place":"Honey Hill, SC 29936, USA","coords":{"lat":32,"lng":-80},"survived":true,"accredited_to":null,"born":"Kentucky","citation":"Corporal Andrew Jackson Smith, of Clinton, Illinois, a member of the 55th Massachusetts Voluntary Infantry, distinguished himself on 30 November 1864 by saving his regimental colors, after the color bearer was killed during al bloody charge called the Battle of Honey Hill, South Carolina. In the late afternoon, as the 55th Regiment pursued enemy skirmishers and conducted a running fight, they ran into a swampy area backed by a rise where the Confederate Army awaited. The surrounding woods and thick underbrush impeded infantry movement and artillery support. The 55th and 34th regiments formed columns to advance on the enemy position in a flanking movement. As the Confederates repelled other units, the 55th and 54th regiments continued to move into tanking positions. Forced into a narrow gorge crossing a swamp in the face of the enemy position, the 55th's Color-Sergeant was killed by an exploding shell, and Corporal Smith took the Regimental Colors from his hand and carried them through heavy grape and canister fire. Although half of the officers and a third of the enlisted men engaged in the fight were killed or wounded, Corporal Smith continued to expose himself to enemy fire by carrying the colors throughout the battle. Through his actions, the Regimental Colors of the 55th Infantry Regiment were not lost to the enemy. Corporal Andrew Jackson Smith's extraordinary valor in the face of deadly enemy fire is in keeping with the highest traditions of military service and reflect great credit upon him, the 55th Regiment, and the United States Army.","category_hints":"The Colors; Belated Justice - awarded 2001","categories":["The Colors","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/1261/smith-andrew-jackson.php"},{"id":"bernard-j-d-irwin","name":"Irwin, Bernard J. D.","rank":"Assistant Surgeon","branch":"U.S. Army","unit":"","conflict":"Indian Campaigns","battle":"Apache Pass","year":null,"action_date":null,"action_place":"Apache Pass, Bowie, AZ 85605, USA","coords":{"lat":32,"lng":-109},"survived":true,"accredited_to":"New York","born":" Ireland","citation":"Voluntarily took command of troops and attacked and defeated hostile Indians he met on the way. Surgeon Irwin volunteered to go to the rescue of 2d Lt. George N. Bascom, 7th Infantry, who with 60 men was trapped by Chiricahua Apaches under Cochise. Irwin and 14 men, not having horses began the 100-mile march riding mules. After fighting and capturing Indians, recovering stolen horses and cattle, he reached Bascom's column and help break his siege.","category_hints":"Rescue; Healer; earliest action to earn the Medal (1861)","categories":["The Rescue & Lifesaver","The Healer Under Fire","The New American / Immigrant's Debt"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/1714/irwin-bernard-j-d.php"},{"id":"charles-windolph","name":"Windolph, Charles","rank":"Private","branch":"U.S. Army","unit":"Company H, 7th U.S. Cavalry","conflict":"Indian Campaigns","battle":"Little Bighorn","year":null,"action_date":null,"action_place":"Little Big Horn Bridge, Lodge Grass, MT 59050, USA","coords":{"lat":45,"lng":-107},"survived":true,"accredited_to":"Brooklyn, N.Y.","born":" Germany","citation":"With 3 comrades, during the entire engagement, courageously held a position that secured water for the command.","category_hints":"Last Stand survivor - Reno Hill","categories":["The Last Stand","Brotherhood / No One Left Behind","The New American / Immigrant's Debt"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/1953/windolph-charles.php"},{"id":"john-henry-quick","name":"Quick, John Henry","rank":"Sergeant","branch":"U.S. Marine Corps","unit":"","conflict":"Spanish-American War","battle":"Guantanamo Bay","year":null,"action_date":null,"action_place":"Cuba, Cusco, Peru","coords":{"lat":-13,"lng":-71},"survived":true,"accredited_to":"Pennsylvania","born":" Charleston, W. Va.","citation":"In action during the battle of Cuzco, Cuba, 14 June 1898. Distinguishing himself during this action, Quick signaled the U.S.S. Dolphin on 3 different occasions while exposed to a heavy fire from the enemy.","category_hints":"One Against Many; signaled under fire","categories":["One Against Many","The Sea"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2173/quick-john-henry.php"},{"id":"daniel-joseph-daly","name":"Daly, Daniel Joseph","rank":"Gunnery Sergeant","branch":"U.S. Marine Corps","unit":"","conflict":"China Relief Expedition (Boxer Rebellion)","battle":"Peking Legations","year":null,"action_date":null,"action_place":"Fort Liberte, Haiti","coords":{"lat":19,"lng":-71},"survived":true,"accredited_to":"New York","born":"Glen Cove, Long Island, N.Y., 11 November 1873","citation":"FIRST AWARD\nIn the presence of the enemy during the battle of Peking, China, 14 August 1900, Daly distinguished himself by meritorious conduct.\n\nSECOND AWARD\nServing with the 15th Company of Marines on 22 October 1915, G/Sgt. Daly was one of the company to leave Fort Liberte, Haiti, for a 6-day reconnaissance. After dark on the evening of 24 October, while crossing the river in a deep ravine, the detachment was suddenly fired upon from 3 sides by about 400 Cacos concealed in bushes about 100 yards from the fort. The marine detachment fought its way forward to a good position, which it maintained during the night, although subjected to a continuous fre from the Cacos. At daybreak the marines, in 3 squads, advanced in 3 different directions, surprising and scattering the Cacos in all directions. G/Sgt. Daly fought with exceptional gallantry against heavy odds throughout this action.","category_hints":"Twice-Honored; One Against Many","categories":["The Twice-Honored","One Against Many","The Career Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2456/daly-daniel-joseph.php"},{"id":"smedley-darlington-butler","name":"Butler, Smedley Darlington","rank":"Major","branch":"U.S. Marine Corps","unit":"","conflict":"Mexican Campaign (Vera Cruz)","battle":"Vera Cruz","year":null,"action_date":null,"action_place":"Heroica Veracruz, Veracruz, Mexico","coords":{"lat":19,"lng":-96},"survived":true,"accredited_to":"Pennsylvania","born":" West Chester, Pa.","citation":"As Commanding Officer of detachments from the 5th, 13th, 23d Companies and the marine and sailor detachment from the U.S.S. Connecticut, Maj. Butler led the attack on Fort Riviere, Haiti, 17 November 1915. Following a concentrated drive, several different detachments of marines gradually closed in on the old French bastion fort in an effort to cut off all avenues of retreat for the Caco bandits. Reaching the fort on the southern side where there was a small opening in the wall, Maj. Butler gave the signal to attack and marines from the 15th Company poured through the breach, engaged the Cacos in hand-to-hand combat, took the bastion and crushed the Caco resistance. Throughout this perilous action, Maj. Butler was conspicuous for his bravery and forceful leadership.\n\nFIRST AWARD\nFor distinguished conduct in battle, engagement of Vera Cruz, 22 April 1914. Maj. Butler was eminent and conspicuous in command of his battalion. He exhibited courage and skill in leading his men through the action of the 22d and in the final occupation of the city.","category_hints":"Twice-Honored; Career Warrior","categories":["The Twice-Honored","The Career Warrior","The Assault"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2455/butler-smedley-darlington.php"},{"id":"alvin-c-york","name":"York, Alvin C.","rank":"Corporal","branch":"U.S. Army","unit":"Company G, 328th Infantry, 82d Division","conflict":"World War I","battle":"Meuse-Argonne Offensive","year":1918,"action_date":"1918-10-8","action_place":"Chatel-Ch?h?ry, France","coords":{"lat":49,"lng":4},"survived":true,"accredited_to":"Pall Mall, Tenn.","born":" Fentress County, Tenn.","citation":"After his platoon had suffered heavy casualties and 3 other noncommissioned officers had become casualties, Cpl. York assumed command. Fearlessly leading 7 men, he charged with great daring a machinegun nest which was pouring deadly and incessant fire upon his platoon. In this heroic feat the machinegun nest was taken, together with 4 officers and 128 men and several guns.","category_hints":"Reluctant Warrior; Faith-Driven; One Against Many","categories":["One Against Many","The Reluctant Warrior","Religious / Faith-Driven"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2613/york-alvin-c.php"},{"id":"frank-jr-luke","name":"Luke, Frank, Jr.","rank":"Second Lieutenant","branch":"U.S. Army","unit":"1st Pursuit Group, 27th Aero Squadron","conflict":"World War I","battle":null,"year":1918,"action_date":"1918-9-29","action_place":"Murvaux, France","coords":{"lat":49,"lng":5},"survived":false,"accredited_to":"Phoenix, Ariz.","born":" Phoenix, Ariz.","citation":"After having previously destroyed a number of enemy aircraft within 17 days he voluntarily started on a patrol after German observation balloons. Though pursued by 8 German planes which were protecting the enemy balloon line, he unhesitatingly attacked and shot down in flames 3 German balloons, being himself under heavy fire from ground batteries and the hostile planes. Severely wounded, he descended to within 50 meters of the ground, and flying at this low altitude near the town of Murvaux opened fire upon enemy troops, killing 6 and wounding as many more. Forced to make a landing and surrounded on all sides by the enemy, who called upon him to surrender, he drew his automatic pistol and defended himself gallantly until he fell dead from a wound in the chest.","category_hints":"Wings; Last Stand - the Balloon Buster","categories":["Wings","The Last Stand","One Against Many","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2555/luke-frank-jr.php"},{"id":"charles-w-whittlesey","name":"Whittlesey, Charles W.","rank":"Major","branch":"U.S. Army","unit":"308th Infantry, 77th Division","conflict":"World War I","battle":"Meuse-Argonne Offensive (Lost Battalion)","year":null,"action_date":null,"action_place":"Argonnestraat, 1060 Sint-Gillis, Belgium","coords":{"lat":50,"lng":4},"survived":true,"accredited_to":"Pittsfield, Mass.","born":"Florence, Wis.","citation":"Although cut off for 5 days from the remainder of his division, Maj. Whittlesey maintained his position, which he had reached under orders received for an advance, and held his command, consisting originally of 46 officers and men of the 308th Infantry and of Company K of the 307th Infantry, together in the face of superior numbers of the enemy during the 5 days. Maj. Whittlesey and his command were thus cut off, and no rations or other supplies reached him, in spite of determined efforts which were made by his division. On the 4th day Maj. Whittlesey received from the enemy a written proposition to surrender, which he treated with contempt, although he was at the time out of rations and had suffered a loss of about 50 percent in killed and wounded of his command and was surrounded by the enemy.","category_hints":"Rallying Point; Cost of War - died by suicide 1921","categories":["The Rallying Point","Unbroken in Captivity","The Cost of War / Lament"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2609/whittlesey-charles-w.php"},{"id":"freddie-stowers","name":"Stowers, Freddie","rank":"Corporal","branch":"U.S. Army","unit":"Company C, 371st Infantry Regiment, 93d Division","conflict":"World War I","battle":"Meuse-Argonne Offensive","year":null,"action_date":null,"action_place":"Unknown","coords":{"lat":-1,"lng":-1},"survived":false,"accredited_to":null,"born":null,"citation":"Corporal Stowers, distinguished himself by exceptional heroism on 28 September 1918 while serving as a squad leader in Company C, 371st Infantry Regiment, 93d Division. His company was the lead company during the attack on Hill 188, Champagne Marne Sector, France, during World War I. A few minutes after the attack began, the enemy ceased firing and began climbing up onto the parapets of the trenches, holding up their arms as if wishing to surrender. The enemy's actions caused the American forces to cease fire and to come out into the open. As the company started forward and when within about 100 meters of the trench line, the enemy jumped back into their trenches and greeted Corporal Stowers' company with interlocking bands of machine gun fire and mortar fire causing well over fifty percent casualties. Faced with incredible enemy resistance, Corporal Stowers took charge, setting such a courageous example of personal bravery and leadership that he inspired his men to follow him in the attack. With extraordinary heroism and complete disregard of personal danger under devastating fire, he crawled forward leading his squad toward an enemy machine gun nest, which was causing heavy casualties to his company. After fierce fighting, the machine gun position was destroyed and the enemy soldiers were killed. Displaying great courage and intrepidity Corporal Stowers continued to press the attack against a determined enemy. While crawling forward and urging his men to continue the attack on a second trench line, he was gravely wounded by machine gun fire. Although Corporal Stowers was mortally wounded, he pressed forward, urging on the members of his squad, until he died. Inspired by the heroism and display of bravery of Corporal Stowers, his company continued the attack against incredible odds, contributing to the capture of Hill 188 and causing heavy enemy casualties. Corporal Stowers' conspicuous gallantry, extraordinary heroism, and supreme devotion to his men were well above and beyond the call of duty, follow the finest traditions of military service, and reflect the utmost credit on him and the United States Army.","category_hints":"The Fallen; Belated Justice - awarded 1991","categories":["The Assault","The Fallen / Ultimate Sacrifice","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2595/stowers-freddie.php"},{"id":"fred-w-stockham","name":"Stockham, Fred W.","rank":"Gunnery Sergeant","branch":"U.S. Marine Corps","unit":"96th Company, 2d Battalion, 6th Regiment","conflict":"World War I","battle":"Battle of Belleau Wood","year":null,"action_date":null,"action_place":"Bois de Manche-Seille, 54610 Belleau, France","coords":{"lat":48,"lng":6},"survived":false,"accredited_to":"New York, N.Y.","born":"Detroit, Mich. G.O.","citation":"During an intense enemy bombardment with high explosive and gas shells which wounded or killed many members of the company, G/Sgt. Stockham, upon noticing that the gas mask of a wounded comrade was shot away, without hesitation, removed his own gas mask and insisted upon giving it to the wounded man, well knowing that the effects of the gas would be fatal to himself. He continued with undaunted courage and valor to direct and assist in the evacuation of the wounded, until he himself collapsed from the effects of gas, dying as a result thereof a few days later. His courageous conduct undoubtedly saved the lives of many of his wounded comrades and his conspicuous gallantry and spirit of self-sacrifice were a source of great inspiration to all who served with him.","category_hints":"Greater Love - gave his gas mask to a wounded Marine","categories":["Greater Love","The Healer Under Fire","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2594/stockham-fred-w.php"},{"id":"desmond-t-doss","name":"Doss, Desmond T.","rank":"Private First Class","branch":"U.S. Army","unit":"Medical Detachment, 307th Infantry, 77th Infantry Division","conflict":"World War II","battle":"Okinawa","year":null,"action_date":null,"action_place":"Okinawa Prefecture, Japan","coords":{"lat":26,"lng":127},"survived":true,"accredited_to":"Lynchburg, Va.","born":"Lynchburg, Va.","citation":"He was a company aid man when the 1st Battalion assaulted a jagged escarpment 400 feet high As our troops gained the summit, a heavy concentration of artillery, mortar and machinegun fire crashed into them, inflicting approximately 75 casualties and driving the others back. Pfc. Doss refused to seek cover and remained in the fire-swept area with the many stricken, carrying them 1 by 1 to the edge of the escarpment and there lowering them on a rope-supported litter down the face of a cliff to friendly hands. On 2 May, he exposed himself to heavy rifle and mortar fire in rescuing a wounded man 200 yards forward of the lines on the same escarpment; and 2 days later he treated 4 men who had been cut down while assaulting a strongly defended cave, advancing through a shower of grenades to within 8 yards of enemy forces in a cave's mouth, where he dressed his comrades' wounds before making 4 separate trips under fire to evacuate them to safety. On 5 May, he unhesitatingly braved enemy shelling and small arms fire to assist an artillery officer. He applied bandages, moved his patient to a spot that offered protection from small arms fire and, while artillery and mortar shells fell close by, painstakingly administered plasma. Later that day, when an American was severely wounded by fire from a cave, Pfc. Doss crawled to him where he had fallen 25 feet from the enemy position, rendered aid, and carried him 100 yards to safety while continually exposed to enemy fire. On 21 May, in a night attack on high ground near Shuri, he remained in exposed territory while the rest of his company took cover, fearlessly risking the chance that he would be mistaken for an infiltrating Japanese and giving aid to the injured until he was himself seriously wounded in the legs by the explosion of a grenade. Rather than call another aid man from cover, he cared for his own injuries and waited 5 hours before litter bearers reached him and started carrying him to cover. The trio was caught in an enemy tank attack and Pfc. Doss, seeing a more critically wounded man nearby, crawled off the litter; and directed the bearers to give their first attention to the other man. Awaiting the litter bearers' return, he was again struck, this time suffering a compound fracture of 1 arm. With magnificent fortitude he bound a rifle stock to his shattered arm as a splint and then crawled 300 yards over rough terrain to the aid station. Through his outstanding bravery and unflinching determination in the face of desperately dangerous conditions Pfc. Doss saved the lives of many soldiers. His name became a symbol throughout the 77th Infantry Division for outstanding gallantry far above and beyond the call of duty.","category_hints":"Healer Under Fire; Faith-Driven; conscientious objector","categories":["The Healer Under Fire","Religious / Faith-Driven","The Reluctant Warrior","The Rescue & Lifesaver"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2717/doss-desmond-t.php"},{"id":"audie-l-murphy","name":"Murphy, Audie L.","rank":"Second Lieutenant","branch":"U.S. Army","unit":"Company B, 15th Infantry, 3d Infantry Division","conflict":"World War II","battle":null,"year":1945,"action_date":"1945-1-26","action_place":"Holtzwihr, France","coords":{"lat":48,"lng":7},"survived":true,"accredited_to":"Dallas, Tex.","born":"Hunt County, near Kingston, Tex.","citation":"2d Lt. Murphy commanded Company B, which was attacked by 6 tanks and waves of infantry. 2d Lt. Murphy ordered his men to withdraw to prepared positions in a woods, while he remained forward at his command post and continued to give fire directions to the artillery by telephone. Behind him, to his right, 1 of our tank destroyers received a direct hit and began to burn. Its crew withdrew to the woods. 2d Lt. Murphy continued to direct artillery fire which killed large numbers of the advancing enemy infantry. With the enemy tanks abreast of his position, 2d Lt. Murphy climbed on the burning tank destroyer, which was in danger of blowing up at any moment, and employed its .50 caliber machinegun against the enemy. He was alone and exposed to German fire from 3 sides, but his deadly fire killed dozens of Germans and caused their infantry attack to waver. The enemy tanks, losing infantry support, began to fall back. For an hour the Germans tried every available weapon to eliminate 2d Lt. Murphy, but he continued to hold his position and wiped out a squad which was trying to creep up unnoticed on his right flank. Germans reached as close as 10 yards, only to be mowed down by his fire. He received a leg wound, but ignored it and continued the single-handed fight until his ammunition was exhausted. He then made his way to his company, refused medical attention, and organized the company in a counterattack which forced the Germans to withdraw. His directing of artillery fire wiped out many of the enemy; he killed or wounded about 50. 2d Lt. Murphy's indomitable courage and his refusal to give an inch of ground saved his company from possible encirclement and destruction, and enabled it to hold the woods which had been the enemy's objective.","category_hints":"One Against Many; The Boy; Epic Second Act - film star","categories":["One Against Many","The Boy (Too Young for This)","The Epic Second Act","The Last Stand"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2907/murphy-audie-l.php"},{"id":"john-basilone","name":"Basilone, John","rank":"Sergeant","branch":"U.S. Marine Corps","unit":"","conflict":"World War II","battle":"Guadalcanal","year":null,"action_date":null,"action_place":"Guadalcanal, Solomon Islands","coords":{"lat":-9,"lng":160},"survived":true,"accredited_to":"New Jersey","born":" Buffalo, N.Y.","citation":"For extraordinary heroism and conspicuous gallantry in action against enemy Japanese forces, above and beyond the call of duty, while serving with the 1st Battalion, 7th Marines, 1st Marine Division in the Lunga Area. Guadalcanal, Solomon Islands, on 24 and 25 October 1942. While the enemy was hammering at the Marines' defensive positions, Sgt. Basilone, in charge of 2 sections of heavy machineguns, fought valiantly to check the savage and determined assault. In a fierce frontal attack with the Japanese blasting his guns with grenades and mortar fire, one of Sgt. Basilone's sections, with its guncrews, was put out of action, leaving only 2 men able to carry on. Moving an extra gun into position, he placed it in action, then, under continual fire, repaired another and personally manned it, gallantly holding his line until replacements arrived. A little later, with ammunition critically low and the supply lines cut off, Sgt. Basilone, at great risk of his life and in the face of continued enemy attack, battled his way through hostile lines with urgently needed shells for his gunners, thereby contributing in large measure to the virtual annihilation of a Japanese regiment. His great personal valor and courageous initiative were in keeping with the highest traditions of the U.S. Naval Service.","category_hints":"Rallying Point; returned to combat, KIA at Iwo Jima","categories":["The Rallying Point","The Last Stand","The Career Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2627/basilone-john.php"},{"id":"hershel-woodrow-williams","name":"Williams, Hershel Woodrow","rank":"Corporal","branch":"U.S. Marine Corps","unit":"21st Marines, 3d Marine Division","conflict":"World War II","battle":"Iwo Jima","year":1945,"action_date":"1945-2-23","action_place":"Volcano Islands","coords":{"lat":25,"lng":141},"survived":true,"accredited_to":"West Virginia","born":" Quiet Dell, W. Va.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty as demolition sergeant serving with the 21st Marines, 3d Marine Division, in action against enemy Japanese forces on Iwo Jima, Volcano Islands, 23 February 1945. Quick to volunteer his services when our tanks were maneuvering vainly to open a lane for the infantry through the network of reinforced concrete pillboxes, buried mines, and black volcanic sands, Cpl. Williams daringly went forward alone to attempt the reduction of devastating machinegun fire from the unyielding positions. Covered only by 4 riflemen, he fought desperately for 4 hours under terrific enemy small-arms fire and repeatedly returned to his own lines to prepare demolition charges and obtain serviced flamethrowers, struggling back, frequently to the rear of hostile emplacements, to wipe out 1 position after another. On 1 occasion, he daringly mounted a pillbox to insert the nozzle of his flamethrower through the air vent, killing the occupants and silencing the gun; on another he grimly charged enemy riflemen who attempted to stop him with bayonets and destroyed them with a burst of flame from his weapon. His unyielding determination and extraordinary heroism in the face of ruthless enemy resistance were directly instrumental in neutralizing one of the most fanatically defended Japanese strong points encountered by his regiment and aided vitally in enabling his company to reach its objective. Cpl. Williams' aggressive fighting spirit and valiant devotion to duty throughout this fiercely contested action sustain and enhance the highest traditions of the U.S. Naval Service.","category_hints":"One Against Many; Quiet Return; last living WWII recipient","categories":["One Against Many","The Assault","The Quiet Return"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3066/williams-hershel-woodrow.php"},{"id":"douglas-albert-munro","name":"Munro, Douglas Albert","rank":"Signalman First Class","branch":"U.S. Coast Guard","unit":"","conflict":"World War II","battle":"Guadalcanal","year":null,"action_date":null,"action_place":"Guadalcanal, Solomon Islands","coords":{"lat":-9,"lng":160},"survived":false,"accredited_to":"Washington","born":" Vancouver, British Columbia","citation":"For extraordinary heroism and conspicuous gallantry m action above and beyond the call of duty as Petty Officer in Charge of a group of 24 Higgins boats, engaged in the evacuation of a battalion of marines trapped by enemy Japanese forces at Point Cruz Guadalcanal, on 27 September 1942. After making preliminary plans for the evacuation of nearly 500 beleaguered marines, Munro, under constant strafing by enemy machineguns on the island, and at great risk of his life, daringly led 5 of his small craft toward the shore. As he closed the beach, he signaled the others to land, and then in order to draw the enemy's fire and protect the heavily loaded boats, he valiantly placed his craft with its 2 small guns as a shield between the beachhead and the Japanese. When the perilous task of evacuation was nearly completed, Munro was instantly killed by enemy fire, but his crew, 2 of whom were wounded, carried on until the last boat had loaded and cleared the beach. By his outstanding leadership, expert planning, and dauntless devotion to duty, he and his courageous comrades undoubtedly saved the lives of many who otherwise would have perished. He gallantly gave his life for his country.","category_hints":"The Sea; Greater Love; only Coast Guard recipient","categories":["The Sea","Greater Love","The Rescue & Lifesaver","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2905/munro-douglas-albert.php"},{"id":"ernest-edwin-evans","name":"Evans, Ernest Edwin","rank":"Commander","branch":"U.S. Navy","unit":"","conflict":"World War II","battle":"Battle off Samar (Leyte Gulf)","year":null,"action_date":null,"action_place":"Samara, Samara Oblast, Russia","coords":{"lat":53,"lng":50},"survived":false,"accredited_to":"Oklahoma","born":" Pawnee, Okla.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty as commanding officer of the U.S.S. Johnston in action against major units of the enemy Japanese fleet during the battle off Samar on 25 October 1944. The first to lay a smokescreen and to open fire as an enemy task force, vastly superior in number, firepower and armor, rapidly approached. Comdr. Evans gallantly diverted the powerful blasts of hostile guns from the lightly armed and armored carriers under his protection, launching the first torpedo attack when the Johnston came under straddling Japanese shellfire. Undaunted by damage sustained under the terrific volume of fire, he unhesitatingly joined others of his group to provide fire support during subsequent torpedo attacks against the Japanese and, outshooting and outmaneuvering the enemy as he consistently interposed his vessel between the hostile fleet units and our carriers despite the crippling loss of engine power and communications with steering aft, shifted command to the fantail, shouted steering orders through an open hatch to men turning the rudder by hand and battled furiously until the Johnston, burning and shuddering from a mortal blow, lay dead in the water after 3 hours of fierce combat. Seriously wounded early in the engagement, Comdr. Evans, by his indomitable courage and brilliant professional skill, aided materially in turning back the enemy during a critical phase of the action. His valiant fighting spirit throughout this historic battle will venture as an inspiration to all who served with him.","category_hints":"The Sea; Last Stand; Native American trailblazer","categories":["The Sea","The Last Stand","The Trailblazer / The First","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2730/evans-ernest-edwin.php"},{"id":"james-h-doolittle","name":"Doolittle, James H.","rank":"Brigadier General","branch":"U.S. Army","unit":"Air Corps","conflict":"World War II","battle":"Doolittle Raid","year":null,"action_date":null,"action_place":"Japan","coords":{"lat":36,"lng":138},"survived":true,"accredited_to":"Berkeley, Calif.","born":"Alameda, Calif.","citation":"For conspicuous leadership above the call of duty, involving personal valor and intrepidity at an extreme hazard to life. With the apparent certainty of being forced to land in enemy territory or to perish at sea, Gen. Doolittle personally led a squadron of Army bombers, manned by volunteer crews, in a highly destructive raid on the Japanese mainland.","category_hints":"The Raid; Wings","categories":["The Raid","Wings","The Rallying Point"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2716/doolittle-james-h.php"},{"id":"daniel-k-inouye","name":"Inouye, Daniel K.","rank":"Second Lieutenant","branch":"U.S. Army","unit":"Company E, 442nd Regimental Combat Team","conflict":"World War II","battle":null,"year":null,"action_date":null,"action_place":"19032 San Terenzo SP, Italy","coords":{"lat":44,"lng":9},"survived":true,"accredited_to":"Honolulu, HI","born":"September 7, 1924","citation":"Second Lieutenant Daniel K. Inouye distinguished himself by extraordinary heroism in action on 21 April 1945, in the vicinity of San Terenzo, Italy. While attacking a defended ridge guarding an important road junction, Second Lieutenant Inouye skillfully directed his platoon through a hail of automatic weapon and small arms fire, in a swift enveloping movement that resulted in the capture of an artillery and mortar post and brought his men to within 40 yards of the hostile force. Emplaced in bunkers and rock formations, the enemy halted the advance with crossfire from three machine guns. With complete disregard for his personal safety, Second Lieutenant Inouye crawled up the treacherous slope to within five yards of the nearest machine gun and hurled two grenades, destroying the emplacement. Before the enemy could retaliate, he stood up and neutralized a second machine gun nest. Although wounded by a sniper's bullet, he continued to engage other hostile positions at close range until an exploding grenade shattered his right arm. Despite the intense pain, he refused evacuation and continued to direct his platoon until enemy resistance was broken and his men were again deployed in defensive positions. In the attack, 25 enemy soldiers were killed and eight others captured. By his gallant, aggressive tactics and by his indomitable leadership, Second Lieutenant Inouye enabled his platoon to advance through formidable resistance, and was instrumental in the capture of the ridge. Second Lieutenant Inouye's extraordinary heroism and devotion to duty are in keeping with the highest traditions of military service and reflect great credit on him, his unit, and the United States Army.","category_hints":"New American; Wounded Warrior; Epic Second Act - U.S. Senator; Belated Justice 2000","categories":["The Assault","The New American / Immigrant's Debt","The Wounded Warrior","The Epic Second Act"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2799/inouye-daniel-k.php"},{"id":"vernon-baker","name":"Baker, Vernon","rank":"First Lieutenant","branch":"U.S. Army","unit":"Weapons Platoon, Company C","conflict":"World War II","battle":null,"year":null,"action_date":null,"action_place":"Viareggio LU, Italy","coords":{"lat":43,"lng":10},"survived":true,"accredited_to":"Cheyenne, WY","born":"17 December 1919","citation":"For extraordinary heroism in action on 5 and 6 April 1945, near Viareggio, Italy. Then Second Lieutenant Baker demonstrated outstanding courage and leadership in destroying enemy installations, personnel and equipment during his company's attack against a strongly entrenched enemy in mountainous terrain. When his company was stopped by the concentration of fire from several machine gun emplacements, he crawled to one position and destroyed it, killing three Germans. Continuing forward, he attacked and enemy observation post and killed two occupants. With the aid of one of his men, Lieutenant Baker attacked two more machine gun nests, killing or wounding the four enemy soldiers occupying these positions. He then covered the evacuation of the wounded personnel of his company by occupying an exposed position and drawing the enemy's fire. On the following night Lieutenant Baker voluntarily led a battalion advance through enemy mine fields and heavy fire toward the division objective. Second Lieutenant Baker's fighting spirit and daring leadership were an inspiration to his men and exemplify the highest traditions of the Armed Forces.","category_hints":"Belated Justice - awarded 1997; Trailblazer","categories":["The Assault","The Trailblazer / The First","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2624/baker-vernon.php"},{"id":"john-r-fox","name":"Fox, John R.","rank":"Lieutenant","branch":"U.S. Army","unit":"Cannon Company, 366th Infantry Regiment, 92d Infantry Division","conflict":"World War II","battle":null,"year":null,"action_date":null,"action_place":"55051 Sommocolonia LU, Italy","coords":{"lat":44,"lng":10},"survived":false,"accredited_to":null,"born":null,"citation":"For extraordinary heroism against an armed enemy in the vicinity of Sommocolonia, Italy on 26 December 1944, while serving as a member of Cannon Company, 366th Infantry Regiment, 92d Infantry Division. During the preceding few weeks, Lieutenant Fox served with the 598th Field Artillery Battalion as a forward observer. On Christmas night, enemy soldiers gradually infiltrated the town of Sommocolonia in civilian clothes, and by early morning the town was largely in hostile hands. Commencing with a heavy barrage of enemy artillery at 0400 hours on 26 December 1944, an organized attack by uniformed German units began. Being greatly outnumbered, most of the United States Infantry forces were forced to withdraw from the town, but Lieutenant Fox and some other members of his observer party voluntarily remained on the second floor of a house to direct defensive artillery fire. At 0800 hours, Lieutenant Fox reported that the Germans were in the streets and attacking in strength. He then called for defensive artillery fire to slow the enemy advance. As the Germans continued to press the attack towards the area that Lieutenant Fox occupied, he adjusted the artillery fire closer to his position. Finally he was warned that the next adjustment would bring the deadly artillery right on top of his position. After acknowledging the danger, Lieutenant Fox insisted that the last adjustment be fired as this was the only way to defeat the attacking soldiers. Later, when a counterattack retook the position from the Germans, Lieutenant Fox's body was found with the bodies of approximately 100 German soldiers. Lieutenant Fox's gallant and courageous actions, at the supreme sacrifice of his own life, contributed greatly to delaying the enemy advance until other infantry and artillery units could reorganize to repel the attack. His extraordinary valorous actions were in keeping with the most cherished traditions of military service, and reflect the utmost credit on him, his unit, and the United States Army.","category_hints":"Greater Love - called artillery on his own position; Belated Justice 1997","categories":["Greater Love","The Last Stand","The Fallen / Ultimate Sacrifice","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2744/fox-john-r.php"},{"id":"ben-l-salomon","name":"Salomon, Ben L.","rank":"Captain","branch":"U.S. Army","unit":"","conflict":"World War II","battle":"Saipan","year":null,"action_date":null,"action_place":"Mariana Islands, CNMI","coords":{"lat":16,"lng":145},"survived":false,"accredited_to":null,"born":null,"citation":"Captain Ben L. Salomon was serving at Saipan, in the Marianas Islands on July 7, 1944, as the Surgeon for the 2d Battalion, 105th Infantry Regiment, 27th Infantry Division. The Regiment's 1st and 2d Battalions were attacked by an overwhelming force estimated between 3,000 and 5,000 Japanese soldiers. It was one of the largest attacks attempted in the Pacific Theater during World War II. Although both units fought furiously, the enemy soon penetrated the Battalions' combined perimeter and inflicted overwhelming casualties. In the first minutes of the attack, approximately 30 wounded soldiers walked, crawled, or were carried into Captain Salomon's aid station, and the small tent soon filled with wounded men. As the perimeter began to be overrun, it became increasingly difficult for Captain Salomon to work on the wounded. He then saw a Japanese soldier bayoneting one of the wounded soldiers lying near the tent. Firing from a squatting position, Captain Salomon quickly killed the enemy soldier. Then, as he turned his attention back to the wounded, two more Japanese soldiers appeared in the front entrance of the tent. As these enemy soldiers were killed, four more crawled under the tent walls. Rushing them, Captain Salomon kicked the knife out of the hand of one, shot another, and bayoneted a third. Captain Salomon butted the fourth enemy soldier in the stomach and a wounded comrade then shot and killed the enemy soldier. Realizing the gravity of the situation, Captain Salomon ordered the wounded to make their way as best they could back to the regimental aid station, while he attempted to hold off the enemy until they were clear. Captain Salomon then grabbed a rifle from one of the wounded and rushed out of the tent. After four men were killed while manning a machine gun, Captain Salomon took control of it. When his body was later found, 98 dead enemy soldiers were piled in front of his position. Captain Salomon's extraordinary heroism and devotion to duty are in keeping with the highest traditions of military service and reflect great credit upon himself, his unit, and the United States Army.","category_hints":"Healer Under Fire; Last Stand; Belated Justice 2002","categories":["The Healer Under Fire","The Last Stand","The Fallen / Ultimate Sacrifice","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2981/salomon-ben-l.php"},{"id":"richard-hetherington-okane","name":"O'Kane, Richard Hetherington","rank":"Commander","branch":"U.S. Navy","unit":"","conflict":"World War II","battle":null,"year":null,"action_date":null,"action_place":"Philippine Islands, Philippines","coords":{"lat":13,"lng":122},"survived":true,"accredited_to":"New Hampshire","born":" Dover, N.H.","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty as commanding officer of the U.S.S. Tang operating against 2 enemy Japanese convoys on 23 and 24 October 1944, during her fifth and last war patrol. Boldly maneuvering on the surface into the midst of a heavily escorted convoy, Comdr. O'Kane stood in the fusillade of bullets and shells from all directions to launch smashing hits on 3 tankers, coolly swung his ship to fire at a freighter and, in a split-second decision, shot out of the path of an onrushing transport, missing it by inches. Boxed in by blazing tankers, a freighter, transport, and several destroyers, he blasted 2 of the targets with his remaining torpedoes and, with pyrotechnics bursting on all sides, cleared the area. Twenty-four hours later, he again made contact with a heavily escorted convoy steaming to support the Leyte campaign with reinforcements and supplies and with crated planes piled high on each unit. In defiance of the enemy's relentless fire, he closed the concentration of ship and in quick succession sent 2 torpedoes each into the first and second transports and an adjacent tanker, finding his mark with each torpedo in a series of violent explosions at less than l,000-yard range. With ships bearing down from all sides, he charged the enemy at high speed, exploding the tanker in a burst of flame, smashing the transport dead in the water, and blasting the destroyer with a mighty roar which rocked the Tang from stem to stern. Expending his last 2 torpedoes into the remnants of a once powerful convoy before his own ship went down, Comdr. O'Kane, aided by his gallant command, achieved an illustrious record of heroism in combat, enhancing the finest traditions of the U.S. Naval Service.","category_hints":"The Sea; Unbroken in Captivity - USS Tang","categories":["The Sea","Unbroken in Captivity","The Career Warrior"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2925/o-kane-richard-hetherington.php"},{"id":"gregory-boyington","name":"Boyington, Gregory","rank":"Major","branch":"U.S. Marine Corps","unit":"Marine Squadron 214","conflict":"World War II","battle":null,"year":null,"action_date":null,"action_place":"Central Drive, Prince Frederick, MD 20678, USA","coords":{"lat":38,"lng":-76},"survived":true,"accredited_to":"Washington","born":" Coeur D'Alene, Idaho","citation":"For extraordinary heroism and valiant devotion to duty as commanding officer of Marine Fighting Squadron 214 in action against enemy Japanese forces in the Central Solomons area from 12 September 1943 to 3 January 1944. Consistently outnumbered throughout successive hazardous flights over heavily defended hostile territory, Maj. Boyington struck at the enemy with daring and courageous persistence, leading his squadron into combat with devastating results to Japanese shipping, shore installations, and aerial forces. Resolute in his efforts to inflict crippling damage on the enemy, Maj. Boyington led a formation of 24 fighters over Kahili on 17 October and, persistently circling the airdrome where 60 hostile aircraft were grounded, boldly challenged the Japanese to send up planes. Under his brilliant command, our fighters shot down 20 enemy craft in the ensuing action without the loss of a single ship. A superb airman and determined fighter against overwhelming odds, Maj. Boyington personally destroyed 26 of the many Japanese planes shot down by his squadron and, by his forceful leadership, developed the combat readiness in his command which was a distinctive factor in the Allied aerial achievements in this vitally strategic area.","category_hints":"Wings; Unbroken in Captivity; Fall From Grace and Second Act","categories":["Wings","Unbroken in Captivity","The Forgotten Hero / Fall From Grace","The Epic Second Act"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/2651/boyington-gregory.php"},{"id":"emil-joseph-kapaun","name":"Kapaun, Emil Joseph","rank":"Captain (Chaplain)","branch":"U.S. Army","unit":"3d Battalion, 8th Cavalry Regiment, 1st Cavalry Division","conflict":"Korean War","battle":"Battle of Unsan","year":null,"action_date":null,"action_place":"Japan, ?780-0901 K?chi-ken, K?chi-shi, Kamimachi, 1 Chome?6?2 ????????","coords":{"lat":33,"lng":133},"survived":false,"accredited_to":"Kansas","born":"April 20, 1916 / Pilsen, Kansas","citation":"For conspicuous gallantry and intrepidity at the risk of his life above and beyond the call of duty while serving with the 3d Battalion, 8th Cavalry Regiment, 1st Cavalry Division during combat operations against an armed enemy at Unsan, Korea, from November 1-2, 1950. On November 1, as Chinese Communist Forces viciously attacked friendly elements, Chaplain Kapaun calmly walked through withering enemy fire in order to provide comfort and medical aid to his comrades and rescue friendly wounded from no-man's land. Though the Americans successfully repelled the assault, they found themselves surrounded by the enemy. Facing annihilation, the able-bodied men were ordered to evacuate. However, Chaplain Kapaun, fully aware of his certain capture, elected to stay behind with the wounded. After the enemy succeeded in breaking through the defense in the early morning hours of November 2, Chaplain  Kapaun continually made rounds, as hand-to-hand combat ensued. As Chinese Communist Forces approached the American position, Chaplain Kapaun noticed an injured Chinese officer amongst the wounded and convinced him to negotiate the safe surrender of the American Forces. Shortly after his capture, Chaplain Kapaun, with complete disregard for his personal safety and unwavering resolve, bravely pushed aside an enemy soldier preparing to execute Sergeant First Class Herbert A. Miller. Not only did Chaplain Kapaun's gallantry save the life of Sergeant Miller, but also his unparalleled courage and leadership inspired all those present, including those who might have otherwise fled in panic, to remain and fight the enemy until captured. Chaplain Kapaun's extraordinary heroism and selflessness, above and beyond the call of duty, are in keeping with the highest traditions of military service and reflect great credit upon himself, the 3d Battalion, 8th Cavalry Regiment, the 1st Cavalry Division, and the United States Army. President Barack Obama presented the Medal of Honor to Kapaun's nephew at the White House on April 11, 2013.","category_hints":"Faith-Driven; Unbroken in Captivity; Greater Love - died in POW camp","categories":["Religious / Faith-Driven","Unbroken in Captivity","Greater Love","The Fallen / Ultimate Sacrifice"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3483/kapaun-emil-joseph.php"},{"id":"tibor-rubin","name":"Rubin, Tibor","rank":"Corporal","branch":"U.S. Army","unit":"Company I, 8th Cavalry Regiment, 1st Cavalry Division","conflict":"Korean War","battle":null,"year":null,"action_date":null,"action_place":"South Korea","coords":{"lat":35,"lng":127},"survived":true,"accredited_to":null,"born":" Hungary","citation":"Corporal Tibor Rubin distinguished himself by extraordinary heroism during the period from July 23, 1950, to April 20, 1953, while serving as a rifleman with Company I, 8th Cavalry Regiment, 1st Cavalry Division in the Republic of Korea. While his unit was retreating to the Pusan Perimeter, Corporal Rubin was assigned to stay behind to keep open the vital Taegu-Pusan Road link used by his withdrawing unit. During the ensuing battle, overwhelming numbers of North Korean troops assaulted a hill defended solely by Corporal Rubin. He inflicted a staggering number of casualties on the attacking force during his personal 24-hour battle, single-handedly slowing the enemy advance and allowing the 8th Cavalry Regiment to complete its withdrawal successfully. Following the breakout from the Pusan Perimeter, the 8th Cavalry Regiment proceeded northward and advanced into North Korea. During the advance, he helped capture several hundred North Korean soldiers. On October 30, 1950, Chinese forces attacked his unit at Unsan, North Korea, during a massive nighttime assault. That night and throughout the next day, he manned a .30 caliber machine gun at the south end of the unit's line after three previous gunners became casualties. He continued to man his machine gun until his ammunition was exhausted. His determined stand slowed the pace of the enemy advance in his sector, permitting the remnants of his unit to retreat southward. As the battle raged, Corporal Rubin was severely wounded and captured by the Chinese. Choosing to remain in the prison camp despite offers from the Chinese to return him to his native Hungary, Corporal Rubin disregarded his own personal safety and immediately began sneaking out of the camp at night in search of food for his comrades. Breaking into enemy food storehouses and gardens, he risked certain torture or death if caught. Corporal Rubin provided not only food to the starving Soldiers, but also desperately needed medical care and moral support for the sick and wounded of the POW camp. His brave, selfless efforts were directly attributed to saving the lives of as many as forty of his fellow prisoners. Corporal Rubin's gallant actions in close contact with the enemy and unyielding courage and bravery while a prisoner of war are in the highest traditions of military service and reflect great credit upon himself and the United States Army.","category_hints":"New American - Holocaust survivor; Unbroken in Captivity; Belated Justice 2005","categories":["The New American / Immigrant's Debt","Unbroken in Captivity","One Against Many","Belated Justice / The Long Vindication"],"photo_url":null,"cmohs_link":"http://www.cmohs.org/recipient-detail/3183/rubin-tibor.php"},{"id":"hiroshi-h-miyamura","name":"Miyamura, Hiroshi H.","rank":"Corporal","branch":"U.S. Army","unit":"Company H, 7th Infantry Regiment, 3rd Infantry Division","conflict":"Korean War","battle":null,"year":null,"action_date":null,"action_place":"South Korea","coords":{"lat":35,"lng":127},"survived":true,"accredited_to":"Gallup, NM","born":"October 6, 1925, Gallup, N. Mex.","citation":"Cpl. Miyamura, a member of Company H, distinguished himself by conspicuous gallantry and intrepidity above and beyond the call of duty in action against the enemy. On the night of 24 April, Company H was occupying
