<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories of Valor — Medal of Honor</title>
<meta name="description" content="Browse Medal of Honor citations by what they mean — 32 themes, every conflict, every branch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style id="tokens">
/*__TOKENS__*/
</style>
<style>
/* ---------- reset / base ---------- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
@media (prefers-reduced-motion:no-preference){
  a,button,.chip,.card,.seg-btn,.rail-nav-item,.theme-row{transition:background .12s ease,color .12s ease,border-color .12s ease,box-shadow .12s ease;}
}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--radius);}
mark{background:var(--accent-bg);color:var(--accent);padding:0 .5px;border-radius:2px;font-style:normal;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
/* VALOR star — inline SVG silhouette of valor-star.png for small (11-16px) uses; raster data URI covers the rest */
.star-i{width:1em;height:1em;display:inline-block;vertical-align:-.12em;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.rail{
  width:230px;flex:0 0 230px;position:fixed;top:0;left:0;bottom:0;
  background:var(--rail);border-right:1px solid var(--rail-border);
  display:flex;flex-direction:column;overflow-y:auto;z-index:20;
}
main{margin-left:230px;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}

/* ---------- rail ---------- */
.rail-logo{padding:18px 14px 14px;border-bottom:1px solid var(--rail-border);}
.rail-logo .wordmark{font-family:var(--font-mono);font-size:30px;font-weight:900;letter-spacing:.1em;line-height:.72;text-transform:uppercase;color:var(--brand-ink);}
.rail-logo .wordmark .wm-star{height:24px;width:auto;vertical-align:-2px;margin-left:2px;}
.rail-logo .subtitle{font-family:var(--font-mono);font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.24em;color:var(--text-subtle);margin-top:8px;}
.rail-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
.rail-nav-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;
  font-size:13.5px;font-weight:500;color:var(--rail-muted);background:none;border:none;text-align:left;width:100%;
}
.rail-nav-item:hover{background:var(--rail-hover);color:var(--rail-text);}
.rail-nav-item.active{background:var(--rail-raised);color:var(--rail-text);font-weight:600;box-shadow:inset 2px 0 var(--accent);}
.rail-nav-item .label{flex:1 1 auto;}
.rail-badge{font-family:var(--font-mono);font-size:10.5px;font-weight:800;border-radius:var(--radius-pill);padding:1px 7px;line-height:1.4;}
.rail-badge.warn{background:var(--gold-fill);color:var(--gold-ink);border:1px solid var(--gold-ink);}
.rail-badge.neutral{background:var(--rail-raised);color:var(--rail-muted);}
.rail-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--rail-subtle);padding:14px 12px 6px;}
.rail-groups{padding:0 10px;display:flex;flex-direction:column;}
.theme-row{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:6px;font-size:13px;color:var(--rail-text);background:none;border:none;width:100%;text-align:left;}
.theme-row:hover{background:var(--rail-hover);}
.theme-row .bar{width:3px;height:15px;border-radius:2px;flex:0 0 3px;}
.theme-row .name{flex:1 1 auto;}
.theme-row .count{font-family:var(--font-mono);font-size:11.5px;color:var(--rail-subtle);}
.rail-foot{margin:10px;padding:9px 12px;border-radius:8px;font-size:11px;line-height:1.5;
  background:color-mix(in srgb,var(--warning) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);color:var(--warning);}
.rail-spacer{flex:1 1 auto;}

/* ---------- favorites layer (hidden until Supabase reachable — .favs-on on body) ---------- */
.rail-picks,.rail-auth{display:none;}
.favs-on .rail-picks{display:block;}
.favs-on .rail-auth{display:block;margin:4px 10px 10px;padding:10px 12px;border-radius:8px;background:var(--rail-raised);}
.auth-box summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--rail-muted);list-style:none;}
.auth-box summary::-webkit-details-marker{display:none;}
.auth-box[open] summary{margin-bottom:8px;}
.auth-form{display:flex;flex-direction:column;gap:6px;}
.auth-form input{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:6px 8px;font-size:12px;color:var(--text);width:100%;}
.auth-form input:focus{border-color:var(--accent);outline:none;}
.auth-row{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.auth-err{font-size:11px;color:var(--critical);min-height:0;}
.auth-err:empty{display:none;}
.auth-user{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--rail-text);}
.auth-user .link-quiet{margin-left:auto;}
.link-quiet{background:none;border:none;color:var(--rail-subtle);font-size:11px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
.link-quiet:hover{color:var(--rail-muted);}

/* heart toggle — quiet; visible only when the layer is live */
.fav-btn{display:none;width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;color:var(--text-subtle);cursor:pointer;flex:0 0 auto;}
.favs-on .fav-btn{display:inline-flex;}
.fav-btn:hover{color:var(--fav);background:color-mix(in srgb,var(--fav) 10%,transparent);}
.fav-btn[aria-pressed="true"]{color:var(--fav);}
.fav-btn svg{width:15px;height:15px;}
.fav-btn[aria-pressed="true"] svg path{fill:currentColor;}

/* liked-by chips — small initials circles in each user's color */
.liked-chips{display:none;align-items:center;margin-left:4px;}
.favs-on .liked-chips{display:inline-flex;}
.liked-chips .lk{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:8.5px;font-weight:800;color:var(--surface);border:1.5px solid var(--surface);margin-left:-5px;}
.liked-chips .lk:first-child{margin-left:0;}
.auth-user .lk{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:9px;font-weight:800;color:var(--surface);}
.detail-favrow{display:none;align-items:center;gap:6px;margin-bottom:18px;}
.favs-on .detail-favrow{display:flex;}
.detail-favrow .lk-label{font-size:11.5px;color:var(--text-muted);}

/* ---------- header ---------- */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:flex-start;gap:16px;}
.hdr h1{font-size:18px;font-weight:700;margin:0;line-height:1.2;}
.hdr .sub{font-size:12.5px;color:var(--text-subtle);margin-top:3px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:500;box-shadow:var(--shadow-sm);}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text);}
.icon-btn svg{width:15px;height:15px;}
.menu-toggle{display:none;}

/* ---------- sticky toolbar (filters + active pills stick; page header scrolls away) ---------- */
.toolbar{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);padding-bottom:14px;}

/* ---------- filter row ---------- */
.filters{padding:14px 26px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.filters .search{position:relative;flex:1 1 260px;max-width:320px;}  /* scoped: .chip.search must not pick up this flex */
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-subtle);pointer-events:none;}
.search input{width:100%;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:8px 10px 8px 32px;font-size:13px;color:var(--text);box-shadow:var(--shadow-sm);}
.search input::placeholder{color:var(--text-subtle);}
.search input:focus{border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);color:var(--text);font-size:12.5px;font-weight:500;box-shadow:var(--shadow-sm);white-space:nowrap;}
.btn:hover{border-color:var(--border-strong);}
.btn[aria-expanded="true"]{border-color:var(--accent);}
.btn .chev{width:12px;height:12px;color:var(--text-subtle);}
.btn .pill-n{font-family:var(--font-mono);font-size:10.5px;font-weight:800;background:var(--accent);color:var(--accent-fg);border-radius:var(--radius-pill);padding:0 6px;line-height:16px;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);}
.seg-btn{height:34px;padding:0 13px;border:none;background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:500;white-space:nowrap;border-left:1px solid var(--border);}
.seg-btn:first-child{border-left:none;}
.seg-btn:hover{color:var(--text);}
.seg-btn.active{background:var(--accent-solid);color:var(--accent-fg);font-weight:600;}
.seg-btn .star-i{margin-right:3px;}
.cols-seg{margin-left:auto;}
.cols-seg .seg-btn{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;padding:0 12px;}

/* ---------- active filter bar ---------- */
.activebar{padding:12px 26px 0;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;}
.activebar.hidden{display:none;}
.ab-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--text-subtle);text-transform:uppercase;}
/* active-filter pills — navy brand design (doc v2), uniform across every dimension */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 11px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;
  background:color-mix(in srgb,var(--brand-ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--brand-ink) 18%,transparent);color:var(--brand-ink);}
.chip .x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:none;background:transparent;color:inherit;opacity:.75;font-size:13px;line-height:1;}
.chip .x:hover{opacity:1;background:var(--brand-ink);color:var(--surface);}
.chip.search{font-family:var(--font-mono);}
.chip.search em{font-style:normal;}
.link-btn{background:none;border:none;color:var(--brand-ink);font-size:12px;font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px;}
.link-btn:hover{opacity:.75;}
.ab-saved{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.pill-outline{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);background:var(--surface);font-size:11.5px;font-weight:600;color:var(--text-muted);}
.pill-outline:hover{border-color:var(--accent);color:var(--text);}
.pill-outline .x{margin-left:2px;opacity:.6;}
.pill-outline .x:hover{opacity:1;}
.pill-dashed{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent;}

/* ---------- count bar ---------- */
.countbar{padding:12px 26px 0;display:flex;gap:12px;align-items:baseline;font-size:12px;color:var(--text-subtle);}
.countbar .n{font-family:var(--font-mono);font-weight:700;color:var(--text);}
.countbar .fell{color:var(--gold-line);font-weight:600;}
.countbar .range{margin-left:auto;font-family:var(--font-mono);color:var(--text-subtle);}

/* ---------- card grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:16px 26px 40px;}
.grid[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr));}
/* 1-across = reading list: single column flush LEFT under the toolbar (human ruling
   2026-07-31 — no centering). Cap ≈ toolbar's min comfortable span (≈ a 2-across pair);
   below the cap the card stays fluid and shrinks with the window. */
.grid[data-cols="1"]{grid-template-columns:minmax(0,1080px);}
.grid[data-cols="1"] .card-excerpt{-webkit-line-clamp:9;}
/* 1/2-across: portrait becomes a full-card-height image strip on the LEFT edge */
.grid[data-cols="1"] .card,.grid[data-cols="2"] .card{flex-direction:row;align-items:stretch;}
.grid[data-cols="1"] .card>.card-photo,.grid[data-cols="2"] .card>.card-photo{display:block;flex:0 0 150px;align-self:stretch;
  background:var(--surface-raised);border-right:1px solid var(--border);}
.grid[data-cols="1"] .card>.card-photo{flex-basis:200px;}   /* roomier strip in the reading list */
.grid[data-cols="1"] .card .avatar,.grid[data-cols="2"] .card .avatar{display:none;}
/* medal column — branding 3-column card (portrait · info · medal), 1/2-across only; 3-across stays compact */
.card-medal{display:none;}
.grid[data-cols="1"] .card .card-medal,.grid[data-cols="2"] .card .card-medal{
  display:flex;flex:0 0 148px;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  align-self:stretch;border-left:1px solid var(--border);padding:16px 10px;}
.card-medal img{height:104px;width:auto;}
.card-medal .medal-branch{font-family:var(--font-mono);font-weight:900;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand-ink);text-align:center;line-height:1.6;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);
  display:flex;flex-direction:column;box-sizing:border-box;text-align:left;color:inherit;overflow:hidden;}
.card-main{display:flex;flex-direction:column;gap:10px;padding:15px 17px;min-width:0;flex:1 1 auto;}
.card-photo{display:none;}          /* portrait strip: only shown in 1/2-across (see grid rules) */
.card-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;}  /* bias crop upward — heads never cut */
.card-photo .ph{width:100%;height:100%;min-height:132px;display:flex;align-items:center;justify-content:center;
  color:var(--text-subtle);font-family:var(--font-mono);font-weight:700;font-size:26px;}
.card:hover{border-color:var(--border-strong);}
.card:hover .card-name{color:var(--accent);}
/* theme-group blocks: own row above the name area — out of the text's layout path,
   can never collide with name/rank at any width (human fix 2026-07-31) */
.dept-row{display:flex;justify-content:flex-end;margin-bottom:-4px;}
.card-top{display:flex;align-items:flex-start;gap:11px;}
.avatar{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:800;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.card-id{flex:1 1 auto;min-width:0;}
/* block-level: as inline spans the ellipsis never applied, so long names/ranks overflowed
   and fused ("Parrott, JacobPrivate · U.S. Army") — block gives real truncation + own line */
.card-name{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{display:block;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.dept-seg{display:flex;gap:2px;padding:3px;background:var(--surface-raised);border-radius:4px;flex:0 0 auto;}
.dept-seg .blk{width:10px;height:6px;border-radius:1px;background:var(--seg-off);}
.card-meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;color:var(--text-subtle);text-transform:uppercase;}
.card-excerpt{font-size:13px;line-height:1.55;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-excerpt.snippet{font-style:italic;}
.card-foot{margin-top:auto;display:flex;align-items:center;gap:8px;}
.theme-chip{display:inline-flex;align-items:center;max-width:185px;padding:2px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plusn{font-size:11px;font-weight:600;color:var(--text-subtle);}
.fate-chip{margin-left:auto;padding:2px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;white-space:nowrap;}
.fate-chip.fell{background:color-mix(in srgb,var(--gold-fill) 22%,transparent);border:1px solid color-mix(in srgb,var(--gold-line) 55%,transparent);color:var(--gold-line);font-weight:700;}
.fate-chip.surv{background:var(--neutral-bg);color:var(--text-muted);}

/* ---------- empty state ---------- */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.empty .rule{width:44px;height:3px;background:var(--border-strong);border-radius:2px;}
.empty .kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--text-subtle);}
.empty h2{font-size:16px;font-weight:600;margin:0;max-width:440px;}
.empty p{font-size:13px;color:var(--text-muted);max-width:420px;margin:0;}
.empty .actions{display:flex;gap:10px;margin-top:4px;}

/* ---------- popover menus ---------- */
/* z-index: var(--z-modal) (2000) escapes Leaflet's panes/controls (~700-1000), same fix
   as the detail modal — dropdowns must open fully over the Map view */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:calc(var(--z-modal) - 10);opacity:0;pointer-events:none;transition:opacity .12s ease;}
.scrim.open{opacity:1;pointer-events:auto;}
.popover{position:absolute;z-index:var(--z-modal);background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);
  padding:0;display:none;}
.popover.open{display:block;}
.menu-list{max-height:340px;overflow-y:auto;padding:8px;min-width:230px;}
/* menu rows (doc v2) — shared by the themes popover AND the list menus (.popover scope, not .menu-list:
   the themes popover has no .menu-list wrapper, which is why its checkmarks used to render unstyled) */
.popover .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:12.5px;color:var(--text-muted);cursor:pointer;}
.popover .opt:hover{background:color-mix(in srgb,var(--brand-ink) 5%,transparent);}
.popover .opt .cbx{width:15px;height:15px;border:1.5px solid var(--border-strong);border-radius:3px;flex:0 0 15px;display:flex;align-items:center;justify-content:center;}
.popover .opt .cbx svg{width:10px;height:10px;color:var(--surface);display:none;}
.popover .opt[aria-checked="true"]{background:color-mix(in srgb,var(--brand-ink) 6%,transparent);}
.popover .opt[aria-checked="true"] .lbl{font-weight:600;color:var(--text);}
.popover .opt[aria-checked="true"] .cbx{background:var(--brand-ink);border-color:var(--brand-ink);}
.popover .opt[aria-checked="true"] .cbx svg{display:block;}
.popover .opt .lbl{flex:1 1 auto;}
.popover .opt .c{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle);}
.popover .opt.zero{opacity:.5;}

/* theme menu (4 columns) */
.theme-menu{width:min(760px,92vw);}
.theme-menu .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:14px;}
.theme-col{padding:0 12px;}  /* columns separated by whitespace only (mockup 6a — no vertical rules) */
.theme-col .top-rule{height:3px;border-radius:2px;margin-bottom:8px;}
.theme-col .grp{font-size:11px;font-weight:800;text-transform:none;}
.theme-col .desc{font-size:11px;font-style:italic;color:var(--text-subtle);margin:2px 0 8px;}
.theme-col .opt{padding:5px 4px;}
.menu-foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);}
.menu-foot .hint{font-size:11.5px;font-style:italic;color:var(--text-subtle);flex:1 1 auto;}
.btn-ghost{background:none;border:none;color:var(--text-muted);font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:6px;}
.btn-ghost:hover{background:var(--surface-raised);color:var(--text);}
.btn-primary{background:var(--accent-solid);color:var(--accent-fg);border:none;border-radius:var(--radius);padding:8px 14px;font-size:12.5px;font-weight:600;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:active{transform:translateY(1px);}

/* ---------- detail modal ---------- */
/* z-index:var(--z-modal) (2000) escapes Leaflet's panes/controls so the modal covers the map */
.detail-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:var(--z-modal);display:none;overflow-y:auto;}
.detail-scrim.open{display:block;}
.detail{max-width:1040px;margin:24px auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);
  display:grid;grid-template-columns:340px 1fr;overflow:hidden;min-height:200px;}
.detail-meta{border-right:1px solid var(--border);padding:22px;background:var(--surface);}
.detail-close{position:absolute;top:36px;right:calc(50% - 520px + 18px);z-index:2;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}
.detail-close:hover{border-color:var(--border-strong);color:var(--text);}
.fate-banner{border-left:3px solid var(--gold-fill);background:color-mix(in srgb,var(--gold-fill) 12%,transparent);padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:18px;}
.fate-banner.surv{border-left-color:var(--neutral);background:var(--neutral-bg);}
.fate-banner .fb-top{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--gold-line);letter-spacing:.03em;}
.fate-banner.surv .fb-top{color:var(--text-muted);}
.fate-banner .fb-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.meta-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);margin:18px 0 8px;}
.meta-rows{display:flex;flex-direction:column;}
.meta-r{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.meta-r .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);width:96px;flex:0 0 96px;padding-top:2px;}
.meta-r .v{color:var(--text);flex:1 1 auto;}
.meta-themes{display:flex;flex-direction:column;gap:6px;}
.meta-theme{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text);}
.meta-theme .bar{width:3px;height:15px;border-radius:2px;flex:0 0 3px;}
.meta-links{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.meta-links a,.meta-links button{color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none;background:none;border:none;padding:0;text-align:left;display:inline-flex;align-items:center;gap:6px;}
.meta-links a:hover,.meta-links button:hover{text-decoration:underline;}
.detail-portrait{width:100%;max-width:150px;aspect-ratio:4/5;object-fit:cover;object-position:50% 18%;border-radius:8px;border:1px solid var(--border);background:var(--surface-raised);display:block;margin-bottom:18px;}
.meta-credit{margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);font-size:11px;line-height:1.45;color:var(--text-subtle);}
.detail-read{padding:34px 40px 44px;min-width:0;}
.read-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;}
.read-name{font-size:30px;font-weight:700;line-height:1.12;margin:12px 0 6px;}
.read-sub{font-size:13.5px;color:var(--text-muted);}
.read-cite{font-size:16.5px;line-height:1.7;color:var(--text);max-width:66ch;margin-top:22px;white-space:pre-wrap;}
.read-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;font-style:italic;color:var(--text-subtle);}
.read-foot a{color:var(--accent);}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{display:flex;align-items:center;gap:10px;background:var(--rail-inverse);color:var(--rail-inverse-text);border-radius:8px;padding:11px 14px;font-size:12.5px;box-shadow:var(--shadow-lg);
  animation:toastin .16s ease;}
.toast svg{width:15px;height:15px;color:var(--accent);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- map ---------- */
.grid[hidden],.mapwrap[hidden]{display:none !important;}
.mapwrap{position:relative;flex:1 1 auto;min-height:520px;}
#map{position:absolute;inset:16px 26px 26px;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);background:var(--surface-raised);}
.leaflet-container{background:var(--surface-raised);font-family:var(--font-ui);border-radius:8px;}
.map-legend,.map-disclaimer{position:absolute;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow-sm);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-muted);padding:7px 11px;}
.map-legend{left:42px;bottom:44px;display:flex;align-items:center;gap:4px;}
.map-legend .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);display:inline-block;}
.map-legend .legend-star{width:14px;height:14px;vertical-align:-3px;}
.map-legend .ghost-ring{background:transparent;border:1.5px dashed var(--accent);opacity:.7;}
.map-legend .ghost-star-slot svg{width:14px;height:14px;vertical-align:-3px;opacity:.7;}
.pin-star.ghost{opacity:.62;}
.pin-star.ghost svg{width:100%;height:100%;display:block;}
.mp-approxline{font-size:10.5px;font-style:italic;color:var(--text-subtle);border-left:2px solid var(--border-strong);padding-left:6px;margin-bottom:5px;max-width:210px;}
.map-disclaimer{right:42px;bottom:44px;color:var(--text-subtle);}
.pin-star{width:20px;height:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
.pin-star img{width:100%;height:100%;display:block;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);}
.leaflet-popup-content{margin:12px 14px;font-family:var(--font-ui);}
.mp-kick{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);}
.mp-name{font-size:14px;font-weight:700;color:var(--text);margin-top:3px;}
.mp-place{font-size:12px;font-weight:600;color:var(--text);margin-top:4px;}
.mp-approx{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);border:1px solid var(--border);border-radius:var(--radius-pill);padding:1px 6px;margin-left:4px;vertical-align:1px;}
.mp-meta{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--text-muted);margin-top:4px;}
.mp-meta .gold{color:var(--gold-line);}
.mp-link{display:inline-block;margin-top:9px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;}
.mp-link:hover{text-decoration:underline;}

/* ---------- responsive ---------- */
@media (max-width:1080px){.grid:not([data-cols="1"]):not([data-cols="2"]){grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:820px){
  .rail{transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow-lg);}
  .rail.open{transform:none;}
  main{margin-left:0;}
  .menu-toggle{display:inline-flex;}
  .hdr{padding:12px 16px;}
  .filters,.activebar,.countbar,.grid{padding-left:16px;padding-right:16px;}
  .grid,.grid[data-cols="1"],.grid[data-cols="2"],.grid[data-cols="3"]{grid-template-columns:1fr;justify-content:stretch;}
  .filters .search{max-width:none;flex-basis:100%;}
  .theme-menu .cols{grid-template-columns:repeat(2,1fr);gap:6px 0;}
  .detail{grid-template-columns:1fr;margin:0;border-radius:0;min-height:100vh;}
  .detail-meta{border-right:none;border-bottom:1px solid var(--border);}
  .detail-close{right:14px;top:14px;}
  .detail-read{padding:22px 18px 40px;}
  .ab-saved{margin-left:0;flex-basis:100%;}
  .grid[data-cols="1"] .card>.card-photo,.grid[data-cols="2"] .card>.card-photo{flex-basis:130px;}
}
/* medal stays dignified, never squeezed: below 640px there isn't room for the third column */
@media (max-width:640px){.card-medal{display:none !important;}}
/* themes popover: 2 columns on narrow screens (see 820px block), full stack on mobile */
@media (max-width:600px){
  .theme-menu .cols{grid-template-columns:1fr;}
  .theme-col{border-top:1px solid var(--border-soft);padding-top:10px;margin-top:6px;}
  .theme-col:first-child{border-top:none;margin-top:0;}
}

/* ---------- print ---------- */
@media print{
  .rail,.hdr-right,.toolbar,.countbar,.menu-toggle,.toast-wrap,.scrim,.popover,.mapwrap{display:none !important;}
  main{margin-left:0;}
  body{background:var(--bg);}
  .grid{display:block;padding:0;}
  .card{page-break-inside:avoid;box-shadow:none;border:none;border-bottom:1px solid var(--border-strong);border-radius:0;margin-bottom:12px;}
  .detail-scrim{position:static;background:none;display:block;overflow:visible;}
  .detail{box-shadow:none;border:none;grid-template-columns:1fr;margin:0;}
  .detail-close,.meta-links{display:none !important;}
  .read-cite{max-width:none;}
}
</style>
</head>
<body>
<div class="app">
  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-logo">
      <div class="wordmark">VALOR<img class="wm-star" id="wmStar" alt="" aria-hidden="true"></div>
      <div class="subtitle" id="railKicker">Medal of Honor</div>
    </div>
    <nav class="rail-nav">
      <button class="rail-nav-item active" data-nav="stories">
        <span class="label">Stories</span>

      </button>

      </button>

    <div class="rail-picks" id="railPicks"></div>

  <!-- ================= MAIN ================= -->

    <header class="hdr">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

        <h1>Stories</h1>

        <input id="search" type="search" placeholder="Search names, places, citations…" autocomplete="off" aria-label="Search">
      </div>
      <button class="btn" id="btnThemes" aria-expanded="false" aria-haspopup="true">Themes <span class="pill-n" id="nThemes" hidden>0</span> <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="btn" id="btnConflict" aria-expanded="false" aria-haspopup="true">Conflict <span class="pill-n" id="nConflict" hidden>0</span> <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="btn" id="btnBranch" aria-expanded="false" aria-haspopup="true">Branch <span class="pill-n" id="nBranch" hidden>0</span> <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg></button>

      <div class="seg" role="group" aria-label="Fate">

<!-- popovers -->

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const PILOT = /*__DATA__*/[];
const ASSETS = /*__ASSETS__*/{};
</script>
<script>
"use strict";
/* ===================== taxonomy ===================== */
const GROUPS = [
  {key:"deed",  label:"The Deed",      desc:"what earned it",        varc:"--tg-deed",
   themes:["The Assault","The Last Stand","The Body on the Grenade","The Rescue & Lifesaver","The Healer Under Fire","The Colors","One Against Many","The Raid","Wings","The Sea","Unbroken in Captivity","The Rallying Point"]},
  {key:"person",label:"The Person",    desc:"who they were",         varc:"--tg-person",
   themes:["The Reluctant Warrior","The New American / Immigrant's Debt","The Trailblazer / The First","The Boy (Too Young for This)","The Career Warrior","The Citizen-Soldier","The Twice-Honored"]},
  {key:"spirit",label:"The Spirit",    desc:"why it moves us",       varc:"--tg-spirit",
   themes:["Religious / Faith-Driven","Miraculous / Left for Dead","Greater Love","Redemption / The Second Birth","Brotherhood / No One Left Behind","Duty & Country","The Cost of War / Lament"]},
  {key:"after", label:"The Aftermath", desc:"life beyond the medal", varc:"--tg-after",
   themes:["The Fallen / Ultimate Sacrifice","The Quiet Return","Belated Justice / The Long Vindication","The Forgotten Hero / Fall From Grace","The Wounded Warrior","The Epic Second Act"]},
];
const THEMES = GROUPS.flatMap(g=>g.themes);                 // flat 32, stable order (URL index)
const THEME_GROUP = {}; GROUPS.forEach(g=>g.themes.forEach(t=>THEME_GROUP[t]=g));
const groupColor = g => `var(${g.varc})`;

/* ===================== VALOR brand: star + medals ===================== */
// Inline SVG silhouette of valor-star.png (rosette-tipped MoH star, native point-DOWN — never flip).
// Used at small sizes (11-16px) where the raster would blur; ASSETS.star (data URI) covers larger uses.
const STAR_PATH = "M12.00 21.40L9.59 15.32L3.06 14.90L8.10 10.73L6.47 4.40L12.00 7.90L17.53 4.40L15.90 10.73L20.94 14.90L14.41 15.32ZM11.38 21.85A0.62 0.62 0 1 0 12.62 21.85A0.62 0.62 0 1 0 11.38 21.85ZM10.66 21.30A0.62 0.62 0 1 0 11.90 21.30A0.62 0.62 0 1 0 10.66 21.30ZM12.10 21.30A0.62 0.62 0 1 0 13.34 21.30A0.62 0.62 0 1 0 12.10 21.30ZM2.01 15.04A0.62 0.62 0 1 0 3.25 15.04A0.62 0.62 0 1 0 2.01 15.04ZM2.31 14.19A0.62 0.62 0 1 0 3.55 14.19A0.62 0.62 0 1 0 2.31 14.19ZM2.76 15.56A0.62 0.62 0 1 0 4.00 15.56A0.62 0.62 0 1 0 2.76 15.56ZM5.59 4.03A0.62 0.62 0 1 0 6.83 4.03A0.62 0.62 0 1 0 5.59 4.03ZM6.50 4.05A0.62 0.62 0 1 0 7.74 4.05A0.62 0.62 0 1 0 6.50 4.05ZM5.33 4.90A0.62 0.62 0 1 0 6.57 4.90A0.62 0.62 0 1 0 5.33 4.90ZM17.17 4.03A0.62 0.62 0 1 0 18.41 4.03A0.62 0.62 0 1 0 17.17 4.03ZM17.43 4.90A0.62 0.62 0 1 0 18.67 4.90A0.62 0.62 0 1 0 17.43 4.90ZM16.26 4.05A0.62 0.62 0 1 0 17.50 4.05A0.62 0.62 0 1 0 16.26 4.05ZM20.75 15.04A0.62 0.62 0 1 0 21.99 15.04A0.62 0.62 0 1 0 20.75 15.04ZM20.00 15.56A0.62 0.62 0 1 0 21.24 15.56A0.62 0.62 0 1 0 20.00 15.56ZM20.45 14.19A0.62 0.62 0 1 0 21.69 14.19A0.62 0.62 0 1 0 20.45 14.19Z";
// two passes: fat dark stroke behind, gold fill on top -> clean outer outline, no interior seams
const starSVG = () => `<svg class="star-i" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}" fill="var(--gold-line)" stroke="var(--gold-line)" stroke-width="1.3" stroke-linejoin="round"/><path d="${STAR_PATH}" fill="var(--gold-fill)"/></svg>`;
// Medal artwork by branch: Army pattern for Army; Navy pattern for Navy, Marine Corps AND Coast Guard
// (historically correct — they receive the Navy medal); Air Force pattern for Air Force.
// The label under the medal always names the RECIPIENT'S branch, even on the Navy pattern.
function medalSrc(branch){
  const b = (branch||"").toLowerCase();
  return b.includes("air force") ? ASSETS.medalAF : b.includes("army") ? ASSETS.medalArmy : ASSETS.medalNavy;
}
const branchLabel = branch => (branch||"").replace(/^U\.S\.\s*/,"").toUpperCase();

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg>';
function yearOf(s){
  if(s.year) return s.year;
  // bounded to 1860+ so a "Birth: 1844" in a dateless citation can't pollute the year span
  const m = String((s.action_date||"")+" "+(s.citation||"")).match(/\b(18[6-9]\d|19\d\d|20[0-2]\d)\b/);
  return m ? +m[1] : null;
}
function initials(name){
  // roster order "Last, First ..." -> First-name + Last-name initials
  const parts = name.split(",");
  const last = (parts[0]||"").trim();
  const rest = (parts[1]||"").trim();
  const a = (rest[0]||last[0]||"?");
  const b = (last[0]||"");
  return (a+b).toUpperCase();
}
/* ===================== dataset bootstrap =====================
   PILOT (50, inline) renders instantly and is the offline/file:// fallback.
   The full corpus (data/stories.json) is fetched at runtime and swapped in. */
let STORIES = PILOT;
let FULL_LOADED = false;
let CONFLICTS = [], BRANCHES = [], BATTLES = [];
function indexData(){
  STORIES.forEach(s=>{
    s._year = yearOf(s);
    s._blob = [s.name,s.rank,s.branch,s.unit,s.conflict,s.battle,s.action_place,s.accredited_to,s.citation,(s.categories||[]).join(" ")].join(" ").toLowerCase();
  });
  CONFLICTS = [...new Set(STORIES.map(s=>s.conflict))].sort();
  BRANCHES  = [...new Set(STORIES.map(s=>s.branch))].sort();
  BATTLES   = [...new Set(STORIES.map(s=>s.battle).filter(Boolean))].sort();
}
indexData();

/* ===================== state ===================== */
function loadCols(){ const n=+localStorage.getItem("moh_cols"); return (n===1||n===2||n===3)?n:3; }
const state = {
  themes:new Set(), conflicts:new Set(), branches:new Set(), battles:new Set(),
  fate:"all", query:"", view:"list", cols:loadCols(),
  pick:null,   // favorites dimension: "top" | profile user_id | null
};
let SAVED = loadSaved();
let openStoryId = null;

/* ===================== filtering / facets ===================== */
function passExcept(s, dim){
  if(dim!=="picks"&&state.pick){
    if(state.pick==="top"){ if(!FAV.byStory.has(s.id)) return false; }
    else { if(!FAV.byUser.get(state.pick)?.has(s.id)) return false; }
  }
  if(dim!=="fate"){ if(state.fate==="survived"&&!s.survived) return false; if(state.fate==="fell"&&s.survived) return false; }
  if(dim!=="query"&&state.query){ if(!s._blob.includes(state.query.toLowerCase())) return false; }
  if(dim!=="themes"&&state.themes.size){ if(![...state.themes].every(t=>s.categories.includes(t))) return false; }
  if(dim!=="conflicts"&&state.conflicts.size){ if(!state.conflicts.has(s.conflict)) return false; }
  if(dim!=="branches"&&state.branches.size){ if(!state.branches.has(s.branch)) return false; }
  if(dim!=="battles"&&state.battles.size){ if(!state.battles.has(s.battle)) return false; }
  return true;
}
const filtered = () => STORIES.filter(s=>passExcept(s,null));
/* faceted count: stories passing all OTHER dims, that also hold `value` in `dim`.
   At 3,475 records the per-dim pass mask is cached per render cycle (facetToken) so the
   32-theme popover costs one corpus scan per dim instead of one per option. */
let facetToken = 0;
let FACET_MASKS = {token:-1, masks:{}};
function maskFor(dim){
  if(FACET_MASKS.token!==facetToken) FACET_MASKS = {token:facetToken, masks:{}};
  return FACET_MASKS.masks[dim] || (FACET_MASKS.masks[dim] = STORIES.map(s=>passExcept(s,dim)));
}
function facet(dim, test){
  const m = maskFor(dim); let n = 0;
  for(let i=0;i<STORIES.length;i++){ if(m[i]&&test(STORIES[i])) n++; }
  return n;
}

/* ===================== URL state ===================== */
function writeURL(push){
  const p = new URLSearchParams();
  if(state.query) p.set("q", state.query);
  if(state.themes.size) p.set("t", [...state.themes].map(t=>THEMES.indexOf(t)).sort((a,b)=>a-b).join(","));
  if(state.conflicts.size) p.set("c", [...state.conflicts].map(c=>CONFLICTS.indexOf(c)).sort((a,b)=>a-b).join(","));
  if(state.branches.size) p.set("b", [...state.branches].map(c=>BRANCHES.indexOf(c)).sort((a,b)=>a-b).join(","));
  if(state.battles.size) p.set("bt", [...state.battles].map(c=>BATTLES.indexOf(c)).sort((a,b)=>a-b).join(","));
  if(state.fate!=="all") p.set("f", state.fate);
  if(state.pick) p.set("p", state.pick);
  if(state.cols!==3) p.set("cols", state.cols);
  if(state.view!=="list") p.set("v", state.view);
  if(openStoryId) p.set("s", openStoryId);
  const url = location.pathname + (p.toString()?"?"+p.toString():"");
  if(push) history.pushState({}, "", url); else history.replaceState({}, "", url);
}
function readURL(){
  const p = new URLSearchParams(location.search);
  state.query = p.get("q")||"";
  state.themes = new Set((p.get("t")||"").split(",").filter(x=>x!=="").map(i=>THEMES[+i]).filter(Boolean));
  state.conflicts = new Set((p.get("c")||"").split(",").filter(x=>x!=="").map(i=>CONFLICTS[+i]).filter(Boolean));
  state.branches = new Set((p.get("b")||"").split(",").filter(x=>x!=="").map(i=>BRANCHES[+i]).filter(Boolean));
  state.battles = new Set((p.get("bt")||"").split(",").filter(x=>x!=="").map(i=>BATTLES[+i]).filter(Boolean));
  state.fate = p.get("f")||"all";
  state.pick = p.get("p")||null;
  const uc=+p.get("cols"); state.cols = (uc===1||uc===2||uc===3) ? uc : loadCols();
  state.view = p.get("v")==="map" ? "map" : "list";
  openStoryId = p.get("s")||null;
}

const mapEligible = s => s.coords && s.coords.lat!=null && s.geo_precision!=="country" && s.geo_precision!=="none";
function renderCounts(list){

    `<span class="range">${range}</span>`;

/* ===================== render: cards ===================== */
function highlightSnippet(cit, q){
  const low = cit.toLowerCase(), i = low.indexOf(q.toLowerCase());
  if(i<0) return null;
  const start = Math.max(0, i-40), end = Math.min(cit.length, i+q.length+80);
  let snip = (start>0?"…":"") + cit.slice(start,end) + (end<cit.length?"…":"");
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");
  return esc(snip).replace(re, m=>`<mark>${m}</mark>`);
}
function cardHTML(s){
  const groupsPresent = new Set(s.categories.map(t=>THEME_GROUP[t]&&THEME_GROUP[t].key));
  const seg = GROUPS.map(g=>`<span class="blk" style="${groupsPresent.has(g.key)?`background:${groupColor(g)}`:""}"></span>`).join("");
  const lead = s.categories.find(t=>THEME_GROUP[t]);   // guard: unknown tag names must never crash a card
  const leadG = lead?THEME_GROUP[lead]:null;
  const leadChip = leadG ? `<span class="theme-chip" style="background:color-mix(in srgb, ${groupColor(leadG)} 13%, transparent);color:${groupColor(leadG)}">${esc(lead)}</span>` : "";
  const plus = s.categories.length>1 ? `<span class="plusn">+${s.categories.length-1}</span>` : "";
  const meta = [s.conflict, s.battle].filter(Boolean).join(" · ").toUpperCase();
  let body;
  const wide = state.cols===1;   // reading-list mode: ~3x the excerpt
  if(state.query){ const snip = highlightSnippet(s.citation, state.query); body = snip ? `<div class="card-excerpt snippet">${snip}</div>` : `<div class="card-excerpt">${esc(s.citation.slice(0,wide?900:170))}</div>`; }
  else body = `<div class="card-excerpt">${esc(s.citation.slice(0,wide?950:190))}</div>`;
  const fate = s.survived ? `<span class="fate-chip surv">Survived</span>` : `<span class="fate-chip fell">${starSVG()} Fell</span>`;
  const medal = `<span class="card-medal" aria-hidden="true"><img src="${medalSrc(s.branch)}" alt=""><span class="medal-branch">${esc(branchLabel(s.branch))}</span></span>`;
  const ini = esc(initials(s.name));
  const img = s.photo_url ? `<img src="${esc(s.photo_url)}" alt="" loading="lazy" decoding="async">` : "";
  // Left strip (shown only in 1/2-across): portrait or a quiet initials placeholder — never a broken-image icon.
  const photoStrip = `<span class="card-photo">${s.photo_url ? img : `<span class="ph">${ini}</span>`}</span>`;
  // Small round avatar (shown only in 3-across): swaps to the photo when present.
  const avatar = `<span class="avatar">${s.photo_url ? img : ini}</span>`;
  return `<button class="card" data-story="${esc(s.id)}">
    ${photoStrip}
    <span class="card-main">
      <div class="dept-row">${favBtn(s.id)}<span class="dept-seg" title="Theme groups">${seg}</span></div>
      <div class="card-top">
        ${avatar}
        <span class="card-id"><span class="card-name">${esc(s.name)}</span><span class="card-sub">${esc(s.rank)} · ${esc(s.branch)}</span></span>
      </div>
      <div class="card-meta">${esc(meta)}</div>
      ${body}
      <div class="card-foot">${leadChip}${plus}${fate}${likedChips(s.id)}</div>
    </span>
    ${medal}
  </button>`;
}
let gridToken = 0;            // cancels an in-flight chunk loop when a newer render starts
function renderGrid(list){
  const grid = $("#grid");
  if(!list.length){ grid.innerHTML = emptyHTML(); return; }
  // Chunked (~200 cards / frame) so the full ~3,500-record set won't block paint.
  // For the pilot (50) this is a single synchronous chunk — identical to before.
  const CHUNK = 200;
  const token = ++gridToken;
  grid.innerHTML = list.slice(0, CHUNK).map(cardHTML).join("");
  if(list.length <= CHUNK) return;
  let i = CHUNK;
  (function step(){
    if(token !== gridToken) return;   // superseded by a newer renderGrid
    grid.insertAdjacentHTML("beforeend", list.slice(i, i+CHUNK).map(cardHTML).join(""));
    i += CHUNK;
    if(i < list.length) requestAnimationFrame(step);
  })();
}
function emptyHTML(){
  const scope = FULL_LOADED
    ? `The archive holds ${STORIES.length.toLocaleString()} citations.`
    : `Pilot mode — ${STORIES.length} curated stories loaded.`;
  return `<div class="empty">

    <h2>No stories match this combination of filters.</h2>
    <p>${scope} Try loosening a filter.</p>
    <div class="actions">
      <button class="btn" id="removeLast">Remove last filter</button>
      <button class="btn-ghost" id="clearAll2">Clear all filters</button>
    </div>
  </div>`;
}

/* ===================== map (Leaflet) ===================== */
/* Full-corpus scale (~3,300 pins): survived pins are CANVAS circle markers (cheap to
   pan/zoom at ~3,000); fallen pins (~450) stay branded star divIcons — few enough for
   the DOM, and the star matters most there. Popups build lazily on click. */
let MAP=null, MAP_TILES=null, MAP_MARKERS=null, MAP_CANVAS=null, STAR_ICON=null, GHOST_STAR_ICON=null;
const isGhost = s => s.geo_precision==="campaign" || s.geo_precision==="region";
const ghostStarSVG = () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}" fill="none" stroke="var(--gold-line)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function tileURL(){
  const eff = document.documentElement.getAttribute("data-theme")==="dark" ? "dark_all" : "light_all";
  return `https://{s}.basemaps.cartocdn.com/${eff}/{z}/{x}/{y}{r}.png`;
}
function initMap(){
  if(MAP || typeof L==="undefined") return;
  MAP = L.map("map",{worldCopyJump:true,zoomControl:true,attributionControl:true,preferCanvas:true}).setView([20,5],2);
  MAP_TILES = L.tileLayer(tileURL(),{subdomains:"abcd",maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(MAP);
  MAP_MARKERS = L.layerGroup().addTo(MAP);
  MAP_CANVAS = L.canvas({padding:0.3});
  STAR_ICON = L.divIcon({className:"",html:`<div class="pin-star"><img src="${ASSETS.star}" alt=""></div>`,iconSize:[20,20],iconAnchor:[10,10]});
  GHOST_STAR_ICON = L.divIcon({className:"",html:`<div class="pin-star ghost">${ghostStarSVG()}</div>`,iconSize:[20,20],iconAnchor:[10,10]});
}
function refreshTiles(){ if(MAP && MAP_TILES) MAP_TILES.setUrl(tileURL()); }
function popupHTML(s){
  const meta=[s.conflict,s.battle].filter(Boolean).join(" · ").toUpperCase();
  const fate=s.survived?'Survived':`<span class="gold">${starSVG()} Fell</span>`;
  // ghost pins lead with the disclaimer; precise pins headline the place name
  const lead = isGhost(s)
    ? `<div class="mp-approxline">Approximate — precise location unknown; placed near ${esc(s.geo_place||"the theater of action")}</div>`
    : "";
  const approx = (!isGhost(s) && s.geo_precision==="locality") ? ' <span class="mp-approx">approximate</span>' : "";
  const place = (!isGhost(s) && s.geo_place) ? `<div class="mp-place">${esc(s.geo_place)}${approx}</div>` : "";
  return lead+
    `<div class="mp-kick">${esc((s.rank+" · "+s.branch).toUpperCase())}</div>`+
    `<div class="mp-name">${esc(s.name)}</div>`+
    place+
    `<div class="mp-meta">${esc(meta)}${meta?" · ":""}${fate}</div>`+
    `<button class="mp-link" data-story="${esc(s.id)}">Read the story →</button>`;
}
function renderMap(list){
  const wrap=$("#mapwrap");
  if(typeof L==="undefined"){ wrap.innerHTML='<div class="empty" style="position:absolute;inset:0;display:flex"><div class="kick">Map unavailable</div><p>The mapping library could not load. The list view has every story.</p></div>'; return; }
  initMap();
  MAP_MARKERS.clearLayers();
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim();
  const stroke = css.getPropertyValue("--surface").trim();
  const pts=[];
  list.forEach(s=>{
    // unmappable (none / residual country) stay off; count surfaced in countbar
    if(!mapEligible(s)) return;
    const c=s.coords;
    let m;
    if(isGhost(s)){
      // approximate: ghost variants — dashed ring survived, hollow star fallen
      m = s.survived
        ? L.circleMarker([c.lat,c.lng],{renderer:MAP_CANVAS,radius:5,weight:1.5,color:accent,dashArray:"3 3",fillColor:accent,fillOpacity:.10,opacity:.6})
        : L.marker([c.lat,c.lng],{icon:GHOST_STAR_ICON});
    } else {
      m = s.survived
        ? L.circleMarker([c.lat,c.lng],{renderer:MAP_CANVAS,radius:4.5,weight:1,color:stroke,fillColor:accent,fillOpacity:.85})
        : L.marker([c.lat,c.lng],{icon:STAR_ICON});
    }
    m.bindPopup(()=>popupHTML(s));
    MAP_MARKERS.addLayer(m); pts.push([c.lat,c.lng]);
  });
  setTimeout(()=>{ MAP.invalidateSize(); if(pts.length){ try{ MAP.fitBounds(pts,{padding:[50,50],maxZoom:6}); }catch(e){} } },0);
}

/* ===================== popovers ===================== */
let activePop = null;
function positionPop(pop, btn, wide){
  const r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + window.scrollY + 6) + "px";
  if(wide){
    const w = Math.min(760, window.innerWidth*0.92);
    let left = r.left + window.scrollX; if(left + w > window.innerWidth-12) left = window.innerWidth-12-w;
    pop.style.left = Math.max(12,left)+"px";
  } else {
    pop.style.left = (r.left + window.scrollX) + "px";
  }
}
function closePop(){ if(activePop){ activePop.pop.classList.remove("open"); activePop.btn.setAttribute("aria-expanded","false"); activePop=null; } $("#scrim").classList.remove("open"); }
function openPop(pop, btn, wide){
  if(activePop && activePop.pop===pop){ closePop(); return; }
  closePop();
  positionPop(pop, btn, wide);
  pop.classList.add("open"); btn.setAttribute("aria-expanded","true");
  $("#scrim").classList.add("open");
  activePop = {pop, btn};
}

      <div class="read-cite">${cite}</div>
      <div class="read-foot">Citation is a public-domain work of the U.S. Government, rendered in full and unedited. Source: ${s.cmohs_link?`<a href="${esc(s.cmohs_link)}" target="_blank" rel="noopener">cmohs.org</a>`:"cmohs.org"}.</div>
    </div>`;
  $("#detail").querySelector("[data-print]")?.addEventListener("click",()=>window.print());
  if(MAP) MAP.closePopup();          // dismiss any open pin popup as the modal takes over
  $("#detailScrim").classList.add("open");
  document.body.style.overflow="hidden";
  if(push) writeURL(true);
}
function closeDetail(fromPop){
  $("#detailScrim").classList.remove("open");
  document.body.style.overflow="";
  openStoryId=null;
  if(!fromPop) history.back();  // undo the pushState so URL reflects list
}

/* ===================== saved views ===================== */
function loadSaved(){ try{return JSON.parse(localStorage.getItem("moh_saved_views")||"[]");}catch(e){return [];} }
function persistSaved(){ localStorage.setItem("moh_saved_views", JSON.stringify(SAVED)); }
function snapshot(){ return {q:state.query, t:[...state.themes], c:[...state.conflicts], b:[...state.branches], bt:[...state.battles], f:state.fate, p:state.pick}; }
function applySnapshot(v){
  state.query=v.q||""; $("#search").value=state.query;
  state.themes=new Set(v.t||[]); state.conflicts=new Set(v.c||[]); state.branches=new Set(v.b||[]); state.battles=new Set(v.bt||[]); state.fate=v.f||"all";
  state.pick=v.p||null;
  syncFateUI(); render(true);
}
function saveCurrent(){
  const name = prompt("Name this view:");
  if(!name) return;
  SAVED.push({name:name.trim(), state:snapshot()}); persistSaved();
  render(false); toast("View saved");
}

/* ===================== toast ===================== */
function toast(msg){
  const el = document.createElement("div"); el.className="toast";
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${esc(msg)}`;
  $("#toastWrap").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .2s";setTimeout(()=>el.remove(),200);},2200);
}

/* ===================== theme ===================== */
function syncThemeUI(mode){
  const icons = {light:"☀", dark:"☾", auto:"◐"};
  $("#themeIcon").textContent = icons[mode]+" ";
  $("#themeLabel").textContent = mode[0].toUpperCase()+mode.slice(1);
}
function applyTheme(mode){
  localStorage.setItem("moh_theme", mode);
  const eff = mode==="auto" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : mode;
  document.documentElement.setAttribute("data-theme", eff);
  syncThemeUI(mode);
  refreshTiles();
  if(MAP && state.view==="map") renderMap(filtered());   // recolor canvas pins for the new theme
}
function cycleTheme(){
  const cur = localStorage.getItem("moh_theme")||"auto";
  const next = {auto:"light",light:"dark",dark:"auto"}[cur];
  applyTheme(next);
}

/* ===================== favorites layer (Supabase, plain fetch) ===================== */
// Anon key is safe to embed client-side (RLS enforces writes). NEVER a service_role key.
// Empty values = the layer stays hidden and the app behaves exactly as before.
const SUPABASE_URL = "https://emqpqnbdtjdamqdphloo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_4aMMXcENK5RbVl4zDu7k1g_l6u0CuL8";  // publishable (client-safe) key — sent via apikey header
const FAV = {on:false, profiles:[], prof:{}, byStory:new Map(), byUser:new Map(), session:null};
const HEART = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

function sbHeaders(auth){
  const h = {apikey:SUPABASE_ANON_KEY, "Content-Type":"application/json"};
  if(auth && FAV.session) h.Authorization = "Bearer "+FAV.session.access_token;
  return h;
}
async function sbFetch(path, opts={}, auth){
  const r = await fetch(SUPABASE_URL+path, {...opts, headers:{...sbHeaders(auth), ...(opts.headers||{})}});
  if(!r.ok) throw new Error(await r.text().catch(()=> "")||("http "+r.status));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
function saveSession(){ if(FAV.session) localStorage.setItem("moh_sb", JSON.stringify(FAV.session)); else localStorage.removeItem("moh_sb"); }
async function restoreSession(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem("moh_sb")||"null"); }catch(e){}
  if(!s || !s.refresh_token) return;
  try{
    const d = await sbFetch("/auth/v1/token?grant_type=refresh_token", {method:"POST", body:JSON.stringify({refresh_token:s.refresh_token})});
    FAV.session = {access_token:d.access_token, refresh_token:d.refresh_token, user_id:d.user.id};
  }catch(e){ FAV.session = null; }
  saveSession();
}
async function signIn(email, password){
  const d = await sbFetch("/auth/v1/token?grant_type=password", {method:"POST", body:JSON.stringify({email, password})});
  FAV.session = {access_token:d.access_token, refresh_token:d.refresh_token, user_id:d.user.id};
  saveSession(); renderAuth(); render(false);
}
function signOut(){
  sbFetch("/auth/v1/logout", {method:"POST"}, true).catch(()=>{});
  FAV.session = null; saveSession(); renderAuth(); render(false);
}
function addFavLocal(f){
  if(!FAV.byStory.has(f.story_id)) FAV.byStory.set(f.story_id, new Map());
  FAV.byStory.get(f.story_id).set(f.user_id, f.created_at);
  if(!FAV.byUser.has(f.user_id)) FAV.byUser.set(f.user_id, new Map());
  FAV.byUser.get(f.user_id).set(f.story_id, f.created_at);
}
function delFavLocal(uid, sid){
  const s = FAV.byStory.get(sid); if(s){ s.delete(uid); if(!s.size) FAV.byStory.delete(sid); }
  const u = FAV.byUser.get(uid); if(u) u.delete(sid);
}
async function loadFavLayer(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try{
    await restoreSession();
    const [profiles, favs] = await Promise.all([
      sbFetch("/rest/v1/profiles?select=id,display_name,color"),
      sbFetch("/rest/v1/favorites?select=user_id,story_id,created_at&limit=10000"),
    ]);
    FAV.profiles = profiles.sort((a,b)=>a.display_name.localeCompare(b.display_name));
    FAV.prof = Object.fromEntries(profiles.map(p=>[p.id, p]));
    favs.forEach(addFavLocal);
    FAV.on = true;
    document.body.classList.add("favs-on");
    renderAuth(); render(false);
    // a detail modal opened from a shared URL rendered before the layer arrived — refresh it
    if(openStoryId && $("#detailScrim").classList.contains("open")) openDetail(openStoryId, false);
  }catch(e){ /* Supabase unreachable — core browser unaffected, layer stays hidden */ }
}
function toggleFav(sid){
  if(!FAV.on) return;
  if(!FAV.session){
    toast("Sign in (bottom of the sidebar) to save favorites");
    const box = document.querySelector(".auth-box"); if(box) box.open = true;
    return;
  }
  const uid = FAV.session.user_id;
  const mine = FAV.byStory.get(sid)?.has(uid);
  if(mine){
    delFavLocal(uid, sid); render(false);
    sbFetch(`/rest/v1/favorites?user_id=eq.${uid}&story_id=eq.${encodeURIComponent(sid)}`,
      {method:"DELETE", headers:{Prefer:"return=minimal"}}, true)
      .catch(()=>{ addFavLocal({user_id:uid, story_id:sid, created_at:new Date().toISOString()}); render(false); toast("Couldn't remove favorite — check your connection"); });
  } else {
    addFavLocal({user_id:uid, story_id:sid, created_at:new Date().toISOString()}); render(false);
    sbFetch("/rest/v1/favorites", {method:"POST", headers:{Prefer:"return=minimal"},
      body:JSON.stringify({user_id:uid, story_id:sid})}, true)
      .catch(()=>{ delFavLocal(uid, sid); render(false); toast("Couldn't save favorite — check your connection"); });
  }
}
const userColor = p => `var(--uc-${(p && p.color) || "sky"})`;
function favBtn(sid){
  if(!FAV.on) return "";
  const mine = !!(FAV.session && FAV.byStory.get(sid)?.has(FAV.session.user_id));
  return `<span class="fav-btn" role="button" tabindex="0" aria-pressed="${mine}" data-fav="${esc(sid)}" title="${mine?"Remove from your favorites":"Add to your favorites"}">${HEART}</span>`;
}
function likedChips(sid){
  if(!FAV.on) return "";
  const m = FAV.byStory.get(sid);
  if(!m || !m.size) return "";
  const users = FAV.profiles.filter(p=>m.has(p.id));
  const names = users.map(p=>p.display_name).join(", ");
  return `<span class="liked-chips" title="Favorited by ${esc(names)}">`+
    users.map(p=>`<span class="lk" style="background:${userColor(p)}">${esc((p.display_name||"?")[0].toUpperCase())}</span>`).join("")+`</span>`;
}
function renderPicks(){
  const el = $("#railPicks");
  if(!FAV.on){ el.innerHTML=""; return; }
  const rows = [
    `<button class="rail-nav-item ${state.pick==="top"?"active":""}" data-pick="top"><span class="label">Top Stories</span><span class="rail-badge neutral">${FAV.byStory.size}</span></button>`
  ].concat(FAV.profiles.map(p=>
    `<button class="rail-nav-item ${state.pick===p.id?"active":""}" data-pick="${esc(p.id)}"><span class="label">${esc(p.display_name)}&rsquo;s Picks</span><span class="rail-badge neutral">${FAV.byUser.get(p.id)?.size||0}</span></button>`));
  el.innerHTML = `<div class="rail-section-label">Favorites</div><nav class="rail-nav">${rows.join("")}</nav>`;
}
function renderAuth(){
  const el = $("#railAuth");
  if(!FAV.on){ el.innerHTML=""; return; }
  if(FAV.session){
    const p = FAV.prof[FAV.session.user_id];
    el.innerHTML = `<div class="auth-user"><span class="lk" style="background:${userColor(p)}">${esc(((p&&p.display_name)||"?")[0].toUpperCase())}</span>`+
      `<span>${esc((p&&p.display_name)||"Signed in")}</span><button class="link-quiet" data-auth="out">Sign out</button></div>`;
  } else {
    el.innerHTML = `<details class="auth-box"><summary>Sign in to save favorites</summary>
      <form class="auth-form" data-auth="form">
        <input type="email" required placeholder="Email" autocomplete="email" data-auth="email">
        <input type="password" required placeholder="Password" autocomplete="current-password" data-auth="pass">
        <div class="auth-err" data-auth="err"></div>
        <div class="auth-row"><button class="btn-primary" type="submit">Sign in</button>
        <button type="button" class="link-quiet" data-auth="forgot">Forgot password</button></div>
      </form></details>`;
  }
}

/* ===================== full-dataset load + swap ===================== */
const INIT_SEARCH = location.search;   // original shared-link params (index-encoded vs FULL dataset)
let USER_TOUCHED = false;              // any interaction before the swap wins over re-parsing the URL
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{USER_TOUCHED=true;},{once:true,capture:true}));
function pilotMode(){
  $("#railKicker").textContent = "Medal of Honor · Pilot 50";
  $("#railFoot").textContent = "Pilot mode: 50 curated stories. The full collection loads when online.";
}
async function loadFullDataset(){
  if(location.protocol==="file:"){ pilotMode(); return; }   // fetch is blocked on file: — pilot is the offline mode
  $("#railKicker").textContent = "Medal of Honor · Loading…";
  try{
    const r = await fetch("data/stories.json");
    if(!r.ok) throw new Error("http "+r.status);
    const data = await r.json();
    if(!Array.isArray(data) || data.length < 1000) throw new Error("bad payload");
    STORIES = data; FULL_LOADED = true;
    indexData(); facetToken++;
    // URL params are index-encoded against the dataset's value lists; a shared full-mode
    // link parsed under pilot indexes maps wrong — re-parse the original params now,
    // unless the user has already started filtering.
    if(!USER_TOUCHED && INIT_SEARCH){
      history.replaceState({}, "", location.pathname + INIT_SEARCH);
      readURL(); $("#search").value = state.query; syncFateUI(); syncColsUI();
    }
    render(false);
    $("#railKicker").textContent = `Medal of Honor · ${STORIES.length.toLocaleString()} Stories`;
    $("#railFoot").textContent = `${STORIES.length.toLocaleString()} citations (through the 2014 presentations). Locations approximate.`;
    if(openStoryId && !$("#detailScrim").classList.contains("open")) openDetail(openStoryId,false);
    toast(`Full collection loaded — ${STORIES.length.toLocaleString()} stories`);
  }catch(e){ pilotMode(); }
}

/* ===================== fate UI ===================== */
function syncFateUI(){ document.querySelectorAll("[data-fate]").forEach(b=>b.classList.toggle("active", b.dataset.fate===state.fate)); }

/* ===================== cards-per-row UI ===================== */
function syncColsUI(){ document.querySelectorAll("[data-cols]").forEach(b=>b.classList.toggle("active", +b.dataset.cols===state.cols)); }
function setCols(n){
  if(n!==1&&n!==2&&n!==3) return;
  state.cols = n; localStorage.setItem("moh_cols", n);
  syncColsUI(); render(false);
}

/* ===================== events ===================== */
let searchTimer=null;
$("#search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ state.query = e.target.value.trim(); render(false); }, 180);
});
document.querySelectorAll("[data-fate]").forEach(b=>b.addEventListener("click",()=>{ state.fate=b.dataset.fate; syncFateUI(); render(false); }));
document.querySelectorAll("[data-cols]").forEach(b=>b.addEventListener("click",()=>setCols(+b.dataset.cols)));
$("#btnThemes").addEventListener("click", ()=>{ if(activePop&&activePop.pop===$("#popThemes")) closePop(); else openThemes(); });
$("#btnConflict").addEventListener("click", ()=>{ const p=$("#popConflict"); if(activePop&&activePop.pop===p){closePop();return;} buildListMenu(p,CONFLICTS,state.conflicts,"conflicts",v=>facet("conflicts",s=>s.conflict===v)); openPop(p,$("#btnConflict")); });
$("#btnBranch").addEventListener("click", ()=>{ const p=$("#popBranch"); if(activePop&&activePop.pop===p){closePop();return;} buildListMenu(p,BRANCHES,state.branches,"branches",v=>facet("branches",s=>s.branch===v)); openPop(p,$("#btnBranch")); });
$("#btnBattle").addEventListener("click", ()=>{ const p=$("#popBattle"); if(activePop&&activePop.pop===p){closePop();return;} buildListMenu(p,BATTLES,state.battles,"battles",v=>facet("battles",s=>s.battle===v)); openPop(p,$("#btnBattle")); });
$("#scrim").addEventListener("click", closePop);

// rail group -> open theme menu
$("#railGroups").addEventListener("click", e=>{ if(e.target.closest(".theme-row")) openThemes(); });

// favorites: picks nav, auth box, detail heart
$("#railPicks").addEventListener("click", e=>{
  const b=e.target.closest("[data-pick]"); if(!b) return;
  state.pick = state.pick===b.dataset.pick ? null : b.dataset.pick;
  state.view = "list"; render(true);
  if(window.innerWidth<=820) $("#rail").classList.remove("open");
});
$("#railAuth").addEventListener("click", e=>{
  const a=e.target.closest("[data-auth]"); if(!a) return;
  if(a.dataset.auth==="out"){ signOut(); toast("Signed out"); }
  else if(a.dataset.auth==="forgot"){
    const email = ($("#railAuth [data-auth=email]")||{}).value||"";
    if(!email){ $("#railAuth [data-auth=err]").textContent = "Enter your email first, then tap Forgot password."; return; }
    sbFetch("/auth/v1/recover",{method:"POST",body:JSON.stringify({email})})
      .then(()=>toast("Password-reset email sent"))
      .catch(()=>{ $("#railAuth [data-auth=err]").textContent = "Couldn't send the reset email — try again."; });
  }
});
$("#railAuth").addEventListener("submit", e=>{
  if(!e.target.matches("[data-auth=form]")) return;
  e.preventDefault();
  const err=$("#railAuth [data-auth=err]"); err.textContent="";
  signIn($("#railAuth [data-auth=email]").value.trim(), $("#railAuth [data-auth=pass]").value)
    .then(()=>toast("Signed in"))
    .catch(ex=>{ err.textContent = /invalid/i.test(ex.message) ? "Wrong email or password." : "Sign-in failed — check your connection."; });
});
$("#detail").addEventListener("click", e=>{
  const f=e.target.closest(".fav-btn"); if(!f) return;
  e.stopPropagation();
  toggleFav(f.dataset.fav);
  if(openStoryId) openDetail(openStoryId, false);   // refresh heart + chips in place
});
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{
  const nav=b.dataset.nav;
  if(nav==="stories"){ state.view="list"; render(true); }
  else if(nav==="map"){ state.view="map"; render(true); }
  else if(nav==="saved"){ document.querySelector(".ab-saved")?.scrollIntoView({behavior:"smooth",block:"center"}); }
  if(window.innerWidth<=820) $("#rail").classList.remove("open");
}));

// grid + activebar delegation
$("#grid").addEventListener("click", e=>{
  const f=e.target.closest(".fav-btn"); if(f){ e.stopPropagation(); toggleFav(f.dataset.fav); return; }
  const card=e.target.closest(".card"); if(card){ openDetail(card.dataset.story,true); return; }
  if(e.target.id==="removeLast"){ removeLastFilter(); }
  if(e.target.id==="clearAll2"){ clearAll(); }
});
$("#activebar").addEventListener("click", e=>{
  const x=e.target.closest("[data-x]");
  if(x){ const [k,val]=x.dataset.x.split(/:(.+)/);
    if(k==="theme") state.themes.delete(decodeURIComponent(val));
    else if(k==="conflict") state.conflicts.delete(decodeURIComponent(val));
    else if(k==="branch") state.branches.delete(decodeURIComponent(val));
    else if(k==="battle") state.battles.delete(decodeURIComponent(val));
    else if(k==="fate") state.fate="all";
    else if(k==="pick") state.pick=null;
    else if(k==="query"){ state.query=""; $("#search").value=""; }
    syncFateUI(); render(false); return; }
  if(e.target.id==="clearAll"){ clearAll(); return; }
  if(e.target.id==="saveCurrent"){ saveCurrent(); return; }
  const dv=e.target.closest("[data-delview]"); if(dv){ SAVED.splice(+dv.dataset.delview,1); persistSaved(); render(false); toast("View deleted"); return; }
  const v=e.target.closest("[data-view]"); if(v){ applySnapshot(SAVED[+v.dataset.view].state); }
});

function removeLastFilter(){
  if(state.query){ state.query=""; $("#search").value=""; }
  else if(state.themes.size){ state.themes.delete([...state.themes].pop()); }
  else if(state.conflicts.size){ state.conflicts.delete([...state.conflicts].pop()); }
  else if(state.branches.size){ state.branches.delete([...state.branches].pop()); }
  else if(state.battles.size){ state.battles.delete([...state.battles].pop()); }
  else if(state.pick){ state.pick=null; }
  else if(state.fate!=="all"){ state.fate="all"; }
  syncFateUI(); render(false);
}
function clearAll(){
  state.themes.clear(); state.conflicts.clear(); state.branches.clear(); state.battles.clear(); state.fate="all"; state.pick=null; state.query=""; $("#search").value="";
  syncFateUI(); render(false); toast("Filters cleared");
}

$("#detailClose").addEventListener("click", ()=>closeDetail(false));
$("#detailScrim").addEventListener("click", e=>{ if(e.target===$("#detailScrim")) closeDetail(false); });
$("#themeToggle").addEventListener("click", cycleTheme);
$("#menuToggle").addEventListener("click", ()=>$("#rail").classList.toggle("open"));

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#detailScrim").classList.contains("open")) closeDetail(false); else closePop(); }
  if(e.key==="/" && document.activeElement!==$("#search")){ e.preventDefault(); $("#search").focus(); }
});
window.addEventListener("resize", ()=>{ if(activePop) positionPop(activePop.pop, activePop.btn, activePop.pop.classList.contains("theme-menu")); });

// popstate: sync from URL (handles detail back-button + shared links)
window.addEventListener("popstate", ()=>{
  readURL(); $("#search").value=state.query; syncFateUI(); syncColsUI();
  facetToken++;   // state changed outside render() — invalidate facet masks
  const list=filtered(); $("#grid").dataset.cols=state.cols; renderRail(); renderActive(); renderCounts(list); renderGrid(list); syncBtnPills();
  setView(state.view); if(state.view==="map") renderMap(list);
  if(openStoryId){ openDetail(openStoryId,false); } else if($("#detailScrim").classList.contains("open")){ closeDetail(true); }
});

$("#legendStar").src = ASSETS.star;
document.querySelectorAll(".star-slot").forEach(e=>{ e.innerHTML = starSVG(); });
document.querySelectorAll(".ghost-star-slot").forEach(e=>{ e.innerHTML = ghostStarSVG(); });
applyTheme(localStorage.getItem("moh_theme")||"auto");
